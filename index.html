<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<script>
/* viewport-fit=cover нужен только iPhone: страница заходит под вырез и
   полоску «домой» и сама отступает от них через safe-area. Chrome на
   Android от него перестаёт красить панель жестов внизу по теме браузера
   (тёмная тема — тёмная полоса, светлая — светлая), как на всех прочих
   сайтах, и оставляет там свою светлую подложку; она же мелькала на пол
   экрана, пока выезжала клавиатура. Поэтому на Android его убираем. */
(function(){
  if(!/Android/i.test(navigator.userAgent)) return;
  const m = document.querySelector('meta[name=viewport]');
  if(m) m.setAttribute('content', m.getAttribute('content').replace(/,\s*viewport-fit=cover/, ''));
})();
</script>
<title>WordDeck — изучение языков</title>
<meta name="theme-color" content="#1B1815">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* облегчённый режим ставится до первой отрисовки — иначе слабый телефон
   успеет нарисовать тяжёлый вариант и только потом переключится */
try{ if(localStorage.getItem('worddeck_perf') === 'lite') document.documentElement.classList.add('lite'); }catch(e){}
/* тема — тоже до первой отрисовки. Телефон берёт цвет системных зон
   (полоса под таб-баром у «домой», строка состояния) с первого кадра
   и потом его не перечитывает: пока тема включалась скриптом в конце
   страницы, внизу оставалась светлая полоса от светлой темы по умолчанию */
(function(){
  let v = 'dark';
  try{ v = localStorage.getItem('worddeck_theme') || 'dark'; }catch(e){}
  if(v === 'system') v = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  if(v !== 'light') v = 'dark';
  document.documentElement.setAttribute('data-theme', v);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', v === 'dark' ? '#1B1815' : '#FAF6EF');
})();
</script>
<style>
/* ===================================================================
   WordDeck 2.0 — оформление
   Токены — из макета «WordDeck 2.0 · редизайн». Тёмная тема основная.
   Акцент (--gold) выбирается в «Оформлении» из семи; производные
   --gold-soft и --gold-text считает setAccent(), чтобы не зависеть
   от поддержки color-mix в старых браузерах.
   Старые имена (--muted, --surf2, --goldSoft…) оставлены псевдонимами:
   ими пользуются инлайн-стили в разметке и в коде.
   =================================================================== */
:root{
  --f:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --ff:var(--f);
  /* ступени рангов: от глины к золоту, одинаковы в обеих темах */
  --r1:#9C8B7A;--r2:#8F9488;--r3:#7E9070;--r4:#5F8F8B;--r5:#6E7BA0;
  --r6:#8C6A92;--r7:#B87957;--r8:#C98E3E;--r9:#D9AE5C;--r10:#F0C66E;
  --r11:#F5D98A;--r12:#E8A0A6;--r13:#B98BE0;--r14:#7FC8F0;--r15:#AFC0DA;
  --rad-s:12px;--rad-m:20px;--rad-l:28px;--rad-xl:32px;--pill:999px;

  /* светлая */
  --bg:#FAF6EF;--bg-2:#F4EDE1;--surf:#FFFFFF;--surf-2:#F3ECE0;--surf-3:#EADFCD;
  --ink:#1C1814;--ink-2:#5E554B;--ink-3:#766C60;
  --line:rgba(28,24,20,.08);--line-2:rgba(28,24,20,.15);
  --gold:#C99A4E;--gold-ink:#1C1814;--gold-soft:#F1E4CB;--gold-text:#8A6522;
  --teal:#4E837D;--sage:#6E8360;--sage-soft:rgba(126,144,112,.16);--terra:#B05F40;
  --btn:#1C1814;--btn-ink:#FAF6EF;--tab:rgba(250,246,239,.92);--tabGlass:rgba(250,246,239,.74);
  --shadow:0 22px 40px -28px rgba(60,40,20,.55);--grain:rgba(60,40,20,.0315);
  --okInk:#3E4B33;--errSoft:rgba(176,95,64,.13);--errInk:#7A3E28;--shadowInk:60,40,20;
  --scrim:rgba(20,16,12,.5);
  --glass1:rgba(28,24,20,.08);--glass2:rgba(28,24,20,.03);--glassB:rgba(28,24,20,.12);--glassTail:rgba(28,24,20,.08);
  color-scheme:light;

  /* псевдонимы прежних токенов */
  --muted:var(--ink-2);--surf2:var(--surf-2);--goldSoft:var(--gold-soft);--goldInk:var(--gold-text);
  --btnInk:var(--btn-ink);--heroA:var(--surf);--heroB:var(--surf-2);--okSoft:var(--sage-soft);--err:var(--terra);
}
html[data-theme=dark]{
  --bg:#1B1815;--bg-2:#211D19;--surf:#2A2520;--surf-2:#332D27;--surf-3:#3E3730;
  --ink:#F7EFE0;--ink-2:#B9AF9F;--ink-3:#9A9083;
  --line:rgba(247,239,224,.09);--line-2:rgba(247,239,224,.16);
  --gold:#E3B871;--gold-ink:#1A140C;--gold-soft:rgba(227,184,113,.16);--gold-text:#E8C283;
  --teal:#7DB5AE;--sage:#9DB38A;--sage-soft:rgba(157,179,138,.15);--terra:#E08E6D;
  --btn:#F7EFE0;--btn-ink:#14110E;--tab:rgba(34,30,26,.92);--tabGlass:rgba(34,30,26,.72);
  --shadow:0 24px 44px -26px rgba(0,0,0,.75);--grain:rgba(255,240,220,.035);
  --okInk:#C9D8B9;--errSoft:rgba(224,142,109,.17);--errInk:#F0B9A3;--shadowInk:0,0,0;
  --scrim:rgba(10,8,6,.62);
  --glass1:rgba(247,239,224,.14);--glass2:rgba(247,239,224,.05);--glassB:rgba(247,239,224,.16);--glassTail:rgba(247,239,224,.12);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* фон и у корня: им закрашиваются зоны за пределами #app — под «домой» и при оттяжке */
html{background:var(--bg)}
body{
  background:var(--bg);font-family:var(--f);-webkit-font-smoothing:antialiased;
  color:var(--ink);overscroll-behavior:none;
}
/*
   Фикс светлой полосы под таб-баром на iPhone. Safari красит зону
   у полоски «домой» (и при оттяжке) по фиксированному элементу у края
   экрана; без такого элемента там оставался чужой светлый цвет.
   Подложка на весь экран того же цвета, что тема (как на сайте-портфолио).
*/
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:var(--bg);pointer-events:none;
}
input,button,select,textarea{font-family:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--gold-text);text-decoration:none}
input[type=range]{accent-color:var(--gold)}

/* ---------- корпус ---------- */
#shell{min-height:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center}
#app{
  position:relative;width:100%;height:100dvh;overflow:hidden;background:var(--bg);
  display:flex;flex-direction:column;isolation:isolate;
}
/* зерно фона — выключается в «Оформлении» и в облегчённом режиме */
#app::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--grain) .8px,transparent .8px);background-size:4px 4px;
}
html.noGrain #app::after{display:none}
@media (min-width:760px) and (max-width:899px) and (min-height:900px){
  #shell{padding:28px;background:var(--bg-2)}
  #app{width:390px;height:844px;border-radius:44px;border:1px solid var(--line-2);box-shadow:var(--shadow)}
}

/* ---------- экраны ---------- */
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;padding-top:var(--topInset,0px)}
.screen.on{display:flex}
#app{--topInset:env(safe-area-inset-top,0px)}
/* полосы прокрутки не показываем: на десктопе светлая полоса резала
   колонку и залезала на элементы, а колесо и тачпад работают и без неё */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar,#sheet::-webkit-scrollbar{display:none}
#sheet{scrollbar-width:none}
.scroll.hasTabs{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
.scroll.hasMini{padding-bottom:calc(208px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 20px}
/* мягкое свечение цвета темы под шапкой экрана */
/* свечение лежит на уровне экрана, а не колонки: на десктопе оно тянется
   до правого края окна, а не обрезается по ширине контента */
.glow{position:absolute;z-index:0;left:-60px;right:-60px;top:-80px;height:420px;pointer-events:none;
  background:radial-gradient(60% 60% at 70% 30%,var(--glow,transparent),transparent 70%);transition:opacity .2s linear}
.topBar,.tHead{z-index:1}

/* ---------- типографика ---------- */
.h1{font:800 32px/1.04 var(--f);letter-spacing:-.035em;color:var(--ink);text-wrap:pretty}
.h2{font:800 21px/1.15 var(--f);letter-spacing:-.02em;color:var(--ink)}
.sub{font:400 13.5px/1.45 var(--f);color:var(--ink-2)}
.eyebrow{font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.dim{color:var(--ink-2);font-size:12.5px;line-height:1.5}
.ok{color:var(--sage)} .bad{color:var(--terra)}

/* ---------- поверхности ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.cardSoft{background:var(--gold-soft);border:1px solid var(--line);border-radius:22px;padding:16px 18px}

/* ---------- кнопки ---------- */
.btn{
  width:100%;min-height:52px;padding:0 24px;border-radius:var(--pill);border:0;
  background:var(--btn);color:var(--btn-ink);font:700 15px/1.2 var(--f);cursor:pointer;
}
.btn:disabled,.btnGold:disabled,.btnGhost:disabled{opacity:.5;cursor:default;transform:none}
.btnGhost{
  width:100%;min-height:48px;padding:0 20px;border-radius:var(--pill);background:transparent;
  border:1px solid var(--line-2);color:var(--ink);font:700 14px/1.2 var(--f);cursor:pointer;
}
.btnGold{
  width:100%;min-height:52px;padding:0 22px;border-radius:var(--pill);border:0;
  background:var(--gold);color:var(--gold-ink);font:800 15px/1.2 var(--f);cursor:pointer;
}
.btnDanger{background:var(--terra);color:#14110E}
.iconBtn{
  width:44px;height:44px;border-radius:var(--pill);border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink);padding:0;
}
.iconBtn.soft{background:var(--surf-2)}
.linkBtn{border:0;background:transparent;font:600 13px var(--f);color:var(--ink-2);cursor:pointer;padding:6px 0}
.row2{display:flex;gap:10px}
.row2>*{flex:1;width:auto}

/* ---------- поля ---------- */
.field{margin-top:14px}
.field label{display:block;font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.inp{
  width:100%;padding:15px 18px;border-radius:18px;border:1.5px solid transparent;
  background:var(--surf-2);color:var(--ink);font:500 15px var(--f);outline:none;
}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5;font-weight:400}
select.inp{appearance:none;-webkit-appearance:none;background-image:none}

/* ---------- чипы, сегменты, сетки выбора ---------- */
.chipRow{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  min-height:40px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-2);background:transparent;
  font:600 13.5px/1.2 var(--f);color:var(--ink);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip.gold{background:var(--gold-soft);border-color:var(--gold);font-weight:700}
.chip.danger{color:var(--terra);border-color:var(--terra)}
.chip .cnt{height:24px;min-width:24px;padding:0 7px;border-radius:99px;background:var(--terra);color:#14110E;
  display:inline-flex;align-items:center;justify-content:center;font:800 12px/1 var(--f)}
.chipEq{flex:1;min-height:48px;padding:0;border-radius:16px;font:700 14px var(--f)}
.chipEq.sel{font-weight:800}
.chipEq:disabled{opacity:.38;cursor:default}
.seg{height:44px;border-radius:var(--pill);background:var(--surf-2);padding:4px;display:flex;gap:4px}
.seg>button{
  flex:1;min-width:0;border:0;border-radius:var(--pill);background:transparent;cursor:pointer;
  font:600 14px/1 var(--f);color:var(--ink-2);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg>button.on{background:var(--ink);color:var(--bg);font-weight:700}
.pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickCell{
  position:relative;padding:14px 16px;border-radius:22px;text-align:start;cursor:pointer;
  background:var(--surf);border:1px solid var(--line);min-height:68px;
}
.pickCell.sel{background:var(--gold-soft);border:1.5px solid var(--gold)}
.pickCell b{display:block;font:700 15.5px/1.2 var(--f);color:var(--ink)}
.pickCell span{display:block;font:500 12px/1.3 var(--f);color:var(--ink-2);margin-top:4px}
.pickCell .tick{position:absolute;top:10px;inset-inline-end:10px;width:22px;height:22px;border-radius:99px;background:var(--gold);
  display:none;align-items:center;justify-content:center;margin:0}
.pickCell.sel .tick{display:flex}

/* ---------- прогресс онбординга: пять штрихов ---------- */
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:5px;border-radius:99px;background:var(--surf-3)}
.dots i.on{background:var(--gold)}

/* ---------- шапка экрана ---------- */
.topBar{position:relative;display:flex;align-items:center;gap:4px;min-height:52px;padding:4px 8px 0 20px;flex:none}
.topBar.back{padding-left:8px}
.topBar .ttl{flex:1;min-width:0;font:800 21px/1 var(--f);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topBar .ttl.c{text-align:center;font:700 17px/1 var(--f);letter-spacing:0}
.brand{flex:1;font:800 25px/1 var(--f);letter-spacing:-.035em}
.streakChip{height:36px;padding:0 13px;border-radius:var(--pill);background:var(--surf-2);display:inline-flex;align-items:center;gap:7px;
  font:700 13px/1 var(--f);border:0;color:var(--ink);cursor:pointer;white-space:nowrap}
.streakChip i{width:8px;height:8px;border-radius:99px;background:var(--gold);display:block}
.streakChip.cold i{background:var(--ink-3)}
.bellBtn{position:relative}
.bellBtn .badge{position:absolute;top:6px;inset-inline-end:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--terra);color:#14110E;font:800 11px/18px var(--f);text-align:center;border:2px solid var(--bg)}

/* ---------- аватары и кольца ---------- */
.ava{display:flex;border-radius:999px;overflow:hidden;align-items:flex-start;justify-content:center;flex:none;
  background:var(--tint,var(--gold-soft))}
.ava img{width:80%;margin-top:6%;pointer-events:none}
.ring{display:block;border-radius:999px;padding:3px;background:var(--line-2);flex:none;position:relative}
.ring.live{background:conic-gradient(from var(--rot,210deg),var(--gold),var(--r7),var(--r9),var(--gold))}
.ring.rank{background:conic-gradient(from 200deg,var(--rc,var(--r7)),var(--rc2,var(--r8)),var(--rc3,var(--r9)),var(--rc,var(--r7)))}
.ring>.ava,.ring>.avFace{width:100%;height:100%;border:3px solid var(--bg)}
.ring .plus{position:absolute;inset-inline-end:-1px;bottom:-1px;width:24px;height:24px;border-radius:99px;background:var(--gold);
  border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;color:var(--gold-ink);font:800 14px/1 var(--f)}

/* ---------- сторис ---------- */
.stories{display:flex;gap:14px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.story .ring{width:70px;height:70px}
.story span.nm{font:600 11.5px/1.2 var(--f);max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story.quiet span.nm{font-weight:500;color:var(--ink-2)}
.story.invite .ring{background:transparent;border:1.5px dashed var(--line-2);padding:0;display:flex;align-items:center;justify-content:center;
  font:300 30px/1 var(--f);color:var(--ink-2)}

/* ---------- герой урока ---------- */
.hero{
  position:relative;margin:20px 16px 0;min-height:236px;border-radius:30px;overflow:hidden;
  background:var(--surf-2);
  background:linear-gradient(155deg,color-mix(in oklch,var(--tint,var(--r7)) 55%,var(--bg)) 0%,color-mix(in oklch,var(--tint,var(--r7)) 20%,var(--bg)) 100%);
  box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;
}
.hero>img{position:absolute;inset-inline-end:-14px;bottom:-12px;height:206px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.3));pointer-events:none}
.hero .in{position:relative;padding:22px 0 20px 22px;width:62%;max-width:280px}
.heroTag{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:var(--pill);
  background:rgba(127,127,127,.18);font:700 10.5px/1 var(--f);letter-spacing:.12em;text-transform:uppercase}
.hero .t{font:800 27px/1.08 var(--f);letter-spacing:-.03em;margin-top:12px;text-wrap:pretty}
.hero .s{font:500 13px/1.3 var(--f);margin-top:8px}
.playRow{display:flex;align-items:center;gap:12px;margin-top:22px;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.playBtn{width:54px;height:54px;border-radius:999px;background:var(--gold);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 24px -10px rgba(0,0,0,.6);flex:none;color:var(--gold-ink)}
.playRow b{font:700 15px/1 var(--f)}

/* ---------- полки ---------- */
.shelfHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:30px 20px 12px}
.shelfHead button{border:0;background:none;font:600 13px/1 var(--f);color:var(--ink-2);cursor:pointer;padding:6px 0;white-space:nowrap}
.shelf{display:flex;gap:12px;padding:0 16px 4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf>*{scroll-snap-align:start;flex:none}
.dueCard{width:144px;height:168px;border-radius:22px;background:var(--surf);border:1px solid var(--line);padding:16px;
  display:flex;flex-direction:column;text-align:start;cursor:pointer;color:var(--ink)}
.dueCard .when{font:600 11px/1 var(--f);color:var(--ink-3)}
.dueCard .when.late{color:var(--terra)}
.dueCard b{font:700 17px/1.2 var(--f);margin-top:auto;overflow-wrap:anywhere;hyphens:auto}
.dueCard small{font:400 13px/1.3 var(--f);color:var(--ink-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miniBar{height:4px;border-radius:99px;background:var(--surf-3);margin-top:14px;display:block;overflow:hidden}
.miniBar>i{display:block;height:4px;border-radius:99px;background:var(--gold)}
.topicCard{position:relative;width:240px;height:136px;border-radius:24px;overflow:hidden;padding:16px 18px;text-align:start;cursor:pointer;
  color:var(--ink);border:1px solid var(--line);background:var(--surf-2);
  background:linear-gradient(150deg,color-mix(in oklch,var(--tint,var(--r5)) 50%,var(--bg)),color-mix(in oklch,var(--tint,var(--r5)) 16%,var(--bg)))}
.topicCard img{position:absolute;inset-inline-end:-6px;bottom:-8px;height:118px;pointer-events:none}
.topicCard .k{display:block;font:700 10.5px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;position:relative}
.topicCard b{display:block;font:800 21px/1.1 var(--f);letter-spacing:-.02em;margin-top:10px;position:relative;max-width:180px;text-wrap:pretty;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.matAdd{width:118px;height:124px;border-radius:22px;border:1.5px dashed var(--line-2);background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--ink-2);cursor:pointer}
.matAdd b{font:300 30px/1 var(--f)}
.matAdd span{font:600 12.5px/1.2 var(--f);text-align:center}
.matCard{width:170px;height:124px;border-radius:22px;background:var(--surf-2);border:0;padding:15px 16px;display:flex;flex-direction:column;
  text-align:start;cursor:pointer;color:var(--ink)}
.matCard .k{font:700 10.5px/1 var(--f);letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.matCard b{font:700 15px/1.25 var(--f);margin-top:10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.matCard small{font:500 12px/1 var(--f);color:var(--ink-2);margin-top:auto}
.actCard{width:262px;border-radius:22px;background:var(--surf);border:1px solid var(--line);padding:12px 6px 12px 14px;display:flex;align-items:center;gap:12px}
.actCard .ava{width:46px;height:46px}
.actCard .tx{flex:1;min-width:0;cursor:pointer}
.actCard b{display:block;font:700 14.5px/1.2 var(--f)}
.actCard b em{font-style:normal;font-weight:500;color:var(--ink-3)}
.actCard small{display:block;font:400 12.5px/1.35 var(--f);color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{height:44px;min-width:44px;padding:0 8px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;color:var(--ink-2);font:700 13px/1 var(--f);flex:none}
.heart svg{fill:none;stroke:currentColor}
.heart.on{color:var(--terra)}
.heart.on svg{fill:var(--terra);stroke:var(--terra)}
.emptyCard{width:260px;min-height:100px;border-radius:22px;border:1.5px dashed var(--line-2);padding:16px;color:var(--ink-2);
  font:500 13px/1.45 var(--f);display:flex;align-items:center}

/* ---------- мини-плеер незаконченного урока ---------- */
#miniPlayer{
  position:absolute;left:8px;right:8px;bottom:calc(108px + env(safe-area-inset-bottom,0px));z-index:6;height:62px;border-radius:16px;
  overflow:hidden;display:none;align-items:center;gap:12px;padding:0 6px 0 9px;cursor:pointer;
  background:var(--surf-2);background:color-mix(in oklch,var(--tint,var(--r7)) 34%,var(--surf-2));
  box-shadow:0 16px 30px -18px rgba(0,0,0,.7);border:0;color:var(--ink);text-align:start;width:auto;
}
#miniPlayer.on{display:flex}
#miniPlayer .th{width:44px;height:44px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;flex:none;
  background:linear-gradient(150deg,var(--tint,var(--r7)),var(--r8))}
#miniPlayer .th img{width:40px;margin-top:3px}
#miniPlayer .tx{flex:1;min-width:0}
#miniPlayer b{display:block;font:700 13.5px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniPlayer small{display:block;font:500 12px/1.3 var(--f);color:var(--ink-2);margin-top:2px}
#miniPlayer .pl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
#miniPlayer .pr{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--line-2)}
#miniPlayer .pr i{display:block;height:2px;background:var(--gold)}

/* ---------- таб-бар ----------
   На телефоне — плавающая капсула из матового стекла. Выбранный пункт
   подсвечен своей капсулой в цвете акцента. Кнопка тренера выше остальных
   и выступает над краем на 16 px; над ней капсула поднимается куполом.
   Стекло нарисовано псевдоэлементом, а не самим #tabbar: элемент с
   backdrop-filter отрезал бы размытие купола от страницы под ним. */
#tabbar{
  position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;
  height:70px;padding:6px;border-radius:35px;
  display:none;align-items:flex-end;justify-content:space-between;
}
#tabbar::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:var(--tabGlass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 34px -14px rgba(0,0,0,.55);
}
#tabbar.on{display:flex}
.tabItem{
  flex:1 1 0;min-width:0;max-width:68px;height:58px;border-radius:29px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  color:var(--ink-3);background:none;border:0;padding:0;transition:background-color .2s,color .2s;
}
.tabItem svg{stroke-width:1.8}
.tabItem.sel{color:var(--gold-text);background:color-mix(in oklch,var(--gold) 20%,transparent)}
.tabItem.sel svg{stroke-width:2.1}
.tabItem span{font:600 10px/1 var(--f);white-space:nowrap}
.tabItem.sel span{font-weight:700}
/* пункт тренера: подпись на одной линии с соседними (отступ снизу 10 px),
   круг почти касается подписи и выступает над капсулой на 11 px;
   купол — круг на 6 px шире кнопки, виден только выше края капсулы */
.tabItem.mid,.tabItem.mid.sel{flex:none;width:72px;max-width:none;height:auto;padding-bottom:10px;border-radius:0;
  justify-content:flex-start;gap:0;color:var(--ink);background:none;position:relative}
.tabItem.mid::before{
  content:'';position:absolute;left:50%;top:-6px;width:68px;height:68px;margin-left:-34px;z-index:-1;
  border-radius:50%;background:var(--tabGlass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--line-2);box-sizing:border-box;
  clip-path:inset(0 0 calc(100% - 18px) 0);pointer-events:none;
}
.tabItem.mid .midCircle{
  width:56px;height:56px;border-radius:999px;background:var(--gold);overflow:hidden;
  box-shadow:0 8px 18px -8px rgba(0,0,0,.6);
  display:flex;align-items:flex-start;justify-content:center;flex:none;margin-bottom:-1px;
}
.tabItem.mid .midCircle img{width:60px;margin-top:4px}
.tabItem.mid span{font-weight:700}
.railOnly{display:none!important}
#railBrand{display:none}

/* ---------- чат: подача Direct ---------- */
#chatBox{padding:14px 14px 0;display:flex;flex-direction:column;gap:8px}
.dateSep{text-align:center;font:600 11.5px/1 var(--f);color:var(--ink-3);padding:6px 0 4px}
.msg{max-width:min(272px,80%);padding:11px 15px;font:400 14.5px/1.4 var(--f);white-space:pre-wrap;word-wrap:break-word;text-wrap:pretty}
.msgAi{border-radius:22px 22px 22px 6px;background:var(--surf-2);color:var(--ink)}
.msgMe{border-radius:22px 22px 6px 22px;background:var(--gold);color:var(--gold-ink);font-weight:500}
.msgWrap{display:flex;gap:8px;align-items:flex-end}
.msgWrap.me{justify-content:flex-end}
.msgWrap .ava{width:28px;height:28px}
.msgWrap .ava img{width:32px;margin-top:2px}
.msgSys{
  align-self:center;max-width:100%;text-align:center;background:var(--surf-2);
  border-radius:16px;color:var(--ink-2);font:600 12.5px/1.4 var(--f);padding:7px 13px;
  display:flex;align-items:center;gap:8px;
}
.msgSys.ok{background:var(--sage-soft);color:var(--ink)}
.msgSys.gold{background:var(--gold-soft);color:var(--ink)}
.msgSys.ok svg{color:var(--sage);flex:none}
.msgAction{flex-direction:column;border:1px solid var(--line-2);background:var(--surf);padding:12px 14px;border-radius:20px}
.msgActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msgAi b{font-weight:700}
.msgAi i{font-style:italic}
.msgAi code{font:500 12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surf-3);border-radius:6px;padding:1px 5px}
.msgAi .mdHr{display:block;height:1px;margin:9px 0;background:var(--line-2);border-radius:99px;font-style:normal}
.propCard{margin:4px 0 0 36px;padding:15px 16px;border-radius:22px;background:var(--surf);border:1px solid var(--line-2);max-width:340px}
.propCard .k{font:700 10.5px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.propCard .q{font:600 14.5px/1.35 var(--f);margin-top:8px;text-wrap:pretty}
.propCard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.propCard .tags span{height:28px;padding:0 10px;border-radius:99px;background:var(--surf-2);display:flex;align-items:center;font:500 12.5px/1 var(--f)}
.propCard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.propCard .two button{min-height:44px;font-size:14px}

/* ---------- Тренер: стеклянный чат на тёплом фоне ----------
   Экран на весь рост: таб-бар на телефоне уезжает вниз. Стекло собрано
   из --ink с прозрачностью: в тёмной теме это светлая дымка, в светлой —
   тёмная, отдельные цвета для тем не нужны. Акцент — всегда --gold. */
#s-teacher{
  --tg-glass:rgba(247,239,224,.09);--tg-glass:color-mix(in oklch,var(--ink) 9%,transparent);
  --tg-line:rgba(247,239,224,.15);--tg-line:color-mix(in oklch,var(--ink) 15%,transparent);
  --tg-hi:inset 0 1px 0 rgba(255,255,255,.14);
  background:
    radial-gradient(60% 40% at 15% 25%,color-mix(in oklch,var(--terra) 48%,transparent),transparent 70%),
    radial-gradient(55% 35% at 90% 70%,color-mix(in oklch,var(--gold) 33%,transparent),transparent 70%),
    var(--bg);
}
html[data-theme=light] #s-teacher{
  background:
    radial-gradient(60% 40% at 15% 25%,color-mix(in oklch,var(--terra) 22%,transparent),transparent 70%),
    radial-gradient(55% 35% at 90% 70%,color-mix(in oklch,var(--gold) 26%,transparent),transparent 70%),
    var(--bg);
}
#s-teacher .glass{background:var(--tg-glass);border:1px solid var(--tg-line);box-shadow:var(--tg-hi);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
html.lite #s-teacher .glass,html.lite #s-teacher .msgAi,html.lite .aiPanel,html.lite .vmCore{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

/* шапка: ✕ и капсула */
.tgHead{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px 6px;position:relative;z-index:2}
.tgX{width:52px;height:52px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;cursor:pointer}
.tgCap{flex:1;min-width:0;height:52px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 6px 0 5px}
.tgWho{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);text-align:start;cursor:pointer}
.tgAva{width:40px;height:40px;border-radius:99px;background:var(--gold-soft);overflow:hidden;display:flex;justify-content:center;flex:none}
.tgAva img{width:42px;height:auto;margin-top:3px}
.tgNm{flex:1;min-width:0}
.tgNm b{display:block;font:700 15px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgNm>span{display:flex;align-items:center;gap:5px;font:500 11.5px/1.3 var(--f);color:var(--ink-2);white-space:nowrap}
.tgNm>span i{width:6px;height:6px;border-radius:99px;background:var(--sage);display:block;flex:none}
.tgLang{height:34px;padding:0 11px;border-radius:999px;border:0;flex:none;cursor:pointer;white-space:nowrap;color:var(--ink);
  background:color-mix(in oklch,var(--ink) 12%,transparent);font:700 12px/1 var(--f)}

/* сообщения */
#s-teacher #chatBox{padding:12px 14px}
#s-teacher .msgWrap .ava{display:none}
#s-teacher .msgWrap:not(.me){flex-direction:column;align-items:flex-start;gap:0}
#s-teacher .msgAi{position:relative;max-width:min(250px,82%);padding:12px;padding-inline:16px 34px;border-radius:22px 22px 22px 8px;
  background:var(--surf-2);background:color-mix(in oklch,var(--ink) 10%,transparent);
  border:1px solid color-mix(in oklch,var(--ink) 12%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font:400 14.5px/1.42 var(--f)}
#s-teacher .msgMe{border-radius:22px 22px 8px 22px;background:var(--gold);
  background:linear-gradient(135deg,color-mix(in oklch,var(--gold) 82%,white),color-mix(in oklch,var(--gold) 88%,var(--gold-ink)));
  color:var(--gold-ink);box-shadow:0 10px 24px -12px color-mix(in oklch,var(--gold) 70%,transparent)}
#s-teacher .msgSys{background:var(--tg-glass);border:1px solid var(--tg-line)}
#s-teacher .msgSys.ok{background:var(--sage-soft)}
#s-teacher .msgSys.gold{background:var(--gold-soft)}

/* ⌄ в углу ответа и меню действий под ним */
.aiChev{position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:99px;border:0;padding:0;background:transparent;
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .25s,color .25s}
.aiChev::after{content:'';position:absolute;inset:-9px}
.aiChev svg{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.aiChev.on{background:color-mix(in oklch,var(--ink) 10%,transparent);color:var(--gold-text)}
.aiChev.on svg{transform:rotate(180deg)}
.aiChev.playing{color:var(--gold-text)}
.aiChev.loading{color:var(--gold-text);animation:voicePulse .8s ease-in-out infinite alternate}
/* свёрнутое меню не занимает места: промежуток между сообщениями — только gap чата */
.aiMenu{display:grid;grid-template-rows:0fr;margin-top:0;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1),margin-top .38s cubic-bezier(.2,.8,.2,1)}
.aiMenu>div{overflow:hidden;min-height:0}
.aiMenu.open{grid-template-rows:1fr;margin-top:8px}
.aiPanel{width:220px;padding:4px;margin:2px 0 4px;border-radius:18px;display:flex;flex-direction:column;visibility:hidden;
  background:var(--surf);background:color-mix(in oklch,var(--surf) 72%,transparent);border:1px solid color-mix(in oklch,var(--ink) 12%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 28px -16px rgba(0,0,0,.8);
  opacity:0;transform:translateY(-8px) scale(.92);transform-origin:top left;
  transition:opacity .25s ease,transform .32s cubic-bezier(.3,1.4,.5,1),visibility 0s linear .38s}
html[dir=rtl] .aiPanel{transform-origin:top right}
.aiMenu.open .aiPanel{visibility:visible;opacity:1;transform:none;transition:opacity .25s ease,transform .32s cubic-bezier(.3,1.4,.5,1),visibility 0s}
.aiPanel button{height:40px;padding:0 12px;border-radius:14px;border:0;background:none;display:flex;align-items:center;gap:10px;
  font:600 13.5px/1 var(--f);color:var(--ink);cursor:pointer;text-align:start;opacity:0;transform:translateY(-8px);
  transition:opacity .24s ease,transform .3s cubic-bezier(.3,1.4,.5,1),background-color .15s}
.aiPanel button+button{border-top:1px solid color-mix(in oklch,var(--ink) 7%,transparent)}
.aiMenu.open .aiPanel button{opacity:1;transform:none}
.aiMenu.open .aiPanel button:nth-child(1){transition-delay:.05s,.05s,0s}
.aiMenu.open .aiPanel button:nth-child(2){transition-delay:.10s,.10s,0s}
.aiMenu.open .aiPanel button:nth-child(3){transition-delay:.15s,.15s,0s}
.aiPanel button:hover{background:color-mix(in oklch,var(--ink) 8%,transparent)}
.aiPanel svg{flex:none;color:var(--gold-text)}

/* поле ввода */
/* клавиатура у Тренера ложится поверх страницы (vkOverlay): поле ввода
   поднимается над ней само, на высоту keyboard-inset-height */
#s-teacher .chatDock{padding:8px 10px calc(10px + max(env(safe-area-inset-bottom,0px),env(keyboard-inset-height,0px)))}
#s-teacher .chatDock .chips{display:none}
#s-teacher .inputPill{height:56px;border-radius:999px;gap:8px;padding:0 7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 30px -18px rgba(0,0,0,.8)}
#s-teacher .inputPill .plus{width:42px;height:42px;background:color-mix(in oklch,var(--ink) 12%,transparent);color:var(--ink)}
#s-teacher .inputPill input::placeholder{color:var(--ink-2)}
#s-teacher .inputPill .send{width:42px;height:42px;background:var(--gold);color:var(--gold-ink)}
.voiceGo{height:42px;padding:0 14px 0 12px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;gap:7px;
  flex:none;cursor:pointer;font:800 13px/1 var(--f);box-shadow:0 8px 20px -8px color-mix(in oklch,var(--gold) 70%,transparent)}

/* таб-бар уезжает вниз, пока открыт Тренер */
#tabbar{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#tabbar.away{transform:translateY(calc(100% + 30px + env(safe-area-inset-bottom,0px)));pointer-events:none}

/* ---------- голосовой режим ---------- */
.vm{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;color:var(--ink);padding-top:var(--topInset,0px);
  background:
    radial-gradient(70% 45% at 50% 62%,color-mix(in oklch,var(--gold) 32%,transparent),transparent 70%),
    radial-gradient(60% 40% at 10% 10%,color-mix(in oklch,var(--terra) 42%,transparent),transparent 70%),
    var(--bg);
  animation:screenIn .25s ease}
.vm[hidden]{display:none}
.vm[data-state=think]{background:
    radial-gradient(70% 45% at 50% 55%,color-mix(in oklch,var(--gold) 24%,transparent),transparent 70%),
    radial-gradient(60% 40% at 10% 10%,color-mix(in oklch,var(--terra) 42%,transparent),transparent 70%),
    var(--bg)}
.vm[data-state=speak]{background:
    radial-gradient(80% 50% at 50% 38%,color-mix(in oklch,var(--gold) 36%,transparent),transparent 70%),
    radial-gradient(60% 40% at 90% 90%,color-mix(in oklch,var(--terra) 38%,transparent),transparent 70%),
    var(--bg)}
.vmTop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 12px}
.vmRound{width:48px;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;cursor:pointer;flex:none}
.vmPill{height:34px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:7px;font:700 12px/1 var(--f);min-width:0;white-space:nowrap}
.vmPill>span{overflow:hidden;text-overflow:ellipsis}
.vmPill i{width:7px;height:7px;border-radius:99px;background:var(--terra);display:block;flex:none}
.vm[data-state=think] .vmPill i{background:var(--gold)}
.vm[data-state=speak] .vmPill i{background:var(--sage)}
.vm[data-state=perm] .vmPill i{background:var(--ink-3)}
.vmPane{display:none;flex:1;min-height:0;flex-direction:column}
.vm[data-state=listen] .vmListen,.vm[data-state=think] .vmThink,.vm[data-state=speak] .vmSpeak,.vm[data-state=perm] .vmPerm{display:flex}
.vmTask{flex:none;padding:22px 26px 0;text-align:center}
.vmTask .k{font:600 12px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.vmTask .q{font:500 15px/1.4 var(--f);color:var(--ink-2);margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.vmMid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}

/* живая расшифровка: ровно две строки, старая — 30 % непрозрачности */
.vmLive{align-self:stretch;margin:-26px 28px 26px;position:relative;height:64px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 42%,#000 58%,#000 100%);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 42%,#000 58%,#000 100%)}
.vmLiveIn{position:absolute;left:0;right:0;top:32px;font:600 24px/32px var(--f);letter-spacing:-.015em;text-align:center;color:var(--ink);will-change:transform}
.vmLiveIn.ph{color:var(--ink-3)}
.vmLiveIn .caret{display:inline-block;width:2px;height:24px;background:var(--gold);margin-inline-start:3px;vertical-align:-4px}

/* круги: внешний, средний, стеклянный центр */
.vmRing{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;will-change:transform;padding:0;background:none;color:inherit}
.vmRing.o{width:210px;height:210px;border:1px solid color-mix(in oklch,var(--gold) 16%,transparent)}
.vmRing.i{width:168px;height:168px;border:1px solid color-mix(in oklch,var(--gold) 30%,transparent);background:color-mix(in oklch,var(--gold) 6%,transparent)}
.vmRing.dash{width:168px;height:168px;border:1px dashed color-mix(in oklch,var(--gold) 40%,transparent)}
button.vmRing{cursor:pointer}
.vmCore{width:126px;height:126px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px;flex:none;will-change:transform;
  background:color-mix(in oklch,var(--ink) 10%,transparent);border:1px solid var(--tg-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.vmCore.think{width:130px;height:130px}
.vmSpeak .vmRing.o{width:200px;height:200px;border-color:color-mix(in oklch,var(--gold) 20%,transparent)}
.vmSpeak .vmRing.i{width:166px;height:166px;border:1.5px solid color-mix(in oklch,var(--gold) 40%,transparent);background:none}
.vmSpeak .vmCore{width:134px;height:134px}

/* золотая волна: 5 px, радиус 9, промежуток 4 */
.vmWave{display:flex;align-items:center;gap:4px;height:60px}
.vmWave i{width:5px;border-radius:9px;background:var(--gold);display:block;animation:vmWave .45s ease-in-out infinite alternate}
.vmWave.fast i{animation-duration:.38s}
@keyframes vmWave{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.vmWave i:nth-child(2){animation-delay:.12s}.vmWave i:nth-child(3){animation-delay:.24s}.vmWave i:nth-child(4){animation-delay:.36s}
.vmWave i:nth-child(5){animation-delay:.48s}.vmWave i:nth-child(6){animation-delay:.6s}.vmWave i:nth-child(7){animation-delay:.72s}.vmWave i:nth-child(8){animation-delay:.84s}
#vmWaveListen i:nth-child(1){height:14px}#vmWaveListen i:nth-child(2){height:30px}#vmWaveListen i:nth-child(3){height:46px}#vmWaveListen i:nth-child(4){height:26px}
#vmWaveListen i:nth-child(5){height:38px}#vmWaveListen i:nth-child(6){height:18px}#vmWaveListen i:nth-child(7){height:10px}
#vmWaveSpeak i:nth-child(1){height:12px}#vmWaveSpeak i:nth-child(2){height:26px}#vmWaveSpeak i:nth-child(3){height:44px}#vmWaveSpeak i:nth-child(4){height:22px}
#vmWaveSpeak i:nth-child(5){height:36px}#vmWaveSpeak i:nth-child(6){height:16px}#vmWaveSpeak i:nth-child(7){height:28px}#vmWaveSpeak i:nth-child(8){height:10px}
.vm.paused #vmWaveListen i,.vm.quiet #vmWaveSpeak i{animation-play-state:paused}

.vmStatus{font:700 15px/1 var(--f)}
.vmStatus .tm{color:var(--ink-3);font-weight:600}
.vmStatus.big{font-size:16px}
.vmBtns{flex:none;display:flex;justify-content:center;align-items:flex-start;gap:30px;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.vmSide{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0;margin-top:13px;cursor:pointer;
  font:600 11px/1 var(--f);color:var(--ink-2);min-width:64px}
.vmSide>span{width:54px;height:54px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.vmSide .rate{font:800 14px/1 var(--f)}
.vmSide .icPlay,.vm.paused .vmSide .icPause{display:none}
.vm.paused .vmSide .icPlay{display:block}
.vmMain{width:80px;height:80px;border-radius:99px;border:0;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:0 0 0 8px color-mix(in oklch,var(--gold) 16%,transparent),0 16px 30px -10px color-mix(in oklch,var(--gold) 60%,transparent)}

/* 3c: расшифровка, точки ожидания, этапы */
.vmMine{flex:none;padding:56px 16px 0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.vmMine .bub{max-width:280px;padding:12px 16px;border-radius:22px 22px 8px 22px;color:var(--gold-ink);font:600 15px/1.4 var(--f);
  background:var(--gold);background:linear-gradient(135deg,color-mix(in oklch,var(--gold) 82%,white),color-mix(in oklch,var(--gold) 88%,var(--gold-ink)));
  box-shadow:0 10px 24px -12px color-mix(in oklch,var(--gold) 70%,transparent);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.vmMine .fix{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 2px;border:0;background:none;cursor:pointer;font:600 11.5px/1 var(--f);color:var(--ink-2)}
.vmDots{position:relative;width:60px;height:60px;display:block}
.vmDots i{position:absolute;left:25px;top:25px;width:10px;height:10px;border-radius:99px;background:var(--ink);display:block;will-change:transform}
.vmDots i:nth-child(1){transform:translateX(-16px)}.vmDots i:nth-child(3){transform:translateX(16px)}
.vmSteps{flex:none;margin:0 16px calc(40px + env(safe-area-inset-bottom,0px));padding:14px 16px;border-radius:22px;display:flex;flex-direction:column;gap:11px;
  font:600 13.5px/1.2 var(--f)}
.vmSteps>span{display:flex;align-items:center;gap:10px}
.vmSteps i{width:22px;height:22px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center}
.vmSteps i.ok{background:var(--sage)}
.vmSteps i.ok::after{content:'';width:9px;height:5px;margin-top:-2px;border-left:2.6px solid var(--bg);border-bottom:2.6px solid var(--bg);transform:rotate(-45deg)}
.vmSteps i.spin{border:2px solid var(--gold);border-right-color:transparent;animation:vmSpin .8s linear infinite}
.vmSteps i.wait{border:2px solid var(--ink-3);opacity:.5}
@keyframes vmSpin{to{transform:rotate(360deg)}}

/* 3d: субтитры — одно предложение, в нём подсвечено слово, которое звучит.
   Под ними стрелка: рамка с полным ответом (караоке), фон позади размыт.
   Субтитры, стрелка и рамка стоят над слоем размытия (z-index 4 > 3). */
.vmSpeakTop{flex:none;display:flex;justify-content:center;padding-top:26px}
.vmSpeak .vmBtns{margin-top:auto}
.vmSubsBox{flex:none;position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px}
.vmSubs{width:100%;height:56px;padding:0 30px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  font:600 20px/1.4 var(--f);letter-spacing:-.01em;color:var(--ink-3)}
.vmSubs>div{text-wrap:balance;max-width:100%}
.vmSubs .w.done{color:var(--ink)}
.vmSubs .w.now{color:var(--gold-text);text-decoration:underline 2px var(--gold);text-underline-offset:5px}
.vmTxtWrap{position:relative;display:flex;justify-content:center}
.vmTxtWrap.off{visibility:hidden}
.vmTxtBtn{width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.vmTxtBtn>span{display:flex;animation:vmHint 1.6s ease-in-out infinite}
.vmTxtBtn svg{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.vm.txtOn .vmTxtBtn>span{animation:none}
.vm.txtOn .vmTxtBtn svg{transform:rotate(180deg)}
@keyframes vmHint{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.vmVeil{position:absolute;inset:0;z-index:3;background:rgba(20,17,14,.38);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .4s ease}
.vm.txtOn .vmVeil{opacity:1;pointer-events:auto}
.vmTxt{position:absolute;top:calc(100% + 10px);left:50%;width:min(328px,calc(100vw - 32px));height:0;opacity:0;visibility:hidden;
  transform:translate(-50%,-10px);overflow:hidden;border-radius:24px;background:rgba(36,32,28,.62);border:1px solid var(--tg-line);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 24px 50px -24px rgba(0,0,0,.85);
  transition:height .5s cubic-bezier(.2,.8,.2,1),opacity .3s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s linear .5s}
.vm.txtOn .vmTxt{height:var(--h,260px);opacity:1;visibility:visible;transform:translate(-50%,0);
  transition:height .5s cubic-bezier(.2,.8,.2,1),opacity .3s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
/* содержимое — своей высоты и проявляется позже рамки: текст не сплющивается, пока она растёт */
.vmTxtIn{height:var(--h,260px);opacity:0;transition:opacity .3s ease}
.vm.txtOn .vmTxtIn{opacity:1;transition-delay:.18s}
.vmTxtScroll{position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 22px;display:flex;flex-direction:column;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
.vmTxtScroll::-webkit-scrollbar{display:none}
.vmTxtList{display:contents}
/* фраза — кнопка «прослушать снова»; 5 px сверху и снизу дают промежуток 10 и зону нажатия от 44 px */
.vmS{flex:none;display:flex;align-items:center;min-height:44px;padding:5px 0;margin:0;border:0;border-radius:14px;background:none;cursor:pointer;
  text-align:start;font:500 15px/1.5 var(--f);color:var(--ink-2);transition:color .2s,background-color .2s}
.vmS>span{text-wrap:pretty}
.vmS.past{color:var(--ink-3)}
.vmS.task{font-weight:700;color:var(--ink)}
.vmS.now,.vmS.task.past{padding:10px 12px;margin:5px -12px;background:color-mix(in oklch,var(--gold) 12%,transparent);font:600 16px/1.45 var(--f)}
.vmS.now{color:var(--ink-3)}
.vmS.task.now,.vmS.task.past{font-weight:700}
.vmS.task.past{color:var(--ink)}
.vmS.now .w.done{color:var(--ink)}
.vmS.now .w.cur{color:var(--gold-text);text-decoration:underline 2px var(--gold);text-underline-offset:4px}
div.vmS{cursor:default}
.vmTxtNote{flex:none;display:flex;align-items:center;gap:6px;margin-top:6px;font:600 12px/1.3 var(--f);color:var(--ink-3)}
.vmTxtNote svg{flex:none}
html[data-theme=light] .vmVeil{background:color-mix(in oklch,var(--bg) 40%,transparent)}
html[data-theme=light] .vmTxt{background:color-mix(in oklch,var(--bg) 72%,transparent);box-shadow:0 24px 50px -24px rgba(60,40,20,.45)}
html.lite .vmVeil,html.lite .vmTxt{-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .vmVeil{background:color-mix(in oklch,var(--bg) 82%,transparent)}
html.lite .vmTxt{background:var(--surf)}
html.lite .vmTxtBtn>span{animation:none}
html.lite .vmTxtBtn svg{transition:none}
html.lite .vmTxt{height:var(--h,260px);transform:translate(-50%,0);transition:opacity .15s ease,visibility 0s linear .15s}
html.lite .vm.txtOn .vmTxt{transition:opacity .15s ease,visibility 0s}
html.lite .vmTxtIn,html.lite .vm.txtOn .vmTxtIn,html.lite .vmVeil{transition:opacity .15s ease;transition-delay:0s}
@media (prefers-reduced-motion:reduce){
  .vmTxtBtn>span{animation:none}
  .vmTxtBtn svg{transition:none}
  .vmTxt{height:var(--h,260px);transform:translate(-50%,0);transition:opacity .15s ease,visibility 0s linear .15s}
  .vm.txtOn .vmTxt{transition:opacity .15s ease,visibility 0s}
  .vmTxtIn,.vm.txtOn .vmTxtIn,.vmVeil{transition:opacity .15s ease;transition-delay:0s}
}

/* нет доступа к микрофону */
.vmPermBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 32px calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.vmCore.perm{width:96px;height:96px;color:var(--ink-2);margin-bottom:6px}
.vmPermBox b{font:800 20px/1.2 var(--f)}
.vmPermBox p{margin:0 0 8px;font:500 14px/1.5 var(--f);color:var(--ink-2);max-width:320px}
.vmPermBox .btnGold,.vmPermBox .btnGhost{width:100%;max-width:300px}
.vmPermBox .btnGhost{margin-top:0}
.chatDock{flex:none;position:relative;z-index:1;padding:10px 12px calc(114px + env(safe-area-inset-bottom,0px));background:transparent}
.chatDock .chips{display:flex;gap:8px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.chatDock .chips::-webkit-scrollbar{display:none}
.chatDock .chips .chip{flex:none;height:38px;min-height:38px;padding:0 15px;font-size:13px}
.inputPill{height:50px;border-radius:999px;background:var(--surf-2);display:flex;align-items:center;gap:6px;padding:0 5px 0 6px}
.inputPill .plus{width:40px;height:40px;border-radius:99px;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;flex:none;border:0;cursor:pointer}
.inputPill input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:400 15px var(--f);color:var(--ink);padding-inline-start:6px}
.inputPill input::placeholder{color:var(--ink-3)}
.inputPill .send{width:40px;height:40px;border-radius:99px;border:0;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.inputPill .mic{color:var(--ink-2)}
.inputPill .mic.rec{color:var(--terra)}

/* ---------- прогресс и служебное ---------- */
.bars{display:flex;gap:5px;flex:1}
.bars i{flex:1;height:6px;border-radius:99px;background:var(--surf-2)}
.bars i.on{background:var(--gold)}
.track{height:6px;border-radius:99px;background:var(--surf-2);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .3s}
.logBox{
  display:none;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--surf-2);
  font:400 11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink-2);
  max-height:130px;overflow:auto;white-space:pre-wrap;
}
.pill{display:inline-flex;padding:5px 11px;border-radius:99px;background:var(--gold-soft);
  font:700 10.5px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text)}
.arrowR{width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);display:block;flex:none}
html[dir=rtl] .arrowR{transform:rotate(-135deg)}
html[dir=rtl] .flipRtl{transform:scaleX(-1)}

/* ---------- шторки ---------- */
#sheetWrap{position:absolute;inset:0;z-index:20;display:none}
#sheetWrap.on{display:block}
#sheetBack{position:absolute;inset:0;background:var(--scrim)}
#sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;
  background:var(--surf);border-radius:34px 34px 0 0;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);
  animation:sheetUp .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#sheet .grip{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:0 auto 16px}
#sheetTitle{font:800 18px/1.2 var(--f)!important;letter-spacing:-.01em!important;text-transform:none!important;color:var(--ink)!important;text-align:start!important}
#sheet.celebrate{padding:0;overflow:hidden;
  background:var(--surf);background:radial-gradient(90% 55% at 50% 12%,color-mix(in oklch,var(--tint,var(--r8)) 48%,var(--surf)),var(--surf) 75%)}
#sheet.celebrate .grip{margin:10px auto 0}
#sheet.celebrate #sheetTitle{display:none}

/* ---------- список настроек ---------- */
.settingsList{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:0 16px}
.settingsRow{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;cursor:pointer;color:var(--ink);
  border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start;
}
.settingsRow:last-child{border-bottom:0}
.settingsRow>b{flex:1;font:600 14.5px/1.25 var(--f);color:var(--ink)}
.settingsRow>i{font:500 13.5px var(--f);color:var(--ink-2);font-style:normal;text-align:end;max-width:52%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settingsRow>.arrowR{color:var(--ink-3)}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--surf-3);padding:3px;display:flex;flex:none;transition:background-color .18s}
.toggle i{width:24px;height:24px;border-radius:99px;background:#FFFFFF;display:block;transition:transform .18s}
.toggle.on{background:var(--gold)}
.toggle.on i{transform:translateX(20px)}
html[dir=rtl] .toggle.on i{transform:translateX(-20px)}

/* ---------- карточки: шапка и игра ---------- */
.countChip{height:32px;padding:0 12px;border-radius:999px;background:var(--surf-2);display:inline-flex;align-items:center;
  font:600 12.5px/1 var(--f);color:var(--ink-2);white-space:nowrap}
.gameProg{display:flex;justify-content:space-between;font:600 12.5px/1 var(--f);color:var(--ink-2)}
.optionBtn{
  width:100%;min-height:60px;padding:12px 16px;border-radius:20px;text-align:start;font:600 16px/1.25 var(--f);
  cursor:pointer;background:var(--surf);border:1px solid var(--line);color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-wrap:anywhere;
}
.optionBtn.right{background:var(--sage-soft);border:1.5px solid var(--sage);font-weight:700}
.optionBtn.wrong{background:var(--errSoft);border:1.5px solid var(--terra)}
.optGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optGrid.one{grid-template-columns:1fr}
.pairGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairCol{display:flex;flex-direction:column;gap:9px}
.pairBtn{
  padding:13px 10px;border-radius:18px;background:var(--surf);border:1px solid var(--line);
  font:600 14px/1.3 var(--f);color:var(--ink);cursor:pointer;min-height:54px;
  height:auto;white-space:normal;overflow-wrap:break-word;word-break:break-word;text-wrap:pretty;
}
.pairBtn.long{font-size:12.5px;line-height:1.28}
.pairBtn.xlong{font-size:11.5px;line-height:1.25;padding:11px 8px}
.pairBtn.picked{border:1.5px solid var(--gold);background:var(--gold-soft)}
.pairBtn.matched{opacity:.32;pointer-events:none;border-style:dashed}
.pairBtn.shake{animation:shake .34s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.bigCard{
  border-radius:32px;position:relative;overflow:hidden;padding:22px 22px 20px;display:flex;flex-direction:column;min-height:230px;
  background:var(--surf);
  background:linear-gradient(165deg,color-mix(in oklch,var(--tint,var(--r4)) 36%,var(--surf)),var(--surf) 75%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.bigCard .kindTag{font:700 10.5px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.bigCard .word{margin-top:auto;padding-top:18px;font:800 34px/1.08 var(--f);letter-spacing:-.03em;color:var(--ink);hyphens:auto;overflow-wrap:anywhere;text-wrap:pretty}
.bigCard .word.long{font-size:26px}
.bigCard .word.xlong{font-size:21px;line-height:1.2}
.bigCard .phon{font:400 15px/1.35 var(--f);color:var(--ink-2);margin-top:8px}
.bigCard .spkRow{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.bigCard>img{position:absolute;inset-inline-end:-8px;bottom:-10px;width:70px;opacity:.85;pointer-events:none}
.slowBtn{height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;
  font:600 13px/1 var(--f);color:var(--ink);cursor:pointer}
.fb{display:none;align-items:center;gap:10px;padding:14px 18px;border-radius:20px;font:600 14px/1.4 var(--f);margin-bottom:14px}
.fb.ok{display:flex;background:var(--sage-soft);color:var(--ink)}
.fb.bad{display:flex;background:var(--errSoft);color:var(--ink)}
.learnRow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px}
.learnRow b{font:700 15px var(--f);color:var(--ink)}
.learnRow i{font-style:normal;color:var(--ink-2);flex:1;text-align:end;font-size:14px}
.learnRow .sep{color:var(--ink-3)}
.asmLine{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;min-height:62px;padding:11px 12px;border-radius:20px;
  background:var(--surf);border:1.5px dashed var(--line-2)}
.asmLine.empty{opacity:.75}
.asmBank{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.asmTile{padding:10px 13px;border-radius:14px;cursor:pointer;background:var(--surf);border:1px solid var(--line);
  font:600 14px/1.2 var(--f);color:var(--ink);max-width:100%;overflow-wrap:break-word}
.asmTile.in{background:var(--gold-soft);border-color:var(--gold)}

/* ---------- генератор ---------- */
.genGroupHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:14px 2px 8px}
.genGroupHead:first-child{margin-top:0}
.genRow{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:18px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px}
.genFields{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.genSide{display:flex;align-items:center;gap:6px;flex:none}
.genRow input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:600 14.5px var(--f);color:var(--ink);padding:2px 0}
.genRow input.tr{font-weight:400;font-size:13.5px;color:var(--ink-2);text-align:end}
.genRow .del{border:0;background:transparent;color:var(--ink-3);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;flex:none}
.genRow.phrase{align-items:flex-start;background:var(--gold-soft);border-color:var(--line)}
.genRow.phrase .genFields{flex-direction:column;align-items:stretch;gap:4px}
.genRow.phrase input{font-size:14px;text-align:start;width:100%}
.genRow.phrase input.tr{text-align:start;font-size:13px}
.genRow.phrase .genSide{padding-top:2px}
.kindBtn{flex:none;padding:5px 9px;border-radius:99px;cursor:pointer;border:1px solid var(--line-2);background:transparent;
  font:700 10px var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.kindBtn.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

/* ---------- путь: «река» уровня ---------- */
/* ---------- путь: карусель тем ----------
   Одна тема — один постер. Соседние выглядывают по краям (d = ±1),
   дальние скрыты. Позицию задаёт JS через transform; во время свайпа
   переход выключается классом .drag, после отпускания карточки
   доводятся той же кривой. Постер всегда тёмный: светлый текст на нём
   читается в обеих темах, а верх градиента притемнён, чтобы подпись
   «Тема N из M» держала контраст и на самых светлых ступенях. */
.pHead{padding:6px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pHead .pSub{font:500 13px/1.2 var(--f);color:var(--ink-2)}
.pHead .pTitle{font:800 30px/1.05 var(--f);letter-spacing:-.035em;margin-top:8px;color:var(--ink)}
.pRight{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.pRight .chip{min-height:32px;height:32px;padding:0 13px;font-size:12.5px}
#pathPos{font:700 13px/1 var(--f);color:var(--gold-text);padding-bottom:4px;white-space:nowrap}
.pLevels{display:flex;gap:6px;padding:16px 20px 0}
.pLevels button{flex:1;min-width:0;height:34px;border-radius:999px;border:0;padding:0;cursor:pointer;
  background:var(--surf-2);color:var(--ink-3);font:700 13px/1 var(--f)}
.pLevels button.cur{background:var(--gold);color:var(--gold-ink);font-weight:800}
.pLevels button.lock{opacity:.7}
.pCar{position:relative;height:452px;margin-top:20px;overflow:hidden;touch-action:pan-y;outline:none;
  -webkit-user-select:none;user-select:none}
.pCar:focus-visible{box-shadow:inset 0 0 0 2px var(--gold);border-radius:20px}
.pCard{position:absolute;left:calc(50% - 150px);top:0;width:300px;height:446px;border-radius:32px;overflow:hidden;padding:22px;
  display:flex;flex-direction:column;color:#F7EFE0;text-align:start;cursor:pointer;
  background:linear-gradient(180deg,rgba(20,17,14,.2),transparent 34%),
    linear-gradient(165deg,color-mix(in oklch,var(--pc) 70%,#14110E),color-mix(in oklch,var(--pc) 25%,#14110E));
  border:1px solid var(--line);box-shadow:0 30px 50px -28px rgba(0,0,0,.75);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;will-change:transform}
.pCar.drag .pCard{transition:none}
.pCard .pTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pCard .pNo{font:700 11px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;min-width:0}
.pCard .pBadge{height:26px;padding:0 10px;border-radius:999px;background:rgba(20,17,14,.38);display:flex;align-items:center;
  font:700 11.5px/1 var(--f);white-space:nowrap;flex:none}
.pCard .pArt{height:196px;margin-top:16px;display:flex;justify-content:center;align-items:flex-start;flex:none}
.pCard .pArt img{height:196px;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.35));pointer-events:none;-webkit-user-drag:none}
.pCard .pT{margin-top:auto;font:800 25px/1.08 var(--f);letter-spacing:-.03em;text-wrap:pretty;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pCard .pS{font:500 13px/1.4 var(--f);margin-top:8px;opacity:.92;text-wrap:pretty;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pTicks{display:flex;gap:5px;padding:12px 32px 0}
.pTicks button{flex:1;min-width:0;height:22px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center}
.pTicks button::before{content:'';display:block;width:100%;height:4px;border-radius:999px;background:var(--tc,var(--surf-3));transition:height .2s}
.pTicks button.on::before{height:8px;background:var(--ink)}
.pCtl{display:flex;gap:10px;padding:14px 20px 0}
.pArrow{width:52px;height:52px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink);flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pArrow:disabled{opacity:.35;cursor:default}
.pCta{flex:1;min-width:0;height:52px;border-radius:999px;border:0;padding:0 16px;cursor:pointer;
  background:var(--gold);color:var(--gold-ink);font:800 15px/1.15 var(--f);overflow:hidden;text-wrap:balance}
/* «Откроется после темы N» длиннее остальных — на узком экране в две строки */
.pCta[aria-disabled="true"]{background:var(--surf-2);color:var(--ink-3);cursor:default;font-size:13.5px}
.pArrow,.pCta,.pLevels button,.pTicks button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .18s ease,color .18s ease,opacity .18s ease}
.pArrow:not(:disabled):active{transform:scale(.92)}
.pCta:not([aria-disabled="true"]):active,.pLevels button:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){
  .pCard{transition:opacity .15s}
}
/* на десктопе шкала и кнопки не тянутся на всю колонку */
@media (min-width:900px){ .pTicks,.pCtl{max-width:600px;margin-left:auto;margin-right:auto} }

/* ---------- профиль ---------- */
.profTop{display:flex;align-items:center;gap:18px;padding:6px 20px 0}
.profTop .ring{width:94px;height:94px;cursor:pointer;border:0}
/* цифры профиля — на общей подложке, как поле ввода у тренера */
.stats3{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;
  background:var(--surf-2);border-radius:22px;padding:14px 4px}
.stats3>span{position:relative;min-width:0}
.stats3>span+span::before{content:'';position:absolute;left:0;top:12%;bottom:12%;width:1px;background:var(--line-2)}
.stats3 b{display:block;font:800 20px/1 var(--f);color:var(--ink);font-variant-numeric:tabular-nums}
.stats3>span>span{display:block;font:600 12px/1 var(--f);color:var(--ink-2);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bio{padding:14px 20px 0;cursor:pointer}
.bio b{display:block;font:700 15px/1.2 var(--f)}
.bio span{display:block;font:400 13.5px/1.45 var(--f);color:var(--ink-2);margin-top:3px}
.rankCard{margin:16px 20px 0;padding:14px 10px 14px 14px;border-radius:22px;display:flex;align-items:center;gap:14px;cursor:pointer;
  width:calc(100% - 40px);text-align:start;color:var(--ink);border:1px solid var(--line);
  background:var(--surf);background:linear-gradient(115deg,color-mix(in oklch,var(--tint,var(--r7)) 34%,var(--surf)),var(--surf) 80%)}
.rankCard .tx{flex:1;min-width:0}
.rankCard b{display:block;font:800 16px/1.15 var(--f)}
.rankCard small{display:block;font:500 12.5px/1.3 var(--f);color:var(--ink-2);margin-top:3px}
.twoBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px 0}
.twoBtns button{height:44px;border-radius:14px;background:var(--surf-2);border:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font:700 14px/1 var(--f);color:var(--ink);cursor:pointer}
.twoBtns button.gold{background:var(--gold);color:var(--gold-ink)}
.tabsLine{display:flex;margin-top:18px;border-bottom:1px solid var(--line)}
.tabsLine button{flex:1;height:44px;border:0;background:none;font:600 13.5px/1 var(--f);color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent}
.tabsLine button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 6px;padding:18px 14px 0}
.medal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.medal .dia{width:46px;height:46px;margin:8px 0 2px;border-radius:15px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;
  color:var(--mc);border:1.5px solid var(--mc);background:var(--surf-2);background:color-mix(in oklch,var(--mc) 20%,var(--surf))}
.medal .dia svg{transform:rotate(-45deg)}
.medal span{font:600 11.5px/1.25 var(--f)}
.medal.off .dia{--mc:var(--ink-3);background:var(--surf-2);border-color:var(--line-2)}
.medal.off span{color:var(--ink-3)}
.topicRow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.topicRow:last-child{border-bottom:0}
.topicRow b{flex:1;min-width:0;font:600 14.5px/1.3 var(--f)}
.topicRow span{font:700 12.5px/1 var(--f);color:var(--sage)}

/* ---------- ранги ---------- */
.rankHero{position:relative;margin:18px 16px 0;padding:26px 22px 22px;border-radius:32px;overflow:hidden;text-align:center;border:1px solid var(--line);
  box-shadow:var(--shadow);background:var(--surf-2);
  background:linear-gradient(170deg,color-mix(in oklch,var(--tint,var(--r7)) 52%,var(--bg)),color-mix(in oklch,var(--tint,var(--r7)) 14%,var(--bg)))}
.rankHero svg{display:block;margin:0 auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.rankHero .k{font:700 11px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;margin-top:16px}
.rankHero .n{font:800 36px/1.05 var(--f);letter-spacing:-.035em;margin-top:8px;text-wrap:balance}
.rankHero .d{font:500 14px/1.3 var(--f);margin-top:6px}
.divBar{display:flex;gap:4px;margin-top:20px}
.divBar span{flex:1;height:8px;border-radius:99px;background:rgba(127,127,127,.25);display:block;overflow:hidden}
.divBar span i{display:block;height:8px;background:var(--gold)}
.rankFoot{display:flex;justify-content:space-between;gap:10px;font:600 12.5px/1.2 var(--f);margin-top:10px}
.rankRow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 14px 8px 10px;border-radius:20px;border:1px solid var(--line)}
.rankRow.cur{background:var(--gold-soft);border-color:var(--gold)}
.rankRow.fut svg{opacity:.42}
.rankRow .tx{flex:1;min-width:0}
.rankRow b{display:block;font:700 15px/1.2 var(--f)}
.rankRow small{display:block;font:500 12px/1.3 var(--f);color:var(--ink-2);margin-top:3px}
.rankRow em{font:700 12.5px/1 var(--f);font-style:normal;white-space:nowrap;color:var(--gold-text)}
.rankRow em.ok{color:var(--sage)}

/* ---------- друзья ---------- */
.codeCard{margin:6px 16px 0;padding:20px;border-radius:28px;border:1px solid var(--line);background:var(--surf);
  background:linear-gradient(150deg,var(--gold-soft),var(--surf) 85%)}
.codeCard .code{font:800 32px/1 var(--f);letter-spacing:.06em;margin-top:12px;font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
.codeCard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.codeCard .two button{min-height:44px;min-width:0;padding:0 10px;font-size:14px;gap:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.codeCard .two button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addCode{margin:12px 16px 0;height:52px;border-radius:999px;background:var(--surf-2);display:flex;align-items:center;padding:0 6px 0 20px;gap:8px}
.addCode input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:600 15px var(--f);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.addCode input::placeholder{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)}
.addCode button{height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);font:700 13.5px/1 var(--f);cursor:pointer;flex:none}
.secHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:28px 20px 10px}
.secHead b{font:800 21px/1 var(--f);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.secHead b .cnt{height:22px;min-width:22px;padding:0 7px;border-radius:99px;background:var(--terra);color:#14110E;display:inline-flex;align-items:center;justify-content:center;font:800 12px/1 var(--f)}
.secHead>span{font:600 12.5px/1 var(--f);color:var(--ink-2)}
.reqRow{display:flex;align-items:center;gap:12px;min-height:64px;border-top:1px solid var(--line)}
.reqRow:first-child{border-top:0}
.reqRow .ava{width:48px;height:48px}
.reqRow .tx{flex:1;min-width:0}
.reqRow b{display:block;font:700 15px/1.2 var(--f)}
.reqRow small{display:block;font:500 12.5px/1.3 var(--f);color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reqRow .acc{height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);font:700 13px/1 var(--f);cursor:pointer}
.reqRow .x{width:40px;height:40px;border-radius:99px;border:1px solid var(--line-2);background:none;display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer}
.lbRow{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 12px;border-radius:18px;border:1px solid transparent;width:100%;background:none;cursor:pointer;color:var(--ink);text-align:start}
.lbRow.me{background:var(--gold-soft);border-color:var(--gold)}
.lbRow .pos{width:20px;font:800 15px/1 var(--f);color:var(--ink-2)}
.lbRow .pos.top{color:var(--gold-text)}
.lbRow .ava{width:40px;height:40px}
.lbRow .tx{flex:1;min-width:0}
.lbRow b{display:block;font:700 14.5px/1.2 var(--f)}
.lbRow.me b{font-weight:800}
.lbRow small{display:block;font:500 12px/1.2 var(--f);color:var(--ink-2);margin-top:2px}
.lbRow .xp{font:800 14px/1 var(--f)}
.feedItem{padding:12px 6px 14px 16px;border-radius:22px;background:var(--surf);border:1px solid var(--line);user-select:none}
.feedItem .top{display:flex;align-items:center;justify-content:space-between}
.feedItem .top span{font:500 12px/1 var(--f);color:var(--ink-2)}
.feedItem b{display:block;font:700 15.5px/1.2 var(--f);margin-top:-4px;padding-inline-end:10px}
.feedItem .bar{display:flex;align-items:center;gap:12px;margin-top:10px;padding-inline-end:10px}
.feedItem .bar>span{flex:1;height:6px;border-radius:99px;background:var(--surf-2);display:block}
.feedItem .bar>span i{display:block;height:6px;border-radius:99px;background:var(--sage)}
.feedItem .bar small{font:600 12.5px/1 var(--f);color:var(--ink-2);white-space:nowrap}
.rankLine{display:flex;align-items:center;gap:12px;margin:14px 20px 0}
.rankLine b{display:block;font:800 15px/1.15 var(--f)}
.rankLine small{display:block;font:500 12.5px/1.3 var(--f);color:var(--ink-2);margin-top:2px}

/* ---------- праздник нового ранга ---------- */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;display:block;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(var(--r0,0deg));opacity:1}to{transform:translateY(260px) rotate(calc(var(--r0,0deg) + 220deg));opacity:0}}
.ruStage{position:relative;height:250px;display:flex;justify-content:center;align-items:flex-end;margin-top:6px}
.ruStage img{height:226px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.3))}
.ruStage svg{position:absolute;left:calc(50% + 54px);bottom:-6px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.4))}
.ruText{text-align:center;padding:20px 24px 0}
.ruText .k{font:800 12px/1 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text)}
.ruText .n{font:800 44px/1 var(--f);letter-spacing:-.04em;margin-top:10px;text-wrap:balance}
.ruText .d{font:500 14px/1.3 var(--f);color:var(--ink-2);margin-top:8px}
.ruList{margin:20px 24px 0;display:flex;flex-direction:column;gap:10px}
.ruList div{display:flex;align-items:center;gap:10px;font:600 14px/1.3 var(--f)}
.ruList div i{width:24px;height:24px;border-radius:99px;background:var(--sage-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sage)}
.ruBtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:26px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.ruBtns button{min-height:54px}

/* ---------- оформление ---------- */
.accGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 8px;padding:0 16px}
.accDot{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.accDot>span{width:58px;height:58px;border-radius:99px;padding:4px;border:2px solid transparent;display:block}
.accDot>span>i{width:100%;height:100%;border-radius:99px;display:flex;align-items:center;justify-content:center;font-style:normal}
.accDot.on>span{border-color:var(--ink)}
.accDot small{font:600 12px/1 var(--f)}
.accDot.custom>span>i{background:conic-gradient(#E35D5D,#E3B871,#AFC596,#84C6BC,#A6B3E6,#CDA6D6,#EC9398,#E35D5D)}
/* круг палитры: угол — оттенок, расстояние от центра — насыщенность */
.wheelBox{display:flex;align-items:center;gap:18px;padding:18px 16px 0}
.wheel{position:relative;width:180px;height:180px;border-radius:999px;flex:none;touch-action:none;cursor:crosshair;
  box-shadow:0 0 0 1px var(--line-2)}
.wheel i{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:99px;border:3px solid #FFFFFF;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.35);pointer-events:none}
.wheelInfo{flex:1;min-width:0}
.wheelInfo b{display:block;font:700 15px/1.2 var(--f)}
.wheelInfo span{display:block;font:500 12.5px/1.4 var(--f);color:var(--ink-2);margin-top:4px}
.wheelInfo .sw{width:52px;height:52px;border-radius:99px;margin-top:12px;border:2px solid var(--line-2)}
.previewCard{margin:0 16px;padding:18px;border-radius:28px;background:var(--surf);border:1px solid var(--line)}
.toggleRow{margin:14px 16px 0;display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;border-radius:20px;background:var(--surf);
  border:1px solid var(--line);width:calc(100% - 32px);cursor:pointer;color:var(--ink);text-align:start}
.toggleRow b{flex:1;font:600 14.5px/1.2 var(--f)}

/* ---------- аватарка: редактор ---------- */
.avStage{position:relative;width:214px;height:214px;border-radius:99px;overflow:hidden;background:var(--gold-soft);
  border:1px solid var(--line);cursor:grab;touch-action:none;margin:0 auto}
.avStage img{position:absolute;left:50%;top:50%;width:150px;margin-left:-75px;margin-top:-96px;pointer-events:none;user-select:none}
.avGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.avCell{position:relative;aspect-ratio:1;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:var(--surf);border:1px solid var(--line)}
.avCell.sel{background:var(--gold-soft);border:2px solid var(--gold)}
.avCell img{height:44px;object-fit:contain}
.avFace{border-radius:99px;overflow:hidden;background:var(--gold-soft);position:relative;flex:none;display:block}
.avFace img{position:absolute;left:50%;top:50%}

/* ---------- тосты ---------- */
#toasts{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
#toasts.tabs{bottom:calc(116px + env(safe-area-inset-bottom,0px))}
#toasts.chat{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.toast{
  max-width:min(100%,460px);min-height:52px;padding:10px 16px;border-radius:18px;font:600 14px/1.3 var(--f);
  background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;text-align:start;
  box-shadow:var(--shadow);animation:toastIn .18s ease-out;pointer-events:auto;
}
.toast .ic{flex:none;display:flex}
.toast.good .ic{color:var(--gold)}
.toast.bad .ic{color:var(--terra)}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast>span{flex:1}
.toastAct{flex:none;border:0;border-radius:12px;min-height:40px;padding:0 12px;cursor:pointer;background:transparent;color:var(--bg);font:700 13.5px var(--f)}

/* ---------- учебный план: сравнение версий ---------- */
.diffList{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.diffItem{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:12px;font:500 13.5px/1.4 var(--f);background:var(--surf-2);color:var(--ink)}
.diffItem i{font-style:normal;font-weight:700;flex:none;width:14px;text-align:center}
.diffItem.add{background:var(--sage-soft);color:var(--okInk)}
.diffItem.del{background:var(--errSoft);color:var(--errInk)}
.diffItem.del span{text-decoration:line-through;text-decoration-thickness:1px}
.warnBox{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--errSoft);color:var(--errInk);font:600 13px/1.45 var(--f);border:1px solid var(--terra)}
.checkRow{display:flex;align-items:center;gap:10px;margin-top:14px;font:500 14px/1.4 var(--f);color:var(--ink);cursor:pointer}
.checkRow input{width:18px;height:18px;accent-color:var(--gold);flex:none}
.planVer{padding:14px 0;border-bottom:1px solid var(--line)}
.planVer:last-of-type{border-bottom:0}
.planVerHead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.planVerHead b{font:700 15px var(--f);color:var(--ink)}
.planVerHead span{font:500 12px var(--f);color:var(--ink-2)}

/* ---------- озвучка ---------- */
.spkBtn{width:32px;height:32px;border-radius:99px;border:0;background:var(--surf-2);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.spkBtn.big{width:52px;height:52px;background:var(--gold);color:var(--gold-ink)}
.spkBtn.big svg{width:22px;height:22px}
