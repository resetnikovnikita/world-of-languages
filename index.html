.spkBtn.playing{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 4px var(--gold-soft)}
/* живой голос тренера: кнопка у ответа, автоозвучка в шапке, «Послушать» в настройках */
@keyframes voicePulse{from{opacity:1}to{opacity:.38}}
.spkBtn.loading,.voicePrev.loading{animation:voicePulse .8s ease-in-out infinite alternate}
html.lite .spkBtn.loading,html.lite .voicePrev.loading{opacity:.55}
.tHead .voiceAutoBtn.on{background:var(--gold);color:var(--gold-ink)}
.voicePrev{display:flex;align-items:center;justify-content:center;gap:8px}
.voicePrev.playing{border-color:var(--gold);color:var(--gold)}

/* ---------- колода ---------- */
.deckRow{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;text-align:start;padding:12px 14px;border-radius:18px;
  background:var(--surf);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.deckRow .w{flex:1;min-width:0}
.deckRow b{display:block;font:600 14.5px var(--f);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deckRow small{display:block;font:400 13px var(--f);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.deckRow em{font-style:normal;font:700 10px var(--f);letter-spacing:.06em;text-transform:uppercase;flex:none;
  color:var(--gold-text);background:var(--gold-soft);padding:5px 9px;border-radius:99px}
.deckRow em.due{color:var(--errInk);background:var(--errSoft)}
.deckRow em.ok{color:var(--okInk);background:var(--sage-soft)}
.deckRow.phrase{background:var(--gold-soft)}
.deckRow.phrase b{white-space:normal;overflow:visible;line-height:1.3}
.deckRow.phrase small{white-space:normal;overflow:visible;line-height:1.35}

/* ---------- отклик нажатия: упругое сжатие 0.95 за 180 мс ---------- */
.btn,.btnGhost,.btnGold,.chip,.pickCell,.iconBtn,.spkBtn,.linkBtn,.tabItem,.settingsRow,.optionBtn,.pairBtn,.deckRow,
.avCell,.genRow .del,.kindBtn,.asmTile,.tourBtn,#tourSkipBtn,#tourNextBtn,.perfPick,.story,.dueCard,.topicCard,.matCard,.matAdd,
.heart,.playRow,.seg>button,.twoBtns button,.medal,.lbRow,.accDot,.slowBtn,.codeCard button,
.addCode button,.reqRow button,#miniPlayer,.rankCard,.toggleRow,.inputPill button,.propCard button,.streakChip{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .18s ease,border-color .18s ease,opacity .18s ease,color .18s ease;
}
.btn:not(:disabled):active,.btnGold:not(:disabled):active,.btnGhost:not(:disabled):active,.chip:active,.pickCell:active,.optionBtn:not(:disabled):active,
.pairBtn:not(.matched):active,.deckRow:active,.avCell:active,.kindBtn:active,.asmTile:active,.tourBtn:active,#tourNextBtn:active,.perfPick:active,
.story:active,.dueCard:active,.topicCard:active,.matCard:active,.matAdd:active,.playRow:active,.seg>button:active,
.twoBtns button:active,.medal:active,.lbRow:active,.slowBtn:active,.codeCard button:active,.addCode button:active,.reqRow button:active,
#miniPlayer:active,.rankCard:active,.toggleRow:active,.propCard button:active,.streakChip:active{transform:scale(.95)}
.iconBtn:active,.spkBtn:active,.genRow .del:active,.heart:active,.accDot:active,.inputPill button:active{transform:scale(.9)}
.tabItem:active{transform:scale(.92)}
.settingsRow:active{opacity:.55}
.linkBtn:active,#tourSkipBtn:active{opacity:.45}

/* ---------- тур по интерфейсу ---------- */
#tourWrap{position:absolute;inset:0;z-index:25;display:none}
#tourWrap.on{display:block}
#tourSpot{position:absolute;border-radius:22px;border:2px solid var(--gold);pointer-events:none;
  box-shadow:0 0 0 9999px rgba(10,8,6,.62),0 0 26px rgba(227,184,113,.4);
  transition:top .34s cubic-bezier(.32,.72,0,1),left .34s cubic-bezier(.32,.72,0,1),width .34s cubic-bezier(.32,.72,0,1),height .34s cubic-bezier(.32,.72,0,1)}
#tourTip{position:absolute;left:18px;right:18px;padding:18px 20px;border-radius:26px;background:var(--surf);border:1px solid var(--line-2);box-shadow:var(--shadow)}
#tourTip.pop{animation:tourPop .34s cubic-bezier(.2,.9,.28,1.28)}
@keyframes tourPop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.tourHead{display:flex;gap:13px;align-items:flex-start}
.tourHead img{width:52px;flex:none}
.tourHead>div{flex:1;min-width:0}
.tourTitle{font:800 17px/1.2 var(--f);letter-spacing:-.015em;color:var(--ink);margin-top:7px;text-wrap:pretty}
.tourBody{font:400 13.5px/1.5 var(--f);color:var(--ink-2);margin-top:7px;text-wrap:pretty}
.tourFoot{display:flex;gap:12px;align-items:center;margin-top:16px}
#tourSkipBtn{border:0;background:transparent;font:600 13px var(--f);color:var(--ink-2);cursor:pointer;padding:6px 2px}
#tourNextBtn{margin-inline-start:auto;min-height:44px;padding:0 22px;border-radius:99px;border:0;background:var(--gold);color:var(--gold-ink);font:700 14px var(--f);cursor:pointer}
.tourBtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;text-align:start;cursor:pointer;
  background:var(--gold-soft);border:1px solid var(--line);color:var(--ink)}
.tourBtn img{width:40px;flex:none}
.tourBtn>span{flex:1;min-width:0;font:600 14px var(--f);color:var(--ink)}
.tourBtn .arrowR{color:var(--ink-3)}

/* ---------- появление ---------- */
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.screen.on{animation:screenIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msgWrap,.msgSys,.propCard{animation:msgIn .26s cubic-bezier(.2,.9,.3,1)}
@keyframes fbPop{0%{opacity:0;transform:scale(.97)}60%{transform:scale(1.015)}100%{opacity:1;transform:none}}
.fb.ok,.fb.bad{animation:fbPop .26s cubic-bezier(.2,.9,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
#gameCard:not(.hidden){animation:cardIn .24s cubic-bezier(.2,.9,.3,1)}
@keyframes heartPop{50%{transform:scale(1.25)}}
.heart.pop svg{animation:heartPop .3s cubic-bezier(.3,1.6,.5,1)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-property:background-color,border-color,color,opacity!important}
  *:active{transform:none!important}
  .confetti{display:none}
}

/* ---------- экран выбора устройства ---------- */
.perfPick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:start;padding:18px;border-radius:22px;
  border:1.5px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;font:inherit}
.perfPick b{font:700 17px var(--f);letter-spacing:-.01em}
.perfPick span{font:500 13px/1.45 var(--f);color:var(--ink-2)}
.perfPick em{font:700 11px var(--f);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);padding:4px 9px;border-radius:99px}
.perfPick.sel{border-color:var(--gold);background:var(--gold-soft)}
.perfPick + .perfPick{margin-top:12px}

/* =====================================================================
   ОБЛЕГЧЁННЫЙ РЕЖИМ (html.lite) — для слабых телефонов.
   Выключено всё, что перерисовывает большие площади: зерно, размытия,
   мягкие тени, drop-shadow на бобрах, полупрозрачные «стёкла»,
   анимации и пружина нажатий. Раскладка и цвета те же.
   ===================================================================== */
html.lite #app::after{display:none}
html.lite #shell{background:var(--bg)!important}
html.lite *:not(#tourSpot){box-shadow:none!important}
html.lite #tourSpot{box-shadow:0 0 0 9999px rgba(10,8,6,.62)!important}
html.lite img,html.lite svg{filter:none!important}
html.lite #tabbar::before,html.lite .tabItem.mid::before{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surf)}
html.lite .glow{display:none}

html.lite *,html.lite *::before,html.lite *::after{animation:none!important;
  transition-property:background-color,border-color,color,opacity!important;transition-duration:.12s!important}
html.lite *:active{transform:none!important}
html.lite button:active,html.lite .story:active{opacity:.62}
html.lite .confetti{display:none}
html.lite .tabItem.sel svg{transform:none}

/* =====================================================================
   ДЕСКТОП: таб-бар → боковое меню 256 px, контент — колонка 880 px,
   мини-плашка урока — нижняя панель на всю ширину контента.
   ===================================================================== */
@media (min-width:900px){
  #app{--railW:256px;--content:880px}
  #shell{padding:0;background:var(--bg);align-items:stretch}
  #app{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .screen{top:0;left:var(--railW);padding-top:0;
    padding-left:max(0px,calc((100% - var(--railW) - var(--content)) / 2));
    padding-right:max(0px,calc((100% - var(--railW) - var(--content)) / 2))}
  .scroll.hasTabs{padding-bottom:40px}
  .scroll.hasMini{padding-bottom:110px}
  .railOnly{display:flex!important}
  .mobOnly{display:none!important}
  #tabbar{display:flex;top:0;bottom:0;left:0;right:auto;width:var(--railW);height:auto;flex-direction:column;align-items:stretch;
    justify-content:flex-start;gap:2px;padding:28px 16px;border-top:0;border-right:1px solid var(--line);background:var(--bg-2);
    border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  #tabbar::before{display:none}
  #app.noRail #tabbar{display:none}
  #app.noRail .screen{left:0}
  #railBrand{display:block;font:800 26px/1 var(--f);letter-spacing:-.035em;padding:0 12px 34px;color:var(--ink)}
  .tabItem{flex:none;max-width:none;width:auto;height:auto;min-height:48px;flex-direction:row;justify-content:flex-start;align-items:center;gap:14px;padding:0 14px;border-radius:14px;color:var(--ink-2)}
  .tabItem span{font:600 15px/1 var(--f)}
  .tabItem.sel{background:var(--surf-2);color:var(--ink)}
  .tabItem.sel span{font-weight:700}
  #railTrainer{margin-top:22px;height:68px;border-radius:20px;background:var(--gold);color:var(--gold-ink);align-items:center;gap:10px;
    padding:0 14px 0 6px;overflow:hidden;border:0;cursor:pointer;text-align:start}
  #railTrainer img{width:62px;transform:translateY(8px);align-self:flex-end}
  #railTrainer b{display:block;font:800 16px/1.1 var(--f)}
  #railTrainer small{display:block;font:500 12.5px/1.2 var(--f);margin-top:3px}
  #railUser{margin-top:auto;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:none;cursor:pointer;
    color:var(--ink);text-align:start}
  #railUser .ring{width:40px;height:40px;padding:2px}
  #railUser .ring>*{border-width:2px;border-color:var(--bg-2)}
  #railUser b{display:block;font:700 14px/1.2 var(--f)}
  #railUser small{display:block;font:500 12px/1.2 var(--f);color:var(--ink-2);margin-top:2px}
  #miniPlayer{left:calc(var(--railW) + max(16px,(100% - var(--railW) - var(--content)) / 2));
    right:max(16px,calc((100% - var(--railW) - var(--content)) / 2));bottom:16px;height:72px;border-radius:20px}

  .chatDock{padding-bottom:20px}
  .hero{min-height:270px;margin:26px 0 0}
  .hero .t{font-size:40px}
  .hero>img{height:280px;inset-inline-end:40px}
  .hero .in{padding:34px 0 30px 36px;max-width:440px}
  .shelf{padding:0 0 4px;flex-wrap:wrap;overflow:visible}
  .shelfHead{padding:34px 0 14px}
  .stories{padding:24px 0 2px}
  .topBar{padding-left:0}
  #sheetBack{background:var(--scrim)}
  #sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 64px));max-height:84vh;
    border-radius:28px;padding:20px 24px 24px;animation:modalIn .22s cubic-bezier(.2,.9,.3,1)}
  @keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
  #sheet .grip{display:none}
  #toasts{left:var(--railW)}
  #toasts.tabs{bottom:100px}
  #toasts.chat{bottom:90px}
  .msg{max-width:min(620px,72%)}
  #s-teacher .msgAi{max-width:min(560px,72%)}
  #tourTip{max-width:440px}
  .avGrid{grid-template-columns:repeat(10,1fr)}
  .medals{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (min-width:1400px){ #app{--railW:264px;--content:900px} }

/* ---------- доступность ---------- */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="shell"><div id="app">

  <!-- ===================== ВЫБОР УСТРОЙСТВА ===================== -->
  <section class="screen" id="s-device">
    <div class="scroll">
      <div style="display:flex;justify-content:flex-end;padding:6px 18px 0">
        <button class="chip" id="deviceLangBtn" onclick="openIfaceSheet()"></button>
      </div>
      <div style="display:flex;gap:14px;align-items:flex-end;padding:12px 24px 0">
        <img src="assets/beaver-laptop.png" alt="" style="width:82px;flex:none">
        <div style="flex:1">
          <div class="h1" id="perfTitle"></div>
          <div class="sub" style="margin-top:8px" data-i18n="perfSub"></div>
        </div>
      </div>
      <div class="pad" style="margin-top:22px" id="perfChoices"></div>
      <div style="height:40px"></div>
    </div>
  </section>

  <!-- ============================ ВХОД ============================ -->
  <section class="screen" id="s-auth">
    <div class="scroll">
      <div style="display:flex;justify-content:flex-end;padding:6px 18px 0">
        <button class="chip" id="authLangBtn" onclick="openIfaceSheet()"></button>
      </div>
      <div style="text-align:center;padding:6px 26px 0">
        <img src="assets/beaver-wave.png" alt="" style="width:168px;filter:drop-shadow(0 20px 24px rgba(36,31,26,.22))">
        <div class="h2" style="font-size:31px;margin-top:6px">WordDeck</div>
        <div class="sub" style="margin-top:8px" data-i18n="authSub"></div>
      </div>
      <div class="pad" style="margin-top:20px">
        <div class="card">
          <div class="field" style="margin-top:0">
            <label data-i18n="emailLabel"></label>
            <input class="inp" type="email" id="authEmail" placeholder="you@mail.com" autocomplete="email">
          </div>
          <div class="field">
            <label data-i18n="passLabel"></label>
            <input class="inp" type="password" id="authPass" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn" style="margin-top:18px" id="btnSignIn" onclick="signIn()"></button>
          <div class="row2" style="margin-top:10px">
            <button class="btnGhost" id="btnSignUp" onclick="signUp()"></button>
            <button class="btnGhost" id="btnGoogle" onclick="signInGoogle()"></button>
          </div>
          <div style="text-align:center;margin-top:14px">
            <button class="linkBtn" id="btnForgot" onclick="openResetSheet()"></button>
          </div>
          <p class="dim" id="authMsg" style="margin:12px 0 0;text-align:center" role="status" aria-live="polite"></p>
        </div>
      </div>
      <div style="height:40px"></div>
    </div>
  </section>

  <!-- ====================== КЛЮЧ GEMINI (шлюз) ====================== -->
  <section class="screen" id="s-gate">
    <div class="scroll">
      <div style="display:flex;gap:14px;align-items:flex-end;padding:12px 22px 0">
        <img src="assets/beaver-laptop.png" alt="" style="width:82px;flex:none;filter:drop-shadow(0 12px 16px rgba(36,31,26,.2))">
        <div style="flex:1">
          <div class="h1" data-i18n="gateTitle"></div>
          <div class="sub" style="margin-top:8px" data-i18n="gateSub"></div>
        </div>
      </div>
      <div class="pad" style="margin-top:20px">
        <div class="card">
          <div class="field" style="margin-top:0">
            <label data-i18n="apiKeyLabel" data-short></label>
            <input class="inp" type="password" id="apikey" placeholder="AIza… / AQ.…" autocomplete="off">
          </div>
          <button class="btn" style="margin-top:14px" id="checkKeyBtn" onclick="checkKey()"></button>
          <p class="dim" id="keystatus" style="margin:10px 0 0;text-align:center"></p>
          <div id="modelBox" class="field hidden">
            <label id="modelLabel"></label>
            <select class="inp" id="modelSelect" onchange="setUserModel(this.value)"></select>
          </div>
          <div class="logBox" id="log"></div>
          <p class="dim" style="margin:14px 0 0">
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-i18n="getKeyAiStudio"></a>
          </p>
          <p class="dim" style="margin:8px 0 0" data-i18n="gateHint"></p>
        </div>
        <button class="btnGhost" style="margin-top:14px" id="gateSignOut" onclick="signOut()"></button>
      </div>
      <div style="height:40px"></div>
    </div>
  </section>

  <!-- ========================== ОНБОРДИНГ ========================== -->
  <section class="screen" id="s-onb">
    <div class="topBar back" style="gap:10px;padding-right:20px">
      <button class="iconBtn" id="onbBackBtn" onclick="onbBack()" data-aria="ariaBack">
        <svg class="flipRtl" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span class="dots" id="onbDots"></span>
      <span id="onbCount" style="font:600 12.5px/1 var(--f);color:var(--ink-2)"></span>
    </div>

    <div style="display:flex;gap:14px;align-items:flex-end;padding:14px 20px 0;flex:none">
      <img src="assets/beaver-pointing.png" alt="" style="width:84px;flex:none">
      <div style="flex:1;padding-bottom:6px">
        <div class="h1" id="onbTitle" style="font-size:28px;line-height:1.08"></div>
        <div class="sub" style="margin-top:8px" id="onbSub"></div>
      </div>
    </div>

    <div class="scroll" style="padding:22px 20px 0">
      <div class="pickGrid hidden" id="onbTargetGrid"></div>
      <div class="pickGrid hidden" id="onbNativeGrid"></div>

      <div class="hidden" id="onbStepPace">
        <div class="eyebrow" data-i18n="onbLevel"></div>
        <div style="display:flex;gap:6px;margin-top:12px" id="onbLevels"></div>
        <div class="eyebrow" style="margin-top:26px" data-i18n="onbTime"></div>
        <div style="display:flex;gap:6px;margin-top:12px" id="onbTimes"></div>
      </div>

      <div class="hidden" id="onbStepInterests">
        <div class="chipRow" id="onbInterests"></div>
        <div class="field">
          <label data-i18n="onbCustomLabel"></label>
          <input class="inp" id="onbCustom" placeholder="…">
        </div>
      </div>

          </span><small id="vmPauseTx"></small></button>

              </div></div>
            </div>
          </div>
        </div>
        <div class="vmBtns">
          <button class="vmSide" type="button" onclick="vmRepeat()"><span class="glass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"></path><path d="M4 4v4.5h4.5"></path></svg>

        </div>
      </div>

      <div class="vmPane vmPerm">
        <div class="vmPermBox">

/*
   Слова и фразы.

   Треть карточек — фразы, остальное слова. Одно и то же число управляет
   и генерацией, и сессией повтора: выбрал 15 — генератор отдаёт 15
   (10 слов и 5 фраз), и сессия предлагает 15. Держать два разных числа
   значило бы объяснять пользователю разницу между «сколько создать»
   и «сколько повторить», а он вправе считать это одной величиной.
*/
const PHRASE_SHARE = 1/3;

// сколько карточек за раз: границы совпадают с check-ограничением
// session_size в 04-phrases.sql
const SESSION_MIN = 10, SESSION_MAX = 20, SESSION_DEFAULT = 20;

const KINDS = ['word','phrase'];
function normKind(k){ return k === 'phrase' ? 'phrase' : 'word'; }
/*
   Одна карточка — одна форма. Gemini иногда кладёт в карточку пару
   вариантов («say yes \ say no», «сказать да / сказать нет»): такую не
   собрать из плиток и не набрать, и она возвращается в очередь снова и
   снова. Оставляем первый вариант. Слэш без пробелов внутри одного слова
   (and/or, 24/7) — это не пара вариантов, его не трогаем.
*/
function oneVariant(s){
  s = String(s || '').trim();
  if(!/[\/\\|]/.test(s)) return s;
  const parts = s.split(/\s*[\/\\|]\s*/).map(p => p.trim());
  const pair = /[\\|]/.test(s) || /\s\/|\/\s/.test(s) || parts.some(p => /\s/.test(p));
  if(!pair) return s;
  return parts.find(p => /\p{L}/u.test(p)) || s;
}
function oneVariantItem(w){
  return Object.assign({}, w, { word: oneVariant(w && w.word), translation: oneVariant(w && w.translation) });
}

/*
   Размер сессии. Источник истины — Supabase (настройка должна переезжать
   между устройствами), localStorage — только кэш на время до первой
   загрузки профиля: экран карточек рисуется раньше, чем приходит ответ,
   и без кэша он на секунду показал бы чужие двадцать.
*/
function clampSession(v){
  const n = parseInt(v, 10);
  if(!isFinite(n)) return SESSION_DEFAULT;
  return Math.min(SESSION_MAX, Math.max(SESSION_MIN, n));
}
function cachedSessionSize(){
  try{
    const raw = localStorage.getItem('worddeck_session_size');
    return raw == null ? SESSION_DEFAULT : clampSession(raw);
  }catch(e){ return SESSION_DEFAULT; }
}
function sessionSize(){
  if(settings && settings.session_size != null) return clampSession(settings.session_size);
  return cachedSessionSize();
}
function cacheSessionSize(v){
  try{ localStorage.setItem('worddeck_session_size', String(clampSession(v))); }catch(e){}
}
// кэш поднимаем сразу: экран карточек рисуется раньше, чем приходит профиль,
// иначе он на секунду показал бы чужой размер по умолчанию
settings.session_size = cachedSessionSize();
// сколько фраз и слов в сессии заданного размера
function sessionMix(limit){
  const n = clampSession(limit);
  const phrases = Math.round(n * PHRASE_SHARE);
  return { total:n, phrases, words: n - phrases };
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function langByCode(code){ return LANGS.find(l=>l.code===code) || LANGS[0]; }
function localeOf(code){ return LOCALES[code] || 'en'; }
/*
   Даты — только местные. toISOString() отдаёт UTC, и для UTC+3 новый день
   наступал в 03:00: карточки «на сегодня» появлялись среди ночи, а занятие
   в час ночи засчитывалось во вчерашнюю серию. Сроки повтора — тоже
   местные, через setDate, а не прибавлением суток в миллисекундах:
   при переходе на летнее время сутки бывают в 23 и 25 часов.
*/
function localISO(d){
  const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function todayISO(){ return localISO(new Date()); }
function addDaysISO(n){ const d = new Date(); d.setDate(d.getDate() + n); return localISO(d); }

function t(key, vars){
  const dict = I18N[ifaceLang] || I18N.en;
  let s = dict[key] !== undefined ? dict[key] : (I18N.en[key] || '');
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}

// название языка на языке интерфейса: «немецкий» / «German» / «Deutsch»
let _dn = null;
function langLabel(code){
  const native = langByCode(code).name;
  try{
    if(_dn === null) _dn = new Intl.DisplayNames([localeOf(ifaceLang)], { type:'language' });
    const v = _dn.of(code);
    if(v && v !== code) return v.charAt(0).toUpperCase() + v.slice(1);
  }catch(e){ _dn = false; }
  return native;
}
function langPairLabel(){
  if(!settings.target_lang) return '—';
  return langLabel(settings.target_lang) + ' · ' + langLabel(settings.native_lang);
}

/* =========================================================================
   Тосты — единственный способ сообщить, что запись не прошла
   ========================================================================= */
/*
   action — необязательная кнопка в тосте: { label, fn }. Такой тост
   живёт дольше, чтобы до кнопки успели дотянуться.
*/
function toast(text, kind, action){
  const box = $('toasts');
  if(!box || !text) return;
  // одна и та же ошибка от трёх запросов подряд не должна давать три тоста
  if(box.lastChild && box.lastChild.dataset.text === text) return;
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.dataset.text = text;
  if(kind === 'good' || kind === 'bad'){
    const ic = document.createElement('span');
    ic.className = 'ic';
    ic.innerHTML = kind === 'good' ? ICON.check('currentColor', 18, 2.6) : ICON.warn;
    d.appendChild(ic);
  }
  const span = document.createElement('span');
  span.textContent = text;
  d.appendChild(span);
  if(action && action.label && typeof action.fn === 'function'){
    d.classList.add('withAction');
    const b = document.createElement('button');
    b.className = 'toastAct';
    b.textContent = action.label;
    b.onclick = ()=>{ d.remove(); action.fn(); };
    d.appendChild(b);
  }
  box.appendChild(d);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(()=>{
    d.style.transition = 'opacity .25s';
    d.style.opacity = '0';
    setTimeout(()=>d.remove(), 300);
  }, action ? 8000 : (kind === 'bad' ? 5200 : 4000));
}

/*
   Supabase возвращает ошибку в поле error, а не исключением. Без проверки
   пользователь видит «сохранено», а после перезагрузки — пустоту: сеть,
   RLS или истёкшая сессия молча съедают запись. Все вызовы sb.from(...)
   идут через sbTry.
*/
/*
   quiet — без тоста: для проб схемы и запросов, исход которых
   вызывающий код разбирает сам (гонка двух устройств за первую версию
   плана, например). Ошибка всё равно уходит в консоль.
*/
async function sbTry(query, msgKey, quiet){
  try{
    const res = await query;
    if(res && res.error){
      console.warn('supabase:', res.error.message || res.error);
      if(!quiet){
        const schemaErr = missingColumn(res.error) || missingTable(res.error);
        toast(schemaErr ? t('dbOutdated') : t(msgKey || 'errSave'), 'bad');
      }
    }
    return res || { data:null, error:null };
  }catch(e){
    console.warn('supabase:', e);
    if(!quiet) toast(t(msgKey || 'errSave'), 'bad');
    return { data:null, error:e };
  }
}

/* =========================================================================
   Совместимость со схемой базы

   index.html обновляется одним файлом, а миграции в Supabase выполняются
   руками — между этими двумя действиями всегда есть зазор. Пока
   04-phrases.sql не выполнен, колонок kind и session_size нет, и каждый
   запрос с ними падает: карточки не грузятся, слова не добавляются,
   настройки не сохраняются. Поэтому наличие колонок проверяется один раз
   при входе, а без них приложение работает как до части A — просто без
   фраз и без выбора размера сессии.
   ========================================================================= */
let dbCaps = { kind:true, sessionSize:true, displayName:true, chatSync:true, goals:true, plans:true, materials:true, social:true };

// PostgREST на отсутствующую колонку отвечает 42703, а на неизвестное поле
// в теле запроса — PGRST204; текст в обоих случаях содержит имя колонки
function missingColumn(err){
  if(!err) return false;
  const code = String(err.code || '');
  if(code === '42703' || code === 'PGRST204') return true;
  return /column .* does not exist|could not find the .* column/i.test(String(err.message || ''));
}

// таблицы целиком тоже может не быть — PostgREST отвечает на это 42P01
function missingTable(err){
  if(!err) return false;
  const code = String(err.code || '');
  if(code === '42P01' || code === 'PGRST205') return true;
  return /relation .* does not exist|could not find the table/i.test(String(err.message || ''));
}

async function detectDbCaps(){
  dbCaps = { kind:true, sessionSize:true, displayName:true, chatSync:true, goals:true, plans:true, materials:true, social:true };
  // лёгкие пробы без тостов: про миграцию скажем один раз сами, ниже
  const probe = q => sbTry(q, null, true);
  const gone = r => missingTable(r.error) || missingColumn(r.error);
  const [a, b, c, d, g, p, m, s1, s2] = await Promise.all([
    probe(sb.from('words_progress').select('kind').limit(1)),
    probe(sb.from('user_settings').select('session_size').limit(1)),
    probe(sb.from('profiles').select('display_name').limit(1)),
    probe(sb.from('chat_state').select('user_id').limit(1)),
    probe(sb.from('user_settings').select('goals,goal_note,target_level').limit(1)),
    probe(sb.from('learning_plans').select('id').limit(1)),
    probe(sb.from('materials').select('id').limit(1)),
    probe(sb.from('profiles').select('friend_code,bio,avatar,rank_track,week_xp,week_start,achievements').limit(1)),
    probe(sb.from('friendships').select('id').limit(1))
  ]);
  if(gone(s1) || gone(s2)) dbCaps.social = false;
  if(missingColumn(a.error)) dbCaps.kind = false;
  if(missingColumn(b.error)) dbCaps.sessionSize = false;
  if(missingColumn(c.error)) dbCaps.displayName = false;
  if(gone(d)) dbCaps.chatSync = false;
  if(gone(g)) dbCaps.goals = false;
  if(gone(p)) dbCaps.plans = false;
  if(gone(m)) dbCaps.materials = false;

  const missing = [];
  if(!dbCaps.kind || !dbCaps.sessionSize) missing.push('sql/04-phrases.sql');
  if(!dbCaps.displayName || !dbCaps.chatSync) missing.push('sql/05-name-chat.sql');
  if(!dbCaps.goals || !dbCaps.plans || !dbCaps.materials) missing.push('sql/06-plan-materials.sql');
  if(!dbCaps.social) missing.push('sql/07-social-ranks.sql');
  if(missing.length){
    console.warn('WordDeck: не выполнены миграции', missing.join(', '), '—', JSON.stringify(dbCaps));
    toast(t('dbNeedMigration', { files: missing.join(', ') }), 'bad');
  }
}

/* =========================================================================
   Озвучка — speechSynthesis браузера, без ключей и без сети
   ========================================================================= */
let voicesCache = [];
function canSpeak(){ return typeof window !== 'undefined' && 'speechSynthesis' in window; }
function loadVoices(){
  try{ voicesCache = window.speechSynthesis.getVoices() || []; }catch(e){ voicesCache = []; }
}
if(canSpeak()){
  loadVoices();
  // список голосов в Chrome приходит асинхронно, уже после первого вызова
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(locale){
  if(!voicesCache.length) loadVoices();
  const low = String(locale).toLowerCase().replace('_','-');
  const base = low.split('-')[0];
  return voicesCache.find(v => v.lang && v.lang.toLowerCase().replace('_','-') === low)
      || voicesCache.find(v => v.lang && v.lang.toLowerCase().split(/[-_]/)[0] === base)
      || null;
}

function speak(text, langCode, btn, rate){
  if(!canSpeak() || !text) return;
  try{
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 300));
    u.lang = localeOf(langCode || settings.target_lang || 'en');
    const v = pickVoice(u.lang);
    if(v) u.voice = v;
    u.rate = rate || 0.92;
    if(btn){
      document.querySelectorAll('.spkBtn.playing').forEach(x=>x.classList.remove('playing'));
      btn.classList.add('playing');
      const off = ()=>btn.classList.remove('playing');
      u.onend = off; u.onerror = off;
    }
    synth.speak(u);
    achMark('audio');
  }catch(e){ console.warn('tts:', e); }
}

/* =========================================================================
   Живой голос тренера (Gemini TTS)

   Ответы тренера читает голосовая модель Gemini (*-tts*), а не голос
   браузера. Карточки и игры по-прежнему озвучивает speak() — это
   отдельная история. Свой запрос, не aiRun/geminiSend: те ждут текст
   и добавляют thinkingConfig, а здесь в ответе звук.

   Ответ — сырой PCM (16 бит, little-endian, моно). Длинный текст режется
   на куски: первый короткий, чтобы звук начался быстро; пока играет
   кусок N, синтезируется кусок N+1 — опережение ровно на один.
   ========================================================================= */
const TTS_VOICES = ['Kore','Aoede','Leda','Zephyr','Puck','Charon','Fenrir','Orus'];
/*
   Подводки к тексту нет намеренно. Новые TTS-модели (с 3.x) читают
   присланный текст дословно, как сценарий: указание «читай тёплым
   голосом…» звучало бы вслух перед каждым куском ответа. Манеру чтения
   эти модели берут из отдельного поля стиля, а не из текста; пока его
   нет, голос нейтральный, но читает ровно ответ тренера.
*/
const TTS_STYLE = '';
const TTS_TIMEOUT_MS = 30e3;
const VOICE_MAX_CHARS = 2000;     // на один ответ; остальное не озвучивается
const VOICE_FIRST_CHUNK = 180;
const VOICE_CHUNK = 350;
const VOICE_CACHE_MAX = 40;

let voiceName = 'Kore', voiceAuto = false;
try{
  voiceName = localStorage.getItem('worddeck_voice') || 'Kore';
  voiceAuto = localStorage.getItem('worddeck_voice_auto') === '1';
}catch(e){}
if(TTS_VOICES.indexOf(voiceName) < 0) voiceName = 'Kore';

/*
   Пауза голосовых моделей — своя и только в памяти. noteModelOk/Fail
   не годятся: они выставили бы workingModel = TTS-модель, и текстовый
   тренер начал бы ходить в неё. «Модели нет» — до перезагрузки.
*/
const ttsCooldown = {};
const TTS_COOLDOWN = { quota: 5 * 60e3, busy: 60e3, notfound: Infinity };
function ttsResting(m){ return (ttsCooldown[m] || 0) > Date.now(); }

// текст → { data: base64 PCM, rate }
async function ttsSynthesize(text, voice){
  const models = ttsCandidates.filter(m => !ttsResting(m)).slice(0, 2);
  if(!models.length) throw aiError('nomodel');
  const body = JSON.stringify({
    contents: [{ role:'user', parts:[{ text: TTS_STYLE + text }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
    }
  });
  let last = null;
  for(const model of models){
    const ctl = new AbortController();
    const timer = setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, TTS_TIMEOUT_MS);
    try{
      let r;
      try{
        r = await fetch(GEMINI_API + '/' + model + ':generateContent', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type':'application/json' }, geminiHeaders(getKey())),
          body, signal: ctl.signal
        });
      }catch(e){
        throw (e && e.name === 'AbortError') ? aiError('timeout') : aiError('network', 0, e && e.message);
      }
      let data = null;
      try{ data = await r.json(); }catch(e){
        if(e && e.name === 'AbortError') throw aiError('timeout');
      }
      if(!r.ok || !data || data.error){
        const msg = (data && data.error && data.error.message) || '';
        throw aiError(classifyAi(r.status, msg), r.status, msg);
      }
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content
                     && data.candidates[0].content.parts) || [];
      const audio = parts.filter(p => p && p.inlineData && p.inlineData.data);
      if(!audio.length) throw aiError('empty', r.status, model);
      const mt = String(audio[0].inlineData.mimeType || '');
      const rm = mt.match(/rate=(\d+)/i);
      return {
        data: audio.map(p => p.inlineData.data),
        rate: rm ? parseInt(rm[1], 10) : 24000
      };
    }catch(e){
      last = e;
      dlog('voice ' + model + ':', e);
      // лимит, перегруз, «модели нет», пустой ответ — пробуем вторую модель
      if(TTS_COOLDOWN[e.code]){ ttsCooldown[model] = Date.now() + TTS_COOLDOWN[e.code]; continue; }
      if(e.code === 'empty') continue;
      throw e;
    }finally{ clearTimeout(timer); }
  }
  throw last || aiError('nomodel');
}

/* ---- воспроизведение ---- */
let voiceCtx = null;
/*
   Контекст создаётся и «будится» внутри жеста пользователя. На iOS Safari
   и части Android иначе звук после асинхронного ответа не заиграет.
*/
function unlockAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    // iOS 16.4+: Web Audio не глушится переключателем «без звука»
    if(navigator.audioSession) navigator.audioSession.type = 'playback';
  }catch(e){}
  try{
    if(!voiceCtx){
      voiceCtx = new AC();
      // пустой сэмпл — старым iOS этого нужно, чтобы контекст ожил
      const s = voiceCtx.createBufferSource();
      s.buffer = voiceCtx.createBuffer(1, 1, 22050);
      s.connect(voiceCtx.destination);
      s.start(0);
    }
    if(voiceCtx.state === 'suspended') voiceCtx.resume().catch(()=>{});
  }catch(e){ dlog('voice ctx:', e); return null; }
  return voiceCtx;
}

/*
   Старые TTS-модели присылают голый PCM (audio/L16), новые по умолчанию —
   WAV: тот же PCM, но с заголовком RIFF впереди. Заголовок, прочитанный
   как звук, давал щелчок в начале каждого куска. Если он есть — берём
   из него частоту и читаем только чанк «data».
*/
function wavData(bytes, dv){
  const tag = o => String.fromCharCode(bytes[o], bytes[o + 1], bytes[o + 2], bytes[o + 3]);
  if(bytes.length < 12 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return null;
  let o = 12, rate = 0;
  while(o + 8 <= bytes.length){
    const id = tag(o), size = dv.getUint32(o + 4, true);
    if(id === 'fmt ' && o + 16 <= bytes.length) rate = dv.getUint32(o + 12, true);
    // в потоковом WAV размер data бывает «бесконечным» — обрезаем по факту
    if(id === 'data') return { start: o + 8, end: Math.min(bytes.length, o + 8 + size), rate };
    o += 8 + size + (size & 1);
  }
  return null;
}

// куски base64 (PCM16 LE или WAV) → AudioBuffer
function pcmToBuffer(chunks, rate){
  const parts = chunks.map(b64=>{
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const dv = new DataView(bytes.buffer);
    const wav = wavData(bytes, dv);
    if(wav && wav.rate) rate = wav.rate;
    const from = wav ? wav.start : 0, to = wav ? wav.end : bytes.length;
    const n = (to - from) >> 1;
    const pcm = new Int16Array(n);
    for(let i = 0; i < n; i++) pcm[i] = dv.getInt16(from + i * 2, true);
    return pcm;
  });
  const total = parts.reduce((s, p) => s + p.length, 0);
  const buf = voiceCtx.createBuffer(1, Math.max(1, total), rate);
  const out = buf.getChannelData(0);
  let o = 0;
  parts.forEach(p=>{ for(let i = 0; i < p.length; i++) out[o++] = p[i] / 32768; });
  return buf;
}

// ответ тренера → то, что можно прочитать вслух: без разметки и маркеров
function speakableText(text){
  const d = document.createElement('div');
  d.innerHTML = richText(text);
  return String(d.textContent || '')
    .replace(/•/g, ' ')
    .replace(/[ \t ]+/g, ' ')
    .replace(/ *\n */g, '\n')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

/*
   Нарезка по абзацам и предложениям. Без lookbehind в регэкспах:
   старый Safari на нём падает целиком при разборе скрипта.
*/
// то, что будет озвучено: начало текста не длиннее VOICE_MAX_CHARS, по границе фразы
function voiceSrc(text){
  const src = String(text || '');
  if(src.length <= VOICE_MAX_CHARS) return src;
  const cut = src.slice(0, VOICE_MAX_CHARS);
  const end = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '), cut.lastIndexOf('\n'));
  return end > VOICE_MAX_CHARS / 2 ? cut.slice(0, end + 1) : cut;
}
function voiceChunks(text){
  const src = voiceSrc(text);
  const pieces = [];
  src.split('\n').forEach(par=>{
    const sent = par.match(/[^.!?…。！？]+(?:[.!?…。！？]+[)"»”'’]*|$)\s*/g) || [];
    sent.forEach(s=>{
      s = s.trim();
      // слишком длинное предложение — по запятым, а в крайнем случае по пробелам
      while(s.length > VOICE_CHUNK){
        let at = s.lastIndexOf(', ', VOICE_CHUNK);
        if(at < VOICE_CHUNK / 3) at = s.lastIndexOf(' ', VOICE_CHUNK);
        if(at < VOICE_CHUNK / 3) at = VOICE_CHUNK;
        pieces.push(s.slice(0, at + 1).trim());
        s = s.slice(at + 1).trim();
      }
      if(s) pieces.push(s);
    });
  });
  const out = [];
  let cur = '';
  pieces.forEach(p=>{
    const lim = out.length ? VOICE_CHUNK : VOICE_FIRST_CHUNK;
    if(cur && (cur.length + 1 + p.length) > lim){ out.push(cur); cur = p; }
    else cur = cur ? cur + ' ' + p : p;
  });
  if(cur) out.push(cur);
  return out;
}

// кэш «голос|кусок» → AudioBuffer: повторное прослушивание не ходит в сеть
const voiceCache = new Map();
// rate < 1 — тот же звук, растянутый на устройстве: в сеть второй раз не ходим
function voiceChunk(text, voice, rate){
  const r = rate || 1;
  const key = voice + '|' + r + '|' + text;
  if(voiceCache.has(key)){
    const b = voiceCache.get(key);
    voiceCache.delete(key); voiceCache.set(key, b);
    return Promise.resolve(b);
  }
  const base = r === 1
    ? ttsSynthesize(text, voice).then(res => pcmToBuffer(res.data, res.rate))
    : voiceChunk(text, voice, 1);
  return base.then(buf=>{
    const out = r === 1 ? buf : stretchBuffer(buf, r);
    voiceCache.set(key, out);
    while(voiceCache.size > VOICE_CACHE_MAX) voiceCache.delete(voiceCache.keys().next().value);
    return out;
  });
}

/*
   Замедление без «пьяного» голоса. playbackRate у Web Audio тянет и высоту
   тона: на 0.6× тренер басит. Поэтому звук растягивается по времени
   методом WSOLA: окна по 32 мс накладываются внахлёст, и каждое следующее
   сдвигается в пределах ±8 мс туда, где оно лучше всего совпадает по форме
   с продолжением предыдущего, — тогда стыков не слышно. Корреляция
   считается по каждому третьему отсчёту: на 20 с речи это десятки мс.
*/
function stretchPcm(x, rate){
  const N = 768, H = N >> 1, Ha = H * rate, TOL = 192, STEP = 3;
  const win = new Float32Array(N);
  for(let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const outLen = Math.ceil(x.length / rate) + N;
  const y = new Float32Array(outLen), norm = new Float32Array(outLen);
  let prev = 0, last = 0;
  for(let k = 0, outPos = 0; outPos + N < outLen; k++, outPos += H){
    const nominal = Math.round(k * Ha);
    let best = nominal;
    const nat = prev + H;
    if(k > 0 && nat + H <= x.length){
      let bestC = -Infinity;
      for(let d = -TOL; d <= TOL; d += STEP){
        const p = nominal + d;
        if(p < 0 || p + N > x.length) continue;
        let c = 0;
        for(let i = 0; i < H; i += STEP) c += x[p + i] * x[nat + i];
        if(c > bestC){ bestC = c; best = p; }
      }
    }
    if(best < 0 || best + N > x.length) break;
    for(let i = 0; i < N; i++){ y[outPos + i] += x[best + i] * win[i]; norm[outPos + i] += win[i]; }
    prev = best; last = outPos + N;
  }
  for(let i = 0; i < last; i++) if(norm[i] > 1e-3) y[i] /= norm[i];
  return y.subarray(0, Math.max(1, last));
}
function stretchBuffer(buf, rate){
  const y = stretchPcm(buf.getChannelData(0), rate);
  const out = voiceCtx.createBuffer(1, y.length, buf.sampleRate);
  out.getChannelData(0).set(y);
  return out;
}

// весь живой голос идёт через анализатор: по нему пульсируют круги
let voiceAnalyser = null;
function voiceOut(ctx){
  if(!voiceAnalyser || voiceAnalyser.context !== ctx){
    try{
      voiceAnalyser = ctx.createAnalyser();
      voiceAnalyser.fftSize = 512;
      voiceAnalyser.connect(ctx.destination);
    }catch(e){ voiceAnalyser = null; return ctx.destination; }
  }
  return voiceAnalyser;
}
// громкость 0…1 по среднеквадратичному уровню; речь редко выше 0.25 RMS
let rmsBuf = null;
function levelOf(an){
  if(!an) return 0;
  if(!rmsBuf || rmsBuf.length !== an.fftSize) rmsBuf = new Float32Array(an.fftSize);
  an.getFloatTimeDomainData(rmsBuf);
  let s = 0;
  for(let i = 0; i < rmsBuf.length; i++) s += rmsBuf[i] * rmsBuf[i];
  return Math.min(1, Math.sqrt(s / rmsBuf.length) * 5);
}

/*
   Одновременно звучит одно сообщение. voiceToken — номер текущего
   воспроизведения: stopVoice() его меняет, и все ждущие куски старого
   прослушивания, проснувшись, видят чужой номер и молча выходят.
*/
let voiceToken = 0;
let voiceSources = [];
let voiceBtn = null;
let voiceFallbackOn = false;
let voiceFallbackBtn = null;
const voiceToasted = {};

function paintVoiceBtn(btn, state){
  if(!btn) return;
  btn.classList.toggle('loading', state === 'loading');
  btn.classList.toggle('playing', state === 'playing');
  if(btn.classList.contains('spkBtn'))
    btn.setAttribute('aria-label', t(state ? 'ariaVoiceStop' : 'ariaVoicePlay'));
}

function stopVoice(){
  voiceToken++;
  voiceSources.forEach(s=>{ s.onended = null; try{ s.stop(); }catch(e){} });
  voiceSources = [];
  if(voiceFallbackOn){
    voiceFallbackOn = false;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    // onend у прерванной фразы приходит не во всех браузерах
    if(voiceFallbackBtn) paintVoiceBtn(voiceFallbackBtn, '');
    voiceFallbackBtn = null;
  }
  if(voiceBtn){ paintVoiceBtn(voiceBtn, ''); voiceBtn = null; }
}

// повторное нажатие на играющее сообщение — стоп; на другое — переключение
function toggleVoice(btn, text, lang){
  if(btn.classList.contains('playing') || btn.classList.contains('loading')){ stopVoice(); return; }
  playVoice(text, btn, lang);
}

// живого голоса нет — читаем голосом браузера, тост один раз за сессию
function voiceFallback(plain, btn, lang, why){
  paintVoiceBtn(btn, '');
  voiceBtn = null;
  if(!voiceToasted[why]){ voiceToasted[why] = true; toast(t(why)); }
  if(!canSpeak()) return;
  voiceFallbackOn = true;
  voiceFallbackBtn = btn;
  speak(plain, lang || settings.native_lang, btn);
}

function voiceFail(e, plain, btn, lang, onFail, fallback){
  dlog('voice:', e);
  if(e && (e.code === 'network' || e.code === 'timeout' || e.code === 'busy' || isNetworkError(e))){
    paintVoiceBtn(btn, ''); voiceBtn = null;
    toast(t(friendlyError(e)));
    if(onFail) onFail(e);
    return;
  }
  // key / quota / notfound / region / nomodel и прочее — голос браузера
  const why = ttsCandidates.length ? 'voiceFallback' : 'voiceNoModel';
  if(fallback) fallback(why);
  else voiceFallback(plain, btn, lang, why);
}

function waitCtxTime(ctx, when){
  const ms = (when - ctx.currentTime) * 1000;
  return ms > 0 ? new Promise(res => setTimeout(res, ms)) : Promise.resolve();
}

/*
   Повтор с фразы посреди куска. Место по доле текста известно лишь
   примерно, поэтому рядом с ним (−1 … +0.6 с) ищется пауза: отрезки тише
   десятой доли громкости. Побеждает самая длинная и близкая — между
   фразами пауза обычно дольше, чем на запятой. Старт — за 60 мс до конца
   паузы, чтобы не срезать первый звук. Пауз нет — старт по оценке.
*/
function voiceSeekPause(buf, t){
  const x = buf.getChannelData(0), sr = buf.sampleRate, F = Math.max(1, Math.round(sr * 0.01));
  const lo = Math.max(0, Math.floor((t - 1) * sr / F)), hi = Math.min(Math.floor(x.length / F) - 1, Math.ceil((t + 0.6) * sr / F));
  if(hi <= lo) return Math.max(0, Math.min(t, buf.duration - 0.05));
  const rms = [];
  let peak = 0;
  for(let f = lo; f <= hi; f++){
    let s = 0;
    for(let i = f * F, e = i + F; i < e; i += 2) s += x[i] * x[i];
    const r = Math.sqrt(s / (F / 2));
    rms.push(r);
    if(r > peak) peak = r;
  }
  const thr = peak * 0.1;
  let best = -1, bestScore = -Infinity;
  for(let j = 0; j < rms.length; ){
    if(rms[j] >= thr){ j++; continue; }
    let k = j;
    while(k < rms.length && rms[k] < thr) k++;
    const len = (k - j) * F / sr, mid = (lo + (j + k) / 2) * F / sr;
    const score = len - Math.abs(mid - t) * 0.35;
    if(len >= 0.06 && score > bestScore){ bestScore = score; best = (lo + k) * F / sr; }
    j = k;
  }
  const at = best < 0 ? t : best - 0.06;
  return Math.max(0, Math.min(at, buf.duration - 0.05));
}

/*
   opts — для голосового режима: rate — скорость (1, 0.8, 0.6);
   from { chunk, frac } — играть с этого места, а не с начала;
   onChunk(i, текст, начало, длительность) — кусок встал в очередь, по нему
   идут субтитры; onEnd() — ответ дозвучал сам (не остановлен);
   onFallback(текст) — живого голоса нет, читает сам режим; onFail(e) —
   сбой сети. Кнопка в чате вызывает без opts.
*/
async function playVoice(text, btn, lang, opts){
  const o = opts || {};
  stopVoice();
  const my = voiceToken;
  const plain = speakableText(text);
  const chunks = voiceChunks(plain);
  if(!chunks.length){ if(o.onEnd) o.onEnd(); return; }
  voiceBtn = btn;
  const fallback = why=>{
    if(!o.onFallback){ voiceFallback(plain, btn, lang, why); return; }
    paintVoiceBtn(btn, ''); voiceBtn = null;
    if(!voiceToasted[why]){ voiceToasted[why] = true; toast(t(why)); }
    o.onFallback(plain);
  };
  if(!ttsCandidates.length){ fallback('voiceNoModel'); return; }
  const ctx = unlockAudio();
  if(!ctx){ fallback('voiceFallback'); return; }
  paintVoiceBtn(btn, 'loading');
  const voice = voiceName, rate = o.rate || 1;
  let queued = false, ended = false;
  const finish = ()=>{
    if(my !== voiceToken || !queued || voiceSources.length || ended) return;
    ended = true;
    paintVoiceBtn(btn, '');
    if(voiceBtn === btn) voiceBtn = null;
    if(o.onEnd) o.onEnd();
  };
  // from — начать не с начала: с куска chunk, с доли frac его текста
  const first = o.from ? Math.min(o.from.chunk, chunks.length - 1) : 0;
  let next = voiceChunk(chunks[first], voice, rate);
  let endAt = 0;
  for(let i = first; i < chunks.length; i++){
    let buf;
    try{ buf = await next; }
    catch(e){
      if(my !== voiceToken) return;
      if(i === first){ voiceFail(e, plain, btn, lang, o.onFail, o.onFallback ? fallback : null); return; }
      // сбой посреди ответа: уже звучащее доигрывает, остальное — нет
      dlog('voice chunk ' + i + ':', e);
      break;
    }
    if(my !== voiceToken) return;
    if(ctx.state === 'suspended'){ try{ await ctx.resume(); }catch(e){} }
    if(my !== voiceToken) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(voiceOut(ctx));
    // следующий кусок встаёт ровно в конец предыдущего — без паузы
    const startAt = Math.max(ctx.currentTime + 0.02, endAt);
    src.onended = ()=>{
      voiceSources = voiceSources.filter(s => s !== src);
      finish();
    };
    const off = i === first && o.from && o.from.frac > 0 ? voiceSeekPause(buf, o.from.frac * buf.duration) : 0;
    src.start(startAt, off);
    voiceSources.push(src);
    // начало куска — как если бы он играл целиком: субтитры считают долю от него
    if(o.onChunk) o.onChunk(i, chunks[i], startAt - off, buf.duration);
    endAt = startAt + buf.duration - off;
    paintVoiceBtn(btn, 'playing');
    if(i + 1 < chunks.length){
      // опережение ровно на один: следующий просим, когда этот зазвучал
      await waitCtxTime(ctx, startAt);
      if(my !== voiceToken) return;
      next = voiceChunk(chunks[i + 1], voice, rate);
    }
  }
  queued = true;
  finish();
}

const AI_MENU_ICONS = {
  speak: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"></path><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg>',

  detail: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path><path d="M14 7l3 3"></path></svg>'

let aiMenuOpen = null;
function closeAiMenu(){
  if(!aiMenuOpen) return;
  aiMenuOpen.menu.classList.remove('open');
  aiMenuOpen.ch.classList.remove('on');
  aiMenuOpen.ch.setAttribute('aria-expanded', 'false');
  aiMenuOpen = null;
}
function aiActions(node, bubble, text){
  const ch = document.createElement('button');
  ch.type = 'button';
  ch.className = 'aiChev';
  ch.setAttribute('aria-label', t('ariaMsgActions'));
  ch.setAttribute('aria-expanded', 'false');
  ch.setAttribute('aria-haspopup', 'menu');
  ch.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';
  bubble.appendChild(ch);
  const menu = document.createElement('div');
  menu.className = 'aiMenu';
  menu.innerHTML = '<div><div class="aiPanel" role="menu"></div></div>';
  node.appendChild(menu);
  const panel = menu.querySelector('.aiPanel');
  // автоозвучка: всегда играет с начала, даже если ответ уже звучал
  node._speak = ()=>{ unlockAudio(); playVoice(text, ch, settings.native_lang); };
  const items = [
    ['speak', ()=>{ unlockAudio(); toggleVoice(ch, text, settings.native_lang); }],
    ['more', ()=>askAbout('more', text)],
    ['detail', ()=>askAbout('detail', text)]
  ];
  const build = ()=>{
    panel.innerHTML = '';
    const busy = ch.classList.contains('playing') || ch.classList.contains('loading');
    items.forEach(([k, fn])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'menuitem');
      b.innerHTML = AI_MENU_ICONS[k] + '<span></span>';
      b.querySelector('span').textContent = t(k === 'speak' ? (busy ? 'menuStop' : 'menuSpeak') : k === 'more' ? 'menuMoreEx' : 'menuMoreDetail');
      b.onclick = e=>{ e.stopPropagation(); closeAiMenu(); fn(); };
      panel.appendChild(b);
    });
  };
  ch.onclick = e=>{
    e.stopPropagation();
    if(aiMenuOpen && aiMenuOpen.menu === menu){ closeAiMenu(); return; }
    closeAiMenu();
    build();
    menu.classList.add('open');
    ch.classList.add('on');
    ch.setAttribute('aria-expanded', 'true');
    aiMenuOpen = { menu, ch };
    // меню у последнего ответа уходит под поле ввода — подкручиваем чат
    setTimeout(()=>{
      const box = $('chatBox');
      if(!box || aiMenuOpen === null || aiMenuOpen.menu !== menu) return;
      const r = menu.getBoundingClientRect(), br = box.getBoundingClientRect();
      if(r.bottom > br.bottom) box.scrollBy({ top: r.bottom - br.bottom + 8, behavior: reduceMotion() ? 'auto' : 'smooth' });
    }, 380);
  };
}
document.addEventListener('click', e=>{
  if(aiMenuOpen && !aiMenuOpen.menu.contains(e.target) && !aiMenuOpen.ch.contains(e.target)) closeAiMenu();
}, true);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAiMenu(); });

// «ещё пример» и «подробнее»: в чате — короткая реплика, тренеру — точный запрос
function askAbout(kind, text){
  unlockAudio();

  const ex = speakableText(text).slice(0, 600);
  pushMsg('user', t(kind === 'more' ? 'echoMoreEx' : 'echoMoreDetail'));
  askTrainer(kind === 'more'
    ? 'Give me one more example for this part of your earlier message, in the same format: "' + ex + '"'
    : 'I did not understand this. Explain it again in more detail and more simply, step by step: "' + ex + '"', false, true);
}

function reduceMotion(){
  return isLite() || !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

   С автоозвучкой ответ приходит не в жесте пользователя, а позже. Будим

document.addEventListener('pointerdown', ()=>{ if(voiceAuto) unlockAudio(); }, true);

/* =========================================================================
   Тема оформления
   ========================================================================= */
/*
   Тема: тёмная, светлая или «как в системе». theme — то, что реально
   нарисовано, themeChoice — что выбрал человек.
*/
let theme = 'dark', themeChoice = 'dark';
const sysDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function setTheme(v){
  themeChoice = (v === 'light' || v === 'system') ? v : 'dark';
  theme = themeChoice === 'system' ? ((sysDark && !sysDark.matches) ? 'light' : 'dark') : themeChoice;
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('worddeck_theme', themeChoice); }catch(e){}
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', theme === 'dark' ? '#1B1815' : '#FAF6EF');
  applyAccent();
  paintThemeSwitch();
}
if(sysDark && sysDark.addEventListener) sysDark.addEventListener('change', ()=>{ if(themeChoice === 'system') setTheme('system'); });

function paintThemeSwitch(){
  [['thDark','dark'],['thLight','light'],['thSystem','system']].forEach(([id,v])=>{
    const b = $(id); if(!b) return;
    b.classList.toggle('on', themeChoice === v);
    b.setAttribute('aria-pressed', themeChoice === v ? 'true' : 'false');
  });
  const rt = $('rowTheme');
  if(rt) rt.textContent = t(themeChoice === 'system' ? 'themeSystem' : themeChoice === 'light' ? 'profThemeLight' : 'profThemeDark')
    + ' · ' + t('acc_' + accentKey);
}

/*
   Акцент. Каждый подобран так, чтобы тёмный текст на нём и акцентный
   текст на фоне проходили AA в обеих темах. Меняется только --gold
   и две производные — их считаем здесь, а не через color-mix:
   так акцент работает и в браузерах без него.
*/
const ACCENTS = [
  { k:'gold',   d:'#E3B871', l:'#C99A4E' },
  { k:'copper', d:'#E8A07A', l:'#D08A62' },
  { k:'sage',   d:'#AFC596', l:'#8FA877' },
  { k:'wave',   d:'#84C6BC', l:'#63A49C' },
  { k:'dusk',   d:'#A6B3E6', l:'#8191C8' },
  { k:'plum',   d:'#CDA6D6', l:'#AE84B6' },
  { k:'berry',  d:'#EC9398', l:'#D27077' }
];
let accentKey = 'gold';
function hexRgb(h){ const n = parseInt(String(h).slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, p){
  const x = hexRgb(a), y = hexRgb(b);
  return '#' + x.map((v,i)=>Math.round(v * p + y[i] * (1 - p)).toString(16).padStart(2,'0')).join('');
}
function applyAccent(){
  const a = accentKey === 'custom' ? customAccent() : (ACCENTS.find(x => x.k === accentKey) || ACCENTS[0]);
  const st = document.documentElement.style;
  if(theme === 'dark'){
    const [r,g,b] = hexRgb(a.d);
    st.setProperty('--gold', a.d);
    st.setProperty('--gold-soft', 'rgba(' + r + ',' + g + ',' + b + ',.16)');
    st.setProperty('--gold-text', mixHex(a.d, '#FFFFFF', .78));
  }else{
    st.setProperty('--gold', a.l);
    st.setProperty('--gold-soft', mixHex(a.l, '#FFFFFF', .24));
    st.setProperty('--gold-text', mixHex(a.l, '#000000', .55));
  }
}
function setAccent(k){
  if(k !== 'custom' && !ACCENTS.some(a => a.k === k)) return;
  accentKey = k;
  try{ localStorage.setItem('worddeck_accent', k); }catch(e){}
  applyAccent();
  paintThemeSwitch();
  renderAppearance();
}
function toggleGrain(){
  const off = !document.documentElement.classList.contains('noGrain');
  document.documentElement.classList.toggle('noGrain', off);
  try{ localStorage.setItem('worddeck_grain', off ? '0' : '1'); }catch(e){}
  renderAppearance();
}

function renderAppearance(){
  paintThemeSwitch();
  const grid = $('accGrid');
  if(grid){
    grid.innerHTML = '';
    ACCENTS.concat([{ k:'custom' }]).forEach(a=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'accDot' + (a.k === 'custom' ? ' custom' : '') + (a.k === accentKey ? ' on' : '');
      b.setAttribute('aria-pressed', a.k === accentKey ? 'true' : 'false');
      b.innerHTML = '<span><i></i></span><small></small>';
      const dot = b.querySelector('i');
      if(a.k !== 'custom') dot.style.background = theme === 'dark' ? a.d : a.l;
      else if(accentKey === 'custom'){ const c = customAccent(); dot.style.background = theme === 'dark' ? c.d : c.l; }
      if(a.k === accentKey) dot.innerHTML = ICON.check('#1A140C', 18, 3.2);
      b.querySelector('small').textContent = t('acc_' + a.k);
      b.onclick = ()=>setAccent(a.k);
      grid.appendChild(b);
    });
  }
  paintWheel();
  const n = $('accName'); if(n) n.textContent = t('acc_' + accentKey);
  const g = $('grainToggle'); if(g) g.classList.toggle('on', !document.documentElement.classList.contains('noGrain'));
}

/*
   Свой цвет акцента — круг палитры: угол — оттенок, расстояние от
   центра — насыщенность. Светлота фиксирована под тему (в тёмной
   светлее, в светлой темнее), чтобы тёмный текст на кнопке и цветной
   текст на фоне оставались читаемыми при любом выборе.
*/
let accentCustom = { h:30, s:.62 };
try{ const c = JSON.parse(localStorage.getItem('worddeck_accent_custom') || 'null'); if(c && isFinite(c.h) && isFinite(c.s)) accentCustom = c; }catch(e){}
const WHEEL_L = { dark:72, light:54 };
function hslHex(h, s, l){
  s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l / 100));
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function customAccent(){
  return { k:'custom', d: hslHex(accentCustom.h, accentCustom.s, WHEEL_L.dark), l: hslHex(accentCustom.h, accentCustom.s, WHEEL_L.light) };
}
function paintWheel(){
  const w = $('accWheel'); if(!w) return;
  const L = WHEEL_L[theme] || 72;
  const stops = []; for(let h = 0; h <= 360; h += 30) stops.push('hsl(' + h + ',90%,' + L + '%)');
  w.style.background = 'radial-gradient(closest-side,hsl(0,0%,' + L + '%),hsla(0,0%,' + L + '%,0)),conic-gradient(' + stops.join(',') + ')';
  const r = 90, a = accentCustom.h * Math.PI / 180, d = accentCustom.s * r;
  const dot = $('accWheelDot');
  dot.style.left = (r + Math.sin(a) * d) + 'px';
  dot.style.top = (r - Math.cos(a) * d) + 'px';
  const c = customAccent();
  dot.style.background = theme === 'dark' ? c.d : c.l;
  $('accWheelSw').style.background = theme === 'dark' ? c.d : c.l;
  dot.style.opacity = accentKey === 'custom' ? '1' : '.55';
}
function wheelPick(e){
  const w = $('accWheel'), b = w.getBoundingClientRect();
  const x = e.clientX - b.left - b.width / 2, y = e.clientY - b.top - b.height / 2;
  accentCustom = {
    h: Math.round((Math.atan2(x, -y) * 180 / Math.PI + 360) % 360),
    s: Math.round(Math.min(1, Math.hypot(x, y) / (b.width / 2)) * 100) / 100
  };
  accentKey = 'custom';
  applyAccent();
  paintWheel();
}
(function bindWheel(){
  const w = $('accWheel'); if(!w) return;
  let drag = false;
  const save = ()=>{
    try{
      localStorage.setItem('worddeck_accent_custom', JSON.stringify(accentCustom));
      localStorage.setItem('worddeck_accent', 'custom');
    }catch(e){}
    renderAppearance();
  };
  w.addEventListener('pointerdown', e=>{ drag = true; try{ w.setPointerCapture(e.pointerId); }catch(x){} wheelPick(e); });
  w.addEventListener('pointermove', e=>{ if(drag) wheelPick(e); });
  w.addEventListener('pointerup', ()=>{ if(drag){ drag = false; save(); } });
  w.addEventListener('pointercancel', ()=>{ drag = false; });
  // с клавиатуры: стрелки влево/вправо — оттенок, вверх/вниз — насыщенность
  w.addEventListener('keydown', e=>{
    const k = e.key;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(k) < 0) return;
    e.preventDefault();
    if(k === 'ArrowLeft')  accentCustom.h = (accentCustom.h + 350) % 360;
    if(k === 'ArrowRight') accentCustom.h = (accentCustom.h + 10) % 360;
    if(k === 'ArrowUp')    accentCustom.s = Math.min(1, accentCustom.s + .05);
    if(k === 'ArrowDown')  accentCustom.s = Math.max(0, accentCustom.s - .05);
    accentKey = 'custom'; applyAccent(); save();
  });
})();

let av = { idx:5, zoom:1.45, ox:0, oy:0 };
function avSrc(){ return 'assets/beaver-' + POSES[av.idx] + '.png'; }
function avLoad(){
  try{
    const raw = localStorage.getItem('worddeck_avatar');
    if(raw) av = Object.assign(av, JSON.parse(raw));
  }catch(e){}
  if(!POSES[av.idx]) av.idx = 5;
}
function avSave(){
  try{ localStorage.setItem('worddeck_avatar', JSON.stringify(av)); }catch(e){}
  // поза бобра видна друзьям — кладём её в профиль, кадр остаётся на устройстве
  const pose = POSES[av.idx];
  if(session && dbCaps.social && profile && profile.avatar !== pose){
    profile.avatar = pose;
    sbTry(sb.from('profiles').update({ avatar: pose }).eq('id', session.user.id), null, true);
  }
}

function paintAvatars(){
  const src = avSrc();
  const big  = 'translate(' + av.ox + 'px,' + av.oy + 'px) scale(' + av.zoom + ')';
  const bigImg = $('avBig');
  if(bigImg){ bigImg.src = src; bigImg.style.transform = big; }
  // круглые аватарки разного размера: картинка — доля от размера круга
  ['avMini','profAvatar','railAvatar'].forEach(id=>{
    const face = $(id); if(!face) return;
    const img = face.querySelector('img'); if(!img) return;
    const size = face.clientWidth || face.offsetWidth || 40;
    const w = Math.round(size * 0.72);
    const k = size / 214;
    img.src = src;
    img.style.width = w + 'px';
    img.style.marginLeft = (-w / 2) + 'px';
    img.style.marginTop = (-w * 0.62) + 'px';
    img.style.transform = 'translate(' + (av.ox * k) + 'px,' + (av.oy * k) + 'px) scale(' + av.zoom + ')';
  });
  const r = $('avRange'); if(r) r.value = av.zoom;
  const zl = $('avZoomLabel'); if(zl) zl.textContent = Math.round(av.zoom * 100) + '%';
  const cap = $('avCaption'); if(cap) cap.textContent = t('avDragHint');
}

function buildAvatarGrid(){
  const g = $('avGrid'); g.innerHTML = '';
  POSES.forEach((p,i)=>{
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'avCell' + (i === av.idx ? ' sel' : '');
    d.setAttribute('aria-label', p.replace(/-/g,' '));
    d.setAttribute('aria-pressed', i === av.idx ? 'true' : 'false');
    d.innerHTML = '<img src="assets/beaver-' + p + '.png" alt="">';
    d.onclick = ()=>{ av = { idx:i, zoom:1.45, ox:0, oy:0 }; avSave(); buildAvatarGrid(); paintAvatars(); };
    g.appendChild(d);
  });
}

function avSetZoom(v){ av.zoom = parseFloat(v); avSave(); paintAvatars(); }
function avZoom(d){ av.zoom = Math.min(3, Math.max(0.8, av.zoom + d)); avSave(); paintAvatars(); }
function avReset(){ av.ox = 0; av.oy = 0; av.zoom = 1.45; avSave(); paintAvatars(); }

(function bindAvatarDrag(){
  let drag = null;
  document.addEventListener('DOMContentLoaded', ()=>{
    const st = $('avStage'); if(!st) return;
    st.addEventListener('pointerdown', e=>{
      st.setPointerCapture && st.setPointerCapture(e.pointerId);
      drag = { x:e.clientX, y:e.clientY, ox:av.ox, oy:av.oy };
    });
    st.addEventListener('pointermove', e=>{
      if(!drag) return;
      av.ox = drag.ox + (e.clientX - drag.x);
      av.oy = drag.oy + (e.clientY - drag.y);
      paintAvatars();
    });
    const stop = ()=>{ if(drag){ drag = null; avSave(); } };
    st.addEventListener('pointerup', stop);
    st.addEventListener('pointercancel', stop);
  });
})();

// пояснения в скобках и хвосты вида «… —» перед ссылкой. В узкой колонке
// оставляем только начало формулировки.
function shortLabel(s){
  return String(s).split(/\s[—–-](?:\s|$)|[,(:，（：、]/)[0].replace(/[\s—–-]+$/,'').trim() || String(s);
}

function setInterfaceLang(code){
  ifaceLang = code;
  _dn = null;

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    let v = t(el.getAttribute('data-i18n'));
    if(v && el.hasAttribute('data-short')) v = shortLabel(v);
    if(v) el.textContent = v;
  });
  TEXT_BINDINGS.forEach(([id,key])=>{ const el = $(id); if(el) el.textContent = t(key); });
  // иконочные кнопки и поля без видимой подписи — только aria-label
  document.querySelectorAll('[data-aria]').forEach(el=>{
    const v = t(el.getAttribute('data-aria'));
    if(v) el.setAttribute('aria-label', v);
  });
  document.querySelectorAll('[data-ph]').forEach(el=>{
    const v = t(el.getAttribute('data-ph'));
    if(v) el.placeholder = v;
  });
  const ml = $('modelLabel'); if(ml) ml.textContent = shortLabel(t('modelLabel'));
  const ci = $('chatInput'); if(ci) ci.placeholder = t('chatPh');
  document.documentElement.lang = ifaceLang;
  document.title = t('docTitle');
  document.documentElement.dir = (ifaceLang === 'ar') ? 'rtl' : 'ltr';

  const dlb = $('deviceLangBtn'); if(dlb) dlb.textContent = langByCode(ifaceLang).name;
  if($('s-device') && $('s-device').classList.contains('on')) renderPerfChoices();

/*
   Клавиатура у Тренера. Обычно Chrome на Android сначала сжимает страницу
   под будущую клавиатуру, и пока та выезжает, в освободившейся половине
   экрана видна светлая подложка самого браузера. С overlaysContent
   клавиатура ложится поверх страницы, страница не сжимается, а поле ввода
   поднимается на env(keyboard-inset-height) (см. стили .chatDock).
   Только на экране Тренера и не под шторкой: в остальных местах вёрстка
   не рассчитана на клавиатуру поверх. Safari этого API не знает — там
   всё как раньше.
*/
function vkOverlay(on){
  const vk = navigator.virtualKeyboard;
  if(!vk) return;
  try{ vk.overlaysContent = !!on; }catch(e){}
}
if(navigator.virtualKeyboard){
  // клавиатура выехала — последние реплики остаются над полем ввода
  navigator.virtualKeyboard.addEventListener('geometrychange', ()=>{
    if(currentScreen !== 's-teacher') return;
    const box = $('chatBox');
    if(box) requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
  });
}

function markTab(name){
  document.querySelectorAll('.tabItem').forEach(el=>{
    const on = el.dataset.tab === name;
    el.classList.toggle('sel', on);

  });
}

  if(from && from !== name) navStack.push(from);

function goBack(){
  const prev = navStack.pop();
  if(!prev){ switchTab(currentTab || 'profile'); return; }
  show('s-' + prev);
  if(MAIN_TABS.indexOf(prev) >= 0 && TABBED.indexOf('s-' + prev) >= 0){ currentTab = prev; markTab(prev); }

}

/* =========================================================================
   Тур по интерфейсу

   Четыре подсказки из макета плюс шаг про «Путь» — вкладки в приложении
   пятая, и без неё в туре осталась бы дырка. Каждый шаг подсвечивает живой
   элемент, а не картинку: координаты снимаются с настоящего DOM-узла, так
   что подсветка не разъезжается ни на узком телефоне, ни в рамке 390×844.
   ========================================================================= */
const TOUR = [
  { pose:'pointing', key:'tour1', pad:6, node:()=>$('homeHero')        },
  { pose:'backpack', key:'tour2', pad:8, node:()=>tabNode('path')      },
  { pose:'teacher',  key:'tour3', pad:8, node:()=>tabNode('teacher')   },
  { pose:'thinking', key:'tour4', pad:8, node:()=>tabNode('cards')     },
  { pose:'thumbsup', key:'tour5', pad:8, node:()=>tabNode('profile')   }
];

// на десктопе Тренер — золотая карточка в меню, а не кнопка таб-бара
function tabNode(name){
  if(name === 'teacher' && isDesktop()) return $('railTrainer');
  return document.querySelector('.tabItem[data-tab="' + name + '"]');
}

let tourStep = -1;
let tourReturnFocus = null;

/*
   Отметка о показанном туре — на аккаунт, а не на устройство.
   С общим ключом «worddeck_tour» первая регистрация на телефоне, где до
   этого кто-то уже заходил, оставалась без тура: флаг с прошлого аккаунта
   уже стоял. Ключ с id пользователя это чинит: новый аккаунт — новый
   ключ — тур показывается ровно один раз.
   Старый общий ключ читаем как запасной для тех, кто тур уже видел,
   чтобы обновление не показало его заново.
*/
function tourKey(){ return 'worddeck_tour_' + (session ? session.user.id : 'anon'); }
function tourSeen(){
  try{
    if(localStorage.getItem(tourKey()) === '1') return true;
    // до появления ключей по аккаунту флаг был один на устройство
    return localStorage.getItem('worddeck_tour') === '1' && !isFreshAccount();
  }catch(e){ return true; }
}
function markTourSeen(){ try{ localStorage.setItem(tourKey(), '1'); }catch(e){} }

// аккаунт, заведённый только что: старый общий флаг к нему не относится
function isFreshAccount(){
  const created = session && session.user && session.user.created_at;
  if(!created) return false;
  const age = Date.now() - Date.parse(created);
  return isFinite(age) && age < 10 * 60 * 1000;
}

// после онбординга и при первом входе тур показывается один раз сам
function maybeStartTour(){
  if(tourSeen() || tourStep >= 0) return;
  setTimeout(()=>{ if(session && tourStep < 0) startTour(); }, 600);
}

function startTour(){
  closeSheet();
  tourReturnFocus = document.activeElement;
  switchTab('home');
  const sc = document.querySelector('#s-home .scroll');
  if(sc) sc.scrollTop = 0;                   // герой должен быть на экране целиком
  tourStep = 0;
  $('tourWrap').classList.add('on');
  document.addEventListener('keydown', tourKeydown, true);
  window.addEventListener('resize', tourMeasure);
  renderTour();
}

function renderTour(){
  const step = TOUR[tourStep];
  if(!step) return;
  const last = tourStep + 1 >= TOUR.length;
  $('tourImg').src = 'assets/beaver-' + step.pose + '.png';
  $('tourStepNum').textContent = t('tourStep', { n: tourStep + 1, total: TOUR.length });
  $('tourTitle').textContent = t(step.key + 'Title');
  $('tourBody').textContent  = t(step.key + 'Body');
  $('tourSkipBtn').textContent = t('tourClose');
  $('tourNextBtn').textContent = last ? t('tourDone') : t('tourNext');
  // перезапуск всплытия карточки: без снятия класса анимация играет один раз
  const tip = $('tourTip');
  tip.classList.remove('pop');
  void tip.offsetWidth;
  tip.classList.add('pop');
  // замер после кадра — на первом шаге вкладка ещё только что переключилась
  requestAnimationFrame(tourMeasure);
  try{ $('tourNextBtn').focus({ preventScroll:true }); }catch(e){}
}

function tourMeasure(){
  const step = TOUR[tourStep];
  if(!step) return;
  const frame = $('app'), node = step.node(), spot = $('tourSpot'), tip = $('tourTip');
  if(!frame || !node) return;
  const f = frame.getBoundingClientRect(), r = node.getBoundingClientRect(), p = step.pad;
  const top  = Math.round(r.top - f.top) - p;
  const left = Math.round(r.left - f.left) - p;
  const w = Math.round(r.width) + p * 2;
  const h = Math.round(r.height) + p * 2;
  spot.style.top = top + 'px';   spot.style.left = left + 'px';
  spot.style.width = w + 'px';   spot.style.height = h + 'px';
  /*
     По горизонтали: на телефоне подсказка тянется во всю ширину, на
     широком экране это была бы полоса через весь монитор — там она
     держится за подсвеченным элементом, но не вылезает за края.
  */
  if(f.width > 640){
    const tw = Math.min(440, f.width - 36);
    const x = Math.max(18, Math.min(f.width - tw - 18, left + w / 2 - tw / 2));
    tip.style.left = Math.round(x) + 'px';
    tip.style.right = 'auto';
    tip.style.width = tw + 'px';
  }else{
    tip.style.left = '18px'; tip.style.right = '18px'; tip.style.width = '';
  }

  // подсказка встаёт с той стороны, где больше места: сверху экрана — под
  // выделением, у таб-бара — над ним
  if(top + h < f.height * 0.5){
    tip.style.top = (top + h + 16) + 'px';
    tip.style.bottom = 'auto';
  }else{
    tip.style.bottom = Math.round(f.height - top + 16) + 'px';
    tip.style.top = 'auto';
  }
}

function tourNext(){
  if(tourStep < 0) return;
  if(tourStep + 1 >= TOUR.length){ endTour(); return; }
  tourStep++;
  renderTour();
}

function tourSkip(){ endTour(); }

function endTour(){
  if(tourStep < 0) return;
  tourStep = -1;
  $('tourWrap').classList.remove('on');
  document.removeEventListener('keydown', tourKeydown, true);
  window.removeEventListener('resize', tourMeasure);
  markTourSeen();
  if(tourReturnFocus && document.contains(tourReturnFocus)){
    try{ tourReturnFocus.focus({ preventScroll:true }); }catch(e){}
  }
  tourReturnFocus = null;
}

// пока тур открыт, Tab не должен уводить фокус на экран под затемнением
function tourKeydown(e){
  if(e.key === 'Escape'){ e.preventDefault(); endTour(); return; }
  if(e.key !== 'Tab') return;
  e.preventDefault();
  const list = [$('tourSkipBtn'), $('tourNextBtn')];
  const i = list.indexOf(document.activeElement);
  const next = e.shiftKey
    ? (i <= 0 ? list.length - 1 : i - 1)
    : (i < 0 || i === list.length - 1 ? 0 : i + 1);
  list[next].focus();
}

/* =========================================================================
   Нижний лист
   ========================================================================= */
/*
   Шторка — модальное окно: пока она открыта, фокус не должен уходить на
   экран под ней, иначе скринридер и клавиатура читают спрятанный контент.
*/
let sheetReturnFocus = null;

function sheetFocusables(){
  return Array.from($('sheet').querySelectorAll(
    'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null);
}

function sheetKeydown(e){
  if(e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if(e.key !== 'Tab') return;
  const list = sheetFocusables();
  if(!list.length){ e.preventDefault(); $('sheet').focus(); return; }
  const first = list[0], last = list[list.length - 1];
  if(e.shiftKey && (document.activeElement === first || document.activeElement === $('sheet'))){
    e.preventDefault(); last.focus();
  }else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
}

function openSheet(title, buildBody){
  const sh = $('sheet');
  vkOverlay(false);          // в шторке клавиатура сжимает страницу, как обычно
  sh.classList.remove('celebrate');
  sh.style.removeProperty('--tint');
  $('sheetTitle').textContent = title;
  $('sheetTitle').classList.toggle('hidden', !title);
  const body = $('sheetBody');
  body.innerHTML = '';
  // список языков красит тело шторки инлайн-стилями — следующей они не нужны
  body.removeAttribute('style');
  buildBody(body);
  sheetReturnFocus = document.activeElement;
  $('sheetWrap').classList.add('on');
  document.addEventListener('keydown', sheetKeydown, true);
  const first = sheetFocusables()[0];
  (first || sh).focus({ preventScroll:true });
}

function closeSheet(){
  if(!$('sheetWrap').classList.contains('on')) return;
  $('sheetWrap').classList.remove('on');
  vkOverlay(currentScreen === 's-teacher');
  document.removeEventListener('keydown', sheetKeydown, true);
  if(sheetReturnFocus && document.contains(sheetReturnFocus)){
    try{ sheetReturnFocus.focus({ preventScroll:true }); }catch(e){}
  }
  sheetReturnFocus = null;
}

   ========================================================================= */
function authMsg(text, ok){
  const el = $('authMsg');
  el.textContent = text || '';
  el.className = 'dim ' + (ok ? 'ok' : (text ? 'bad' : ''));
}

/*
   Ответы Supabase Auth приходят по-английски и техническим языком:
   «Invalid login credentials», «over_email_send_rate_limit». Частые случаи
   переводим в понятные фразы, остальное — общей «не получилось»;
   оригинал уходит в журнал.
*/
function authErrorKey(err){
  const s = String((err && (err.code || '')) + ' ' + (err && err.message || ''));
  if(isNetworkError(err) || /failed to fetch|network/i.test(s)) return 'errNetwork';
  if(/invalid.?(login|credentials)|invalid_credentials/i.test(s)) return 'authErrInvalid';
  if(/already.?(registered|exists|been registered)|user_already_exists/i.test(s)) return 'authErrExists';
  if(/email.?not.?confirmed|email_not_confirmed/i.test(s)) return 'authErrNotConfirmed';
  if(/rate.?limit|too many|over_\w*_rate_limit/i.test(s) || (err && err.status === 429)) return 'authErrRate';
  if(/weak|password should|at least \d+ characters|weak_password/i.test(s)) return 'authErrWeakPass';
  return 'authErrGeneric';
}
function authFail(err, el){
  dlog('auth:', err && (err.code || ''), err && err.message);
  const text = t(authErrorKey(err));
  if(el){ el.textContent = text; el.className = 'dim bad'; }
  else authMsg(text);
}
