/*
   Серия: +1, если вчера было занятие, сброс при пропуске.
   Продлевает её первое за день действие, за которое начисляется XP, —
   раньше хватало открыть приложение, и серия росла без единой карточки.
   Статус в памяти меняется до записи в базу, синхронно: несколько
   начислений подряд (пары в игре идут одно за другим) не увеличат
   серию дважды.
*/
async function touchStreak(){
  const today = todayISO();
  if(profile.last_active === today) return;
  const y = addDaysISO(-1);
  profile.streak = (profile.last_active === y) ? (profile.streak||0) + 1 : 1;
  profile.last_active = today;
  if(!session) return;
  await sbTry(sb.from('profiles').update({ streak:profile.streak, last_active:today }).eq('id', session.user.id));
}

/*
   XP начисляется по 2 очка за каждый верный ответ, а в тренировке их за
   сессию под сотню. Пишем в базу не на каждое очко, а пачкой: на экране
   счётчик обновляется сразу, запись уходит через паузу и принудительно
   в конце сессии и при уходе со страницы.
*/
let xpPending = 0, xpTimer = null;

async function addXp(amount){
  // первое занятие дня — серия продлевается здесь, а не при входе
  if(profile.last_active !== todayISO()) touchStreak();
  const before = profile.xp || 0;
  profile.xp = before + amount;
  // недельный счёт для рейтинга друзей: с понедельника — с нуля
  const wk = weekStartISO();
  if(profile.week_start !== wk){ profile.week_start = wk; profile.week_xp = 0; }
  profile.week_xp = (profile.week_xp || 0) + amount;
  xpPending += amount;
  renderHome(); renderProfile();
  rankUpCheck(before, profile.xp);
  clearTimeout(xpTimer);
  xpTimer = setTimeout(flushXp, 1500);
}

async function flushXp(){
  clearTimeout(xpTimer);
  if(!xpPending || !session) return;
  const pending = xpPending;
  xpPending = 0;
  const patch = { xp: profile.xp };
  if(dbCaps.social){ patch.week_xp = profile.week_xp || 0; patch.week_start = profile.week_start || weekStartISO(); }
  const { error } = await sbTry(sb.from('profiles').update(patch).eq('id', session.user.id));
  // не вышло — очки остаются в очереди и уедут со следующей попыткой
  if(error) xpPending = pending;
}
// понедельник текущей недели по местному времени
function weekStartISO(){
  const d = new Date();
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return localISO(d);
}

/*
   opts.silent — без тоста «Сохранено»: вызывающий код покажет свой,
   например с предложением пересобрать план под новые настройки.
*/
async function saveSettings(patch, opts){
  const langChanged = patch && patch.target_lang && patch.target_lang !== settings.target_lang;
  Object.assign(settings, patch);
  if(patch && patch.session_size != null) settings.session_size = clampSession(patch.session_size);
  if(langChanged){ deckAll = []; deckLoaded = false; }

  const row = Object.assign({ user_id: session.user.id }, settings);
  // без миграции колонки нет — отправка всего объекта роняла бы вообще
  // любое сохранение настроек, вплоть до смены языка
  if(!dbCaps.sessionSize) delete row.session_size;
  if(!dbCaps.goals){ delete row.goals; delete row.goal_note; delete row.target_level; }

  const { error } = await sbTry(sb.from('user_settings').upsert(row, { onConflict:'user_id' }));
  applyI18n();
  // кэш обновляем только после удачной записи: иначе он переживёт
  // перезагрузку и будет расходиться с базой. Когда колонки нет,
  // localStorage остаётся единственным хранилищем размера сессии.
  if(!error || !dbCaps.sessionSize){
    if(patch && patch.session_size != null) cacheSessionSize(settings.session_size);
  }
  if(!error && !(opts && opts.silent)) toast(t('saved'), 'good');
  return !error;
}

/*
   Ранги: 15 ступеней по 3 дивизиона. Механика одна, трек (классика,
   аниме, музыка) меняет только названия. Цвета ступеней — --r1…--r15:
   от спокойной глины к золоту, дальше — роза, аметист, лёд и серебро
   последней ступени (100 000 XP): рост читается без цифр.
   Дивизион — треть пути внутри ступени; у последней ступени путь
   считается до RANK_TOP, чтобы и там было куда расти.
*/
const RANK_XP  = [0,300,800,1600,2800,4500,7000,10500,15000,21000,30000,42000,57000,76000,100000];
const RANK_TOP = 130000;
const RANK_TRACKS = ['classic','anime','music'];
const ROMAN = ['I','II','III'];

function rankTrack(){
  const own = profile && profile.rank_track;
  if(RANK_TRACKS.indexOf(own) >= 0) return own;
  let local = '';
  try{ local = localStorage.getItem('worddeck_rank_track') || ''; }catch(e){}
  if(RANK_TRACKS.indexOf(local) >= 0) return local;
  const ints = settings.interests || [];
  return ints.indexOf('anime') >= 0 ? 'anime' : ints.indexOf('music') >= 0 ? 'music' : 'classic';
}
function rankNames(track){
  const list = String(t('rank_' + (track || rankTrack()))).split('|');
  while(list.length < RANK_XP.length) list.push(String(list.length + 1));
  return list;
}
function rankOf(xp){
  xp = Math.max(0, xp || 0);
  let i = 0; while(i < RANK_XP.length - 1 && xp >= RANK_XP[i + 1]) i++;
  const start = RANK_XP[i], end = i < RANK_XP.length - 1 ? RANK_XP[i + 1] : RANK_TOP;
  const span = Math.max(1, end - start);
  const into = Math.min(span, xp - start);
  const div = Math.min(2, Math.floor(into / (span / 3)));
  return { tier:i, div, start, end, xp, pct: Math.round(into / span * 100),
           divPct: Math.round((into - div * span / 3) / (span / 3) * 100), maxed: xp >= RANK_TOP };
}
// совместимость: name / next / pct ждут память тренера и старые вызовы
function rankInfo(){
  const r = rankOf(profile.xp || 0), names = rankNames();
  return Object.assign(r, { name: names[r.tier], next: r.tier < RANK_XP.length - 1 ? names[r.tier + 1] : null });
}
function rankColor(i){ return 'var(--r' + (Math.max(0, Math.min(RANK_XP.length - 1, i)) + 1) + ')'; }
function fmtNum(n){ return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

// эмблема ступени — щит цвета ступени с номером
function emblemSvg(tier, w, h){
  w = w || 40; h = h || 44;
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 48 52" aria-hidden="true" style="flex:none">' +
    '<path d="M24 3 42 9.5v15C42 37 34 45.5 24 49 14 45.5 6 37 6 24.5v-15Z" fill="' + rankColor(tier) + '"></path>' +
    '<path d="M24 9 36 13.5v11C36 33.5 30.5 39.5 24 42 17.5 39.5 12 33.5 12 24.5v-11Z" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"></path>' +
    '<text x="24" y="31" text-anchor="middle" font-size="14" font-weight="800" fill="#1C1814" font-family="-apple-system,system-ui,sans-serif">' + (tier + 1) + '</text></svg>';
}
function setRankRing(el, tier){
  if(!el) return;
  el.style.setProperty('--rc',  rankColor(tier));
  el.style.setProperty('--rc2', rankColor(tier + 1));
  el.style.setProperty('--rc3', rankColor(tier + 2));
}

const NAME_MAX = 12;

// имя, заданное пользователем, важнее выведенного из почты
function userName(){
  const own = String(profile && profile.display_name || '').trim();
  if(own) return own.slice(0, NAME_MAX);
  const e = session && session.user && session.user.email;
  if(!e) return 'friend';
  const n = e.split('@')[0].split(/[._\-+0-9]+/).filter(Boolean)[0] || e;
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function openNameSheet(){
  openSheet(t('profName'), box=>{
    const f = document.createElement('div');
    f.innerHTML =
      '<div class="field" style="margin-top:0"><label for="profNameInput">' + esc(t('profName')) + '</label>' +
      '<input class="inp" id="profNameInput" maxlength="' + NAME_MAX + '" autocomplete="off" ' +
        'placeholder="' + esc(t('profNamePh')) + '"></div>' +
      '<p class="dim" id="profNameMsg" style="margin:10px 0 0" role="status" aria-live="polite"></p>';
    box.appendChild(f);
    $('profNameInput').value = String(profile.display_name || '');
    $('profNameMsg').textContent = t('profNameHint');
    sheetButton(box, t('deckSave'), ()=>saveDisplayName());
  });
}

async function saveDisplayName(){
  const raw = $('profNameInput').value.trim().replace(/\s+/g, ' ');
  if(raw.length > NAME_MAX){
    const m = $('profNameMsg');
    m.textContent = t('nameTooLong'); m.className = 'dim bad';
    return;
  }
  // пусто — возвращаемся к имени из почты, а не пишем пустую строку:
  // check-ограничение в базе пустых имён не принимает
  const value = raw || null;
  if(!dbCaps.displayName){ toast(t('dbOutdated'), 'bad'); return; }
  const res = await sbTry(sb.from('profiles').update({ display_name: value }).eq('id', session.user.id));
  if(res.error) return;
  profile.display_name = value;
  closeSheet();
  renderHome(); renderProfile();
  toast(t('nameSaved'), 'good');
}

  $('homeHello').textContent = t('homeHello', { name: userName() });

  // герой: урок дня в цвете темы

  const hero = $('homeHero');
  if(!syllabus.length){
    $('homeHeroBadge').textContent = t('homeHeroBadge');

    hero.style.setProperty('--tint', 'var(--r5)');

    $('homeHeroTitle').textContent = cur ? cur.title : t('btnLesson');
    $('homeHeroSub').textContent   = t('homeHeroSub', { n: settings.minutes });

// био по умолчанию: язык, уровень и цель, интересы
function autoBio(){
  const parts = [];
  if(settings.target_lang) parts.push(langLabel(settings.target_lang) + ' · ' + settings.level + ' → ' + (settings.target_level || 'C1'));
  const ints = (settings.interests || []).map(id => INTEREST_LABEL[id]).filter(Boolean).slice(0, 3);
  if(ints.length) parts.push(ints.join(', '));
  return parts.join(' · ');
}

// цвет темы: одно и то же название всегда даёт один цвет
function tintOf(s){
  let h = 0; const str = String(s || '');
  for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return 'var(--r' + (3 + Math.abs(h) % 6) + ')';
}
function tintMix(c, p){ return 'color-mix(in oklch,' + c + ' ' + (p || 45) + '%,var(--surf))'; }
function poseSrc(p){ return 'assets/beaver-' + (POSES.indexOf(p) >= 0 ? p : 'wave') + '.png'; }
function avaHtml(pose, tint, size){
  return '<span class="ava" style="width:' + size + 'px;height:' + size + 'px;--tint:' + tintMix(tint || 'var(--r7)', 42) + '">' +
    '<img src="' + poseSrc(pose) + '" alt=""></span>';
}

let profTab = 'ach';

  $('profTabAch').classList.toggle('on', profTab === 'ach');

function renderProfTopics(done){
  const box = $('profTopics'); box.innerHTML = '';
  if(!done.length){
    const p = document.createElement('p'); p.className = 'dim'; p.style.margin = '14px 0 0';
    p.textContent = syllabus.length ? t('topicsNone') : t('pathEmpty');
    box.appendChild(p);
    return;
  }
  done.slice().reverse().forEach(n=>{
    const d = document.createElement('div');
    d.className = 'topicRow';
    d.innerHTML = '<span class="ava" style="width:36px;height:36px;--tint:' + tintMix(tintOf(n.title), 50) + ';align-items:center;color:var(--ink)">' + ICON.check('currentColor', 14, 3) + '</span><b></b><span></span>';
    d.querySelector('b').textContent = n.title;
    d.querySelector('span:last-child').textContent = n.level + (n.mastery ? ' · ' + n.mastery + '%' : '');
    box.appendChild(d);
  });
}

  cup:'<path d="M5 9h11v5a5 5 0 0 1-10 0z"></path><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M9 3.5v2.5M12.5 3.5v2.5"></path>',

  friends:'<circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19a5.5 5.5 0 0 1 11 0"></path><path d="M16 5.6a3 3 0 0 1 0 5.8M17.5 14a5 5 0 0 1 3 5"></path>',
  moon:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"></path>',
  audio:'<path d="M4.5 15v-2a7.5 7.5 0 0 1 15 0v2"></path><rect x="4" y="14" width="4" height="6" rx="1.5"></rect><rect x="16" y="14" width="4" height="6" rx="1.5"></rect>',
  doc:'<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z"></path><path d="M14 3.5V8h4M10 12h5M10 15.5h5"></path>',
  shield:'<path d="M12 3.5 19 6v6c0 4.5-3 7.5-7 8.5-4-1-7-4-7-8.5V6z"></path>',
  star:'<path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"></path>'
};
const ACH = [
  { id:'streak3',   ic:'flame',   c:'--r7', ok: s => s.best >= 3 },
  { id:'streak7',   ic:'flame',   c:'--r8', ok: s => s.best >= 7 },
  { id:'streak30',  ic:'flame',   c:'--r10',ok: s => s.best >= 30 },
  { id:'words100',  ic:'book',    c:'--r3', ok: () => deckTotal >= 100 },
  { id:'words500',  ic:'book',    c:'--r9', ok: () => deckTotal >= 500 },
  { id:'lesson1',   ic:'cup',     c:'--r7', ok: () => lessonsCount >= 1 },
  { id:'lessons10', ic:'cup',     c:'--r8', ok: () => lessonsCount >= 10 },
  { id:'lessons50', ic:'cup',     c:'--r10',ok: () => lessonsCount >= 50 },
  { id:'test',      ic:'target',  c:'--r5', ok: s => s.marks.test },
  { id:'friend',    ic:'friends', c:'--r6', ok: () => friendsAccepted().length >= 1 },
  { id:'night',     ic:'moon',    c:'--r4', ok: s => s.marks.night },
  { id:'audio50',   ic:'audio',   c:'--r9', ok: s => s.audio >= 50 },
  { id:'material',  ic:'doc',     c:'--r4', ok: () => materialsList.length >= 1 },
  { id:'level',     ic:'shield',  c:'--r8', ok: () => levelsDone().length >= 1 }
];
function achKey(){ return 'worddeck_ach_' + (session ? session.user.id : 'anon'); }
function achState(){
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(achKey()) || 'null'); }catch(e){}
  st = st || {};
  st.got = Array.isArray(st.got) ? st.got : [];
  st.marks = st.marks || {};
  st.best = Math.max(st.best || 0, profile.streak || 0);
  st.audio = st.audio || 0;
  (Array.isArray(profile.achievements) ? profile.achievements : []).forEach(id => { if(st.got.indexOf(id) < 0) st.got.push(id); });
  return st;
}
function saveAch(st){ try{ localStorage.setItem(achKey(), JSON.stringify(st)); }catch(e){} }
function achMark(name){
  const st = achState();
  if(name === 'audio') st.audio++; else st.marks[name] = true;
  saveAch(st);
}
function levelsDone(){
  const by = {};
  syllabus.forEach(n => { by[n.level] = by[n.level] || { all:0, done:0 }; by[n.level].all++; if(n.status === 'done') by[n.level].done++; });
  return Object.keys(by).filter(l => by[l].all && by[l].all === by[l].done);
}
function evalAchievements(){
  const st = achState();
  const fresh = ACH.filter(a => st.got.indexOf(a.id) < 0 && a.ok(st)).map(a => a.id);
  if(fresh.length){
    st.got = st.got.concat(fresh);
    // в базу — только объединение: открытое на другом устройстве не теряется
    if(dbCaps.social && session){
      profile.achievements = st.got.slice();
      sbTry(sb.from('profiles').update({ achievements: st.got }).eq('id', session.user.id), null, true);
    }
  }
  saveAch(st);
  return st;
}
function renderAchievements(){
  const st = evalAchievements();
  const box = $('profAch'); box.innerHTML = '';
  ACH.forEach(a=>{
    const got = st.got.indexOf(a.id) >= 0;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'medal' + (got ? '' : ' off');
    if(got) b.style.setProperty('--mc', 'var(' + a.c + ')');
    b.innerHTML = '<span class="dia"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
      + (got ? ACH_ICONS[a.ic] : '<rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>') + '</svg></span><span></span>';
    b.querySelector('span:last-child').textContent = t('ach_' + a.id);
    b.onclick = ()=> toast(t('ach_' + a.id) + (got ? '' : ' — ' + t('achLocked')), got ? 'good' : '');
    box.appendChild(b);
  });
}

/* ---- экран рангов ---- */
function setRankTrack(track){
  if(RANK_TRACKS.indexOf(track) < 0) return;
  try{ localStorage.setItem('worddeck_rank_track', track); }catch(e){}
  profile.rank_track = track;
  if(dbCaps.social && session) sbTry(sb.from('profiles').update({ rank_track: track }).eq('id', session.user.id), null, true);
  renderRanks(); renderProfile();
}
function renderRanks(){
  if(!session) return;
  const r = rankInfo(), names = rankNames(), track = rankTrack();
  const seg = $('trackSeg'); seg.innerHTML = '';
  RANK_TRACKS.forEach(k=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = k === track ? 'on' : '';
    b.textContent = t('track_' + k);
    b.onclick = ()=>setRankTrack(k);
    seg.appendChild(b);
  });
  $('ranksGlow').style.setProperty('--glow', 'color-mix(in oklch,' + rankColor(r.tier) + ' 42%,transparent)');
  const hero = $('rankHero');
  hero.style.setProperty('--tint', rankColor(r.tier));
  const bars = [0,1,2].map(i => '<span><i style="width:' + (i < r.div ? 100 : i === r.div ? r.divPct : 0) + '%"></i></span>').join('');
  hero.innerHTML = emblemSvg(r.tier, 104, 112) +
    '<div class="k"></div><div class="n"></div><div class="d"></div><div class="divBar">' + bars + '</div>' +
    '<div class="rankFoot"><span></span><span></span></div>';
  hero.querySelector('.k').textContent = t('rankYour', { n: r.tier + 1 });
  hero.querySelector('.n').textContent = r.name;
  hero.querySelector('.d').textContent = t('rankDiv', { d: ROMAN[r.div] });
  const foot = hero.querySelectorAll('.rankFoot span');
  foot[0].textContent = fmtNum(r.xp) + ' XP';
  foot[1].textContent = r.next ? r.next + ' · ' + fmtNum(r.end) : fmtNum(RANK_TOP);

// «Поделиться»: системное меню, а без него — копия в буфер
async function shareText(text){
  try{
    if(navigator.share){ await navigator.share({ text }); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(t('copied'), 'good'); }
  catch(e){ toast(text); }
}

function heartBtn(item, onDone){
  const b = document.createElement('button');

  b.innerHTML = ICON.heart(22) + (item.likes ? '<span>' + item.likes + '</span>' : '');

  b.setAttribute('aria-label', t('ariaLike'));
  b.onclick = e=>{ e.stopPropagation(); toggleLike(item, b, onDone); };
  return b;
}
async function toggleLike(item, btn, onDone){
  // сразу на экране, потом в базе; не вышло — откатываем
  item.liked = !item.liked;
  item.likes = Math.max(0, (item.likes || 0) + (item.liked ? 1 : -1));
  const paint = ()=>{
    if(!btn) return;
    btn.classList.toggle('on', !!item.liked);
    btn.innerHTML = ICON.heart(22) + (item.likes ? '<span>' + item.likes + '</span>' : '');
    btn.setAttribute('aria-pressed', item.liked ? 'true' : 'false');
    btn.classList.remove('pop'); void btn.offsetWidth; if(item.liked) btn.classList.add('pop');
  };
  paint();
  const r = await sbTry(sb.rpc('wd_like_toggle', { lesson: item.lesson_id }), 'errSave');
  if(r.error || !r.data){
    item.liked = !item.liked;
    item.likes = Math.max(0, (item.likes || 0) + (item.liked ? 1 : -1));
    paint();
    return;
  }
  item.liked = !!r.data.liked; item.likes = r.data.likes || 0;
  paint();
  if(onDone) onDone();
}

async function addFriendByCode(input){
  const code = String(input.value || '').trim().toUpperCase().replace(/\s+/g, '');
  if(!code){ input.focus(); return; }
  const r = await sbTry(sb.rpc('wd_friend_request', { code }), 'errSave');
  if(r.error) return;
  const key = { sent:'frSent', accepted:'frAccepted', notfound:'frNotFound', self:'frSelf', already:'frAlready' }[r.data] || 'frSent';
  toast(t(key), r.data === 'notfound' || r.data === 'self' ? 'bad' : 'good');
  if(r.data === 'sent' || r.data === 'accepted'){ input.value = ''; await loadSocial(); renderFriends(); }
}

/* =========================================================================
   Онбординг
   ========================================================================= */
let onbStep = 0, onbTarget = null, onbNative = null, onbLevel = 'A2', onbTime = 30;
let onbPicked = new Set();
let onbGoals = new Set(), onbTargetLevel = null;
const ONB_STEPS = 5;

function startOnboarding(){
  onbStep = 0;
  onbTarget = settings.target_lang;
  onbNative = settings.native_lang || ifaceLang;
  onbLevel  = settings.level || 'A2';
  onbTime   = settings.minutes || 30;
  onbPicked = new Set(settings.interests || []);
  onbGoals  = new Set(settings.goals || []);
  onbTargetLevel = settings.target_level || null;
  $('onbCustom').value = settings.custom_interest || '';
  $('onbGoalNote').value = settings.goal_note || '';
  renderOnb();
  show('s-onb');
}

function renderOnb(){
  $('onbMsg').textContent = '';
  const dots = $('onbDots'); dots.innerHTML = '';
  for(let i = 0; i < ONB_STEPS; i++){
    const d = document.createElement('i');
    if(i <= onbStep) d.className = 'on';
    dots.appendChild(d);
  }
  $('onbCount').textContent = (onbStep + 1) + '/' + ONB_STEPS;
  $('onbBackBtn').style.visibility = onbStep === 0 ? 'hidden' : 'visible';
  // в середине фразы названия языков пишутся со строчной там, где так принято
  let lang = onbTarget ? langLabel(onbTarget) : '';
  if(['ru','es','fr','it','pt','tr'].indexOf(ifaceLang) >= 0) lang = lang.charAt(0).toLocaleLowerCase(ifaceLang) + lang.slice(1);
  $('onbTitle').textContent = onbStep === 4 && lang ? t('onbT5lang', { lang }) : t('onbT' + (onbStep + 1));
  $('onbSub').textContent   = t('onbS' + (onbStep + 1));
  $('onbNextBtn').textContent = onbStep < ONB_STEPS - 1 ? t('onbNext') : t('onbStart');

  $('onbTargetGrid').classList.toggle('hidden', onbStep !== 0);
  $('onbNativeGrid').classList.toggle('hidden', onbStep !== 1);
  $('onbStepPace').classList.toggle('hidden', onbStep !== 2);
  $('onbStepInterests').classList.toggle('hidden', onbStep !== 3);
  $('onbStepGoals').classList.toggle('hidden', onbStep !== 4);

  if(onbStep === 0) buildLangGrid($('onbTargetGrid'), ()=>onbTarget, v=>{ onbTarget = v; renderOnb(); }, ()=>onbNative);
  if(onbStep === 1) buildLangGrid($('onbNativeGrid'), ()=>onbNative, v=>{ onbNative = v; renderOnb(); }, ()=>onbTarget);
  if(onbStep === 2) buildPaceStep();
  if(onbStep === 3) buildInterestsStep();
  if(onbStep === 4) buildGoalsStep();

  const sc = $('s-onb').querySelector('.scroll'); if(sc) sc.scrollTop = 0;
}

function buildLangGrid(grid, get, set, exclude){
  grid.innerHTML = '';
  LANGS.filter(l=>l.code !== exclude()).forEach(l=>{
    const b = document.createElement('button');
    b.className = 'pickCell' + (l.code === get() ? ' sel' : '');
    b.innerHTML = '<b>' + esc(langLabel(l.code)) + '</b><span>' + esc(l.name) + '</span>';
    b.onclick = ()=>set(l.code);
    grid.appendChild(b);
  });
}

function buildPaceStep(){
  const lv = $('onbLevels'); lv.innerHTML = '';
  LEVELS.forEach(x=>{
    const c = document.createElement('button');
    c.className = 'chip chipEq' + (x === onbLevel ? ' sel' : '');
    c.textContent = x;
    c.onclick = ()=>{ onbLevel = x; buildPaceStep(); };
    lv.appendChild(c);
  });
  const tm = $('onbTimes'); tm.innerHTML = '';
  TIMES.forEach(x=>{
    const c = document.createElement('button');
    c.className = 'chip chipEq' + (x === onbTime ? ' sel' : '');
    c.style.fontSize = '13px';
    c.textContent = x + ' ' + t('minutesShort');
    c.onclick = ()=>{ onbTime = x; buildPaceStep(); };
    tm.appendChild(c);
  });
}

function buildInterestsStep(){
  const box = $('onbInterests'); box.innerHTML = '';
  INTERESTS.forEach(it=>{
    const c = document.createElement('button');
    c.className = 'chip' + (onbPicked.has(it.id) ? ' sel' : '');
    c.textContent = INTEREST_LABEL[it.id];
    c.onclick = ()=>{ onbPicked.has(it.id) ? onbPicked.delete(it.id) : onbPicked.add(it.id); c.classList.toggle('sel'); };
    box.appendChild(c);
  });
}

/*
   Шаг «Цели»: из них тренер собирает учебный план. Целевой уровень — не
   ниже текущего, по умолчанию ступенью выше. Без миграции 06 цели некуда
   сохранить, но в промт первого плана они всё равно уйдут.
*/
function goalChips(box, picked){
  box.innerHTML = '';
  box.className = 'pickGrid';
  GOALS.forEach(g=>{
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'pickCell' + (picked.has(g.id) ? ' sel' : '');
    c.setAttribute('aria-pressed', picked.has(g.id) ? 'true' : 'false');
    c.innerHTML = '<i class="tick">' + ICON.check('#1A140C', 12, 3.4) + '</i><b></b><span></span>';
    c.querySelector('b').textContent = t('goal_' + g.id);
    c.querySelector('span').textContent = t('goalHint_' + g.id);
    c.onclick = ()=>{
      picked.has(g.id) ? picked.delete(g.id) : picked.add(g.id);
      c.classList.toggle('sel', picked.has(g.id));
      c.setAttribute('aria-pressed', picked.has(g.id) ? 'true' : 'false');
    };
    box.appendChild(c);
  });
}
function targetLevelChips(box, level, get, set){
  box.innerHTML = '';
  // все целевые уровни видны, но ниже текущего выбрать нельзя
  const allowed = targetLevelOptions(level);
  TARGET_LEVELS.forEach(x=>{
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip chipEq' + (x === get() ? ' sel' : '');
    c.textContent = x;
    c.disabled = allowed.indexOf(x) < 0;
    c.onclick = ()=>{ set(x); targetLevelChips(box, level, get, set); };
    box.appendChild(c);
  });
}
/*
   Честная оценка срока: примерные часы на ступень CEFR при выбранном
   ритме. Цифры грубые, но порядок верный — человек сразу видит,
   что C1 за месяц при десяти минутах в день не случится.
*/
const CEFR_HOURS = { A1:90, A2:120, B1:180, B2:220, C1:280 };
function monthsTo(from, to, minutes){
  let h = 0;
  for(let i = levelRank(from); i < levelRank(to); i++) h += CEFR_HOURS[LEVELS[i]] || 200;
  if(!h) return 0;
  return Math.max(1, Math.round(h * 60 / Math.max(5, minutes) / 30));
}

function buildGoalsStep(){
  goalChips($('onbGoals'), onbGoals);
  if(targetLevelOptions(onbLevel).indexOf(onbTargetLevel) < 0) onbTargetLevel = defaultTargetLevel(onbLevel);
  const paint = ()=>{
    $('onbSummary').innerHTML = t('onbSummary', {
      target: esc(langLabel(onbTarget || 'en')),
      native: esc(langLabel(onbNative || 'ru')),
      level: onbLevel + ' → ' + onbTargetLevel, min: onbTime
    });
    const m = monthsTo(onbLevel, onbTargetLevel, onbTime);
    $('onbEstimate').textContent = m ? t('onbEstimate', { n: m, min: onbTime }) : '';
  };
  targetLevelChips($('onbTargetLevels'), onbLevel, ()=>onbTargetLevel, v=>{ onbTargetLevel = v; paint(); });
  paint();
}

function onbBack(){ if(onbStep > 0){ onbStep--; renderOnb(); } }

async function onbNext(){
  if(onbStep === 0 && !onbTarget){ $('onbMsg').textContent = t('onbNeedLangs'); $('onbMsg').className = 'dim bad'; return; }
  if(onbStep === 1 && !onbNative){ $('onbMsg').textContent = t('onbNeedLangs'); $('onbMsg').className = 'dim bad'; return; }
  if(onbStep < ONB_STEPS - 1){ onbStep++; renderOnb(); return; }

  const btn = $('onbNextBtn');
  btn.disabled = true;
  await saveSettings({
    target_lang:onbTarget, native_lang:onbNative, level:onbLevel, minutes:onbTime,
    interests:Array.from(onbPicked), custom_interest:$('onbCustom').value.trim(),
    goals:Array.from(onbGoals), goal_note:$('onbGoalNote').value.trim().slice(0, 200),
    target_level:onbTargetLevel
  });
  btn.disabled = false;
  chatHistory = [];
  await enterApp();
}

/* =========================================================================

   ========================================================================= */
/*
   Режим разработчика. Технические подробности — какая модель, какой
   статус, что именно ответил API — нужны при отладке, а человеку это шум:
   «HTTP 429 RESOURCE_EXHAUSTED» ничего ему не объясняет. Поэтому
   подробности всегда уходят в консоль, а на экран — только при ?debug=1.
   Режим запоминается и выключается параметром ?debug=0.
*/
// метка сборки — по ней в консоли видно, какая версия файла реально открыта
const APP_BUILD = '2026-10-18c WordDeck 2.0';
console.info('[worddeck] build', APP_BUILD);

let DEBUG = false;
(function initDebug(){
  try{
    const q = new URLSearchParams(location.search).get('debug');
    if(q === '1') localStorage.setItem('worddeck_debug', '1');
    if(q === '0') localStorage.removeItem('worddeck_debug');
    DEBUG = localStorage.getItem('worddeck_debug') === '1';
  }catch(e){}
})();

function dlog(){
  const args = Array.prototype.slice.call(arguments);
  // у ошибок ИИ главное — статус и текст ответа API, а не стек
  console.log.apply(console, ['[worddeck]'].concat(args.map(a =>
    (a instanceof Error && a.code) ? a.code + ' · HTTP ' + (a.status || '—') + ' · ' + (a.detail || a.message) : a)));
  if(!DEBUG) return;
  const line = args.map(a=>{
    if(typeof a === 'string') return a;
    if(a && a.message) return (a.code && a.code !== a.message ? a.code + ' ' : '') + a.message + (a.detail ? ' · ' + a.detail : '');
    try{ return JSON.stringify(a); }catch(e){ return String(a); }
  }).join(' ');
  ['log','log2'].forEach(id=>{
    const el = $(id); if(!el) return;
    el.style.display = 'block';
    const d = document.createElement('div');
    d.textContent = line;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  });
}
function clearLog(){ const el = $('log'); if(el){ el.innerHTML = ''; el.style.display = 'none'; } }

/*
   Ключ из буфера обмена часто приезжает с мусором: пробелы и переносы,
   кавычки, невидимые символы из мессенджеров. В заголовок запроса такой
   ключ не пройдёт, а Google не узнает его. В настоящем ключе бывают
   только латинские буквы, цифры, точка, «_» и «-» — всё прочее убираем.
*/
function cleanKey(k){ return String(k || '').replace(/[^A-Za-z0-9._-]/g, ''); }
function getKey(){
  const a = $('apikey') ? cleanKey($('apikey').value) : '';
  const b = $('apikey2') ? cleanKey($('apikey2').value) : '';
  let saved = '';
  try{ saved = cleanKey(localStorage.getItem('worddeck_key')); }catch(e){}
  return a || b || saved || cleanKey(SAVED_KEY);
}
function saveKeyLocally(k){ try{ localStorage.setItem('worddeck_key', cleanKey(k)); }catch(e){} }

/*
   Номер версии из имени модели. Раньше разбирался только формат
   «gemini-2.5-flash»: если версия стоит после слова flash или модель
   названа иначе, выходил ноль — и такая модель уезжала в конец списка
   при автоподборе, хотя она новее всех. Поэтому сначала пробуем
   привычный формат, потом ищем число где угодно в имени, отбрасывая
   явно не-версии вроде даты в «gemini-exp-1206».
*/
function versionOf(name){
  const s = String(name);
  const m = s.match(/gemini[-_ ]?(\d+(?:\.\d+)?)/i);
  if(m) return parseFloat(m[1]);
  const nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(parseFloat).filter(n => n > 0 && n <= 10);
  return nums.length ? Math.max.apply(null, nums) : 0;
}

/* =========================================================================
   AI-слой

   Единственная точка вызова модели — aiRun(). Всё, что зависит от
   конкретного сервиса (адреса, формат тела, разбор потока), живёт в объекте
   провайдера AI_PROVIDERS.<id>. Вызывающий код — тренер, генератор, путь,
   материалы — не знает, какая модель и какой сервис ему ответили: второй
   провайдер добавляется одним объектом, без правок остального приложения.

   Ошибки внутри слоя — объекты с полями code и status, без текста для
   людей. Что показать человеку, решает friendlyError() через i18n.
   ========================================================================= */
function aiError(code, status, detail){
  const e = new Error(code);
  e.code = code;
  e.status = status || 0;
  e.detail = String(detail || '');
  return e;
}

// статус ответа и его текст → код ошибки
function classifyAi(status, msg){
  const m = String(msg || '');
  if(/api.?key|API_KEY_INVALID|ACCESS_TOKEN_TYPE_UNSUPPORTED|UNAUTHENTICATED|authentication credential/i.test(m)
     || status === 401 || status === 403) return 'key';
  /*
     Gemini API работает не во всех странах. Ответ — 400 с текстом «User
     location is not supported»; раньше он попадал в «модели нет» (из-за
     «is not supported»), модели уходили в суточную паузу, а человек видел
     «что-то пошло не так». Ключ при этом исправен — дело в IP-адресе.
  */
  if(/location is not supported|not available in your (country|region)|unsupported_country/i.test(m)) return 'region';
  if(status === 429 || /quota|RESOURCE_EXHAUSTED|rate.?limit/i.test(m)) return 'quota';
  if(status === 503 || /overloaded|UNAVAILABLE/i.test(m)) return 'busy';
  if(/SAFETY|blocked|PROHIBITED_CONTENT|BLOCKLIST/i.test(m)) return 'blocked';
  if(status === 404 || /not found|is not supported|NOT_FOUND/i.test(m)) return 'notfound';
  if(status >= 500) return 'busy';
  return 'http';
}

// fetch без сети бросает TypeError, и в каждом браузере со своим текстом
function isNetworkError(e){
  return !!e && e.name === 'TypeError' && /fetch|network|load failed/i.test(String(e.message || ''));
}

// ошибка → ключ i18n с понятным текстом
function friendlyError(err){
  const c = err && err.code;
  if(c === 'key')     return 'errKeyInvalid';
  if(c === 'quota')   return 'errQuota';
  if(c === 'busy')    return 'errModelBusy';
  if(c === 'blocked') return 'errBlocked';
  if(c === 'timeout') return 'errTimeout';
  if(c === 'region')  return 'errRegion';
  if(c === 'network' || isNetworkError(err)) return 'errNetwork';
  return 'errGeneric';
}

/*
   Что известно о моделях.
   modelMeta — из списка моделей API: лимиты токенов, умеет ли «думать».
   modelCaps — выяснено на опыте: noSystem (не принимает systemInstruction,
   так ведут себя gemma), noThinking и noGc (не принимает часть
   generationConfig). Всё это лежит в кэше worddeck_models, чтобы
   не тратить пробный запрос на каждом запуске.
*/
let modelMeta = {};
let modelCaps = {};

function readModelCache(){
  try{ return JSON.parse(localStorage.getItem('worddeck_models') || 'null'); }catch(e){ return null; }
}
function saveModelCache(names){
  const prev = readModelCache() || {};
  const c = {
    at: names ? Date.now() : (prev.at || 0),
    provider: aiProviderId,
    list: names || prev.list || [],
    meta: names ? modelMeta : (prev.meta || {}),
    caps: modelCaps,
    tts: names ? ttsCandidates : (prev.tts || [])
  };
  try{ localStorage.setItem('worddeck_models', JSON.stringify(c)); }catch(e){}
}

/*
   «Размышления» у свежих flash-моделей включены по умолчанию: модель
   сначала думает про себя, и только потом появляется первый символ. На
   «как произносится cat?» это добавляет секунды на пустом месте — тренеру
   они не нужны, он объясняет, а не решает олимпиадные задачи.
   Если API сам сказал, что модель не думает, параметр не шлём вовсе;
   если не сказал — решаем по имени, а на отказ есть откат в geminiSend.
*/
function thinkingOff(model){
  const meta = modelMeta[model];
  if(meta && meta.thinking === false) return null;
  if(!/flash/i.test(model)) return null;
  const v = versionOf(model);
  return (v === 0 || v >= 2.5) ? { thinkingConfig: { thinkingBudget: 0 } } : null;
}

const GEMINI_API = 'https://generativelanguage.googleapis.com/v1beta/models';

/*
   Тело запроса. system уходит отдельным полем systemInstruction — так
   правила тренера попадают в КАЖДЫЙ запрос, а не только в первый: раньше
   промт жил в первой реплике истории и вылетал вместе с ней, когда
   история упиралась в лимит.
   inline — для моделей без systemInstruction: правила идут в начало
   первого сообщения пользователя (не отдельной репликой — две подряд
   реплики пользователя API тоже не принимает).
*/
function geminiBody(contents, system, gc, inline){
  let c = contents;
  if(system && inline){
    c = contents.slice();
    if(c.length && c[0].role === 'user'){
      c[0] = { role:'user', parts:[{ text: system + '\n\n---\n\n' + c[0].parts[0].text }] };
    }else{
      c.unshift({ role:'user', parts:[{ text: system }] });
    }
  }
  const body = { contents: c };
  if(system && !inline) body.systemInstruction = { parts:[{ text: system }] };
  if(gc && Object.keys(gc).length) body.generationConfig = gc;
  return JSON.stringify(body);
}

/*
   Отправка с лестницей отката. На 400 модель обычно говорит, чего именно
   не умеет: «Developer instruction is not enabled», «JSON mode is not
   enabled», «thinking is not supported». Уступаем по одному шагу:
   сначала системная инструкция переезжает в текст, потом снимаются
   «размышления», потом весь generationConfig. Неверный ключ — тоже 400,
   его лестница не лечит, поэтому он возвращается сразу. Что сработало,
   запоминается в modelCaps.
*/
/*
   Ключ — только в заголовке x-goog-api-key, не в адресе. Новые ключи
   AI Studio начинаются с «AQ.» и в параметре ?key= не принимаются вовсе:
   Google отвечает ошибкой, будто модели нет. Старые «AIza…» в заголовке
   работают так же. Заодно ключ не оседает в журналах и истории запросов.
*/
function geminiHeaders(key){ return { 'x-goog-api-key': String(key || '') }; }

async function geminiSend(url, o, signal){
  const caps = modelCaps[o.model] || {};
  const base = Object.assign({}, o.gc || {});
  const think = caps.noThinking ? null : thinkingOff(o.model);
  const gcVariants = [];
  if(!caps.noGc){
    if(think) gcVariants.push(Object.assign({}, base, think));
    if(Object.keys(base).length) gcVariants.push(base);
  }
  gcVariants.push(null);

  let inline = !!(o.system && caps.noSystem);
  let gi = 0;
  const startInline = inline;
  let r = null;
  for(let step = 0; step < 4; step++){
    r = await fetch(url, {
      method:'POST', headers: Object.assign({ 'Content-Type':'application/json' }, geminiHeaders(o.key)),
      body: geminiBody(o.contents, o.system, gcVariants[gi], inline), signal
    });
    if(r.status !== 400) break;
    let msg = '';
    try{ const j = await r.clone().json(); msg = (j.error && j.error.message) || ''; }catch(e){}
    const kind = classifyAi(400, msg);
    if(kind === 'key' || kind === 'region') break;   // другие настройки запроса тут не помогут
    dlog('ai: 400 от', o.model, '—', msg);
    if(o.system && !inline && /instruction|system/i.test(msg)){ inline = true; continue; }
    if(gi < gcVariants.length - 1){ gi++; continue; }
    if(o.system && !inline){ inline = true; continue; }
    break;
  }
  if(r && r.ok){
    let changed = false;
    if(inline && !startInline){ caps.noSystem = true; changed = true; }
    if(gi > 0){
      const used = gcVariants[gi];
      if(used === null && Object.keys(base).length){ caps.noGc = true; changed = true; }
      else if(think){ caps.noThinking = true; changed = true; }
    }
    if(changed){ modelCaps[o.model] = caps; saveModelCache(); }
  }
  return r;
}

async function geminiHttpError(r){
  let msg = '';
  try{ const j = await r.json(); msg = (j.error && (j.error.message || j.error.status)) || ''; }catch(e){}
  return aiError(classifyAi(r.status, msg), r.status, msg);
}

// текст ответа без «мыслей»; пустой ответ из-за фильтров — отдельная ошибка
function geminiText(data){
  if(data && data.promptFeedback && data.promptFeedback.blockReason)
    throw aiError('blocked', 200, data.promptFeedback.blockReason);
  const cand = data && data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || [])
    .filter(p => !p.thought).map(p => p.text || '').join('');
  if(!text && cand && /SAFETY|PROHIBITED|BLOCKLIST|RECITATION/.test(cand.finishReason || ''))
    throw aiError('blocked', 200, cand.finishReason);
  return text;
}

/*
   Сторож зависания. Мобильная сеть умеет принять запрос и замолчать
   навсегда: соединение открыто, данных нет, промис не разрешается никогда.
   Снаружи это выглядит как «отправил и тренер не отвечает». Считаем
   не общее время (урок печатается долго, это нормально), а паузу между
   кусками: молчание дольше STREAM_STALL_MS обрывает запрос.
*/
const STREAM_STALL_MS = 45000;

async function readStream(r, onChunk, bump){
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '', full = '';
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    bump();
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for(const line of lines){
      const s = line.trim();
      if(!s.startsWith('data:')) continue;
      const js = s.slice(5).trim();
      if(!js || js === '[DONE]') continue;
      let d = null;
      try{ d = JSON.parse(js); }catch(e){ continue; }
      if(d.error) throw aiError(classifyAi(d.error.code || 0, d.error.message), d.error.code || 0, d.error.message);
      const txt = geminiText(d);
      if(txt){ full += txt; onChunk(full); }
    }
  }
  return full;
}

const AI_PROVIDERS = {
  gemini: {
    // все модели ключа, которые умеют generateContent, с метаданными
    async listModels(key){
      let r;
      try{ r = await fetch(GEMINI_API + '?pageSize=1000', { headers: geminiHeaders(key) }); }
      catch(e){ throw aiError('network', 0, e.message); }
      let data = null;
      try{ data = await r.json(); }catch(e){}
      if(!r.ok || !data || data.error){
        const msg = (data && data.error && data.error.message) || '';
        throw aiError(classifyAi(r.status, msg), r.status, msg);
      }
      return (data.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => ({
          name: m.name.replace(/^models\//, ''),
          meta: {
            displayName: m.displayName || '',
            inputTokenLimit: m.inputTokenLimit || 0,
            outputTokenLimit: m.outputTokenLimit || 0,
            thinking: typeof m.thinking === 'boolean' ? m.thinking : undefined
          }
        }));
    },

    async generate(o){
      const url = GEMINI_API + '/' + o.model + ':generateContent';
      let r;
      try{ r = await geminiSend(url, o); }
      catch(e){ throw isNetworkError(e) ? aiError('network', 0, e.message) : e; }
      if(!r.ok) throw await geminiHttpError(r);
      let data = null;
      try{ data = await r.json(); }catch(e){ throw aiError('http', r.status, 'bad json'); }
      return geminiText(data);
    },

    async stream(o){
      const url = GEMINI_API + '/' + o.model + ':streamGenerateContent?alt=sse';
      const ctl = new AbortController();
      let stalled = false, timer = null;
      const bump = ()=>{
        clearTimeout(timer);
        timer = setTimeout(()=>{ stalled = true; try{ ctl.abort(); }catch(e){} }, STREAM_STALL_MS);
      };
      try{
        bump();
        const r = await geminiSend(url, o, ctl.signal);
        bump();
        if(!r.ok) throw await geminiHttpError(r);
        // старый WebView без ReadableStream — откатываемся на обычный вызов
        if(!r.body || !r.body.getReader){ clearTimeout(timer); return AI_PROVIDERS.gemini.generate(o); }
        return await readStream(r, o.onChunk, bump);
      }catch(e){
        if(stalled || (e && e.name === 'AbortError')) throw aiError('timeout');
        if(isNetworkError(e)) throw aiError('network', 0, e.message);
        throw e;
      }finally{ clearTimeout(timer); }
    }
  }
};

// текущий провайдер; выбора в интерфейсе пока нет — задел на будущее
let aiProviderId = 'gemini';
try{ aiProviderId = localStorage.getItem('worddeck_provider') || 'gemini'; }catch(e){}
if(!AI_PROVIDERS[aiProviderId]) aiProviderId = 'gemini';
function aiProvider(){ return AI_PROVIDERS[aiProviderId]; }

(function loadModelCache(){
  const c = readModelCache();
  if(c){ modelMeta = c.meta || {}; modelCaps = c.caps || {}; }
})();

/*
   Ранжирование для автоподбора.
   1. Алиасы вида *-flash-latest: сами переезжают на новые модели, поэтому
      свежая модель подхватывается без правок кода.
   2. Версия по убыванию.
   3. Внутри версии: стабильная → preview → exp.
   4. Дальше прежние правила: flash, lite, короткое имя.
*/
function stabilityOf(n){ return /exp|experimental/i.test(n) ? 2 : (/preview/i.test(n) ? 1 : 0); }
function modelSort(a, b){
  const xa = /flash.*latest$/i.test(a) ? 0 : 1, xb = /flash.*latest$/i.test(b) ? 0 : 1;
  if(xa !== xb) return xa - xb;
  const va = versionOf(a), vb = versionOf(b);
  if(vb !== va) return vb - va;
  const sa = stabilityOf(a), sb2 = stabilityOf(b);
  if(sa !== sb2) return sa - sb2;
  const fa = /flash/i.test(a) ? 0 : 1, fb = /flash/i.test(b) ? 0 : 1;
  if(fa !== fb) return fa - fb;
  const la = /lite/i.test(a) ? 0 : 1, lb = /lite/i.test(b) ? 0 : 1;
  if(la !== lb) return la - lb;
  return a.length - b.length;
}

async function listModels(key){
  const all = await aiProvider().listModels(key);
  /*
     Голосовые модели нужны отдельно — для живого голоса тренера. Имена
     не вписываем в код: Google их часто меняет, берём то, что дал ключ.
     Из текстового списка они по-прежнему отсекаются фильтром ниже.
  */
  ttsCandidates = all.filter(m => /tts/i.test(m.name)).map(m => m.name).sort(modelSort);
  const usable = all
    .filter(m => !/embedding|image|imagen|tts|audio|veo|vision|native-audio|live/i.test(m.name))
    /*
       Отсеиваем не-разговорные сборки: модели под программирование
       и агентские (antigravity, coder, computer-use). По версии такая
       оказывалась самой новой и вставала первой — тренер начинал
       отвечать как помощник программиста.
    */
    .filter(m => !/antigravity|coder|codegemma|code-|computer-use|robotics/i.test(m.name));
  const names = usable.map(m => m.name).sort(modelSort);
  if(!names.length) throw aiError('nomodel');
  modelMeta = {};
  usable.forEach(m => { modelMeta[m.name] = m.meta; });
  saveModelCache(names);
  return names;
}

// список нужен, а загрузки ещё не было: берём кэш, иначе спрашиваем API
async function ensureModels(key){
  if(candidates.length) return;
  const c = readModelCache();
  if(c && Array.isArray(c.list) && c.list.length){ candidates = c.list.slice(); ttsCandidates = c.tts || []; }
  else candidates = await listModels(key);
  workingModel = pickModel();
}

/*
   Здоровье моделей. Модель, упёршаяся в лимит или перегруженная, на время
   выпадает из очереди: следующий запрос сразу идёт на другую, а не тратит
   попытку на заведомо занятую. Сроки — по смыслу ошибки:
   429 — пять минут, 503 — минута, «модели нет» — сутки.
*/
const MODEL_COOLDOWN = { quota: 5 * 60e3, busy: 60e3, notfound: 24 * 3600e3 };
const AI_MAX_TRIES = 3;

let modelHealth = {};
try{ modelHealth = JSON.parse(localStorage.getItem('worddeck_model_health') || '{}') || {}; }catch(e){ modelHealth = {}; }
function saveModelHealth(){ try{ localStorage.setItem('worddeck_model_health', JSON.stringify(modelHealth)); }catch(e){} }
function inCooldown(m){ return (modelHealth[m] || 0) > Date.now(); }

function noteModelFail(model, err){
  const ms = MODEL_COOLDOWN[err.code];
  if(!ms) return;
  modelHealth[model] = Date.now() + ms;
  saveModelHealth();
  // модели больше нет — список устарел, обновляем его в фоне
  if(err.code === 'notfound'){
    const k = getKey();
    if(k) listModels(k).then(l=>{ candidates = l; workingModel = pickModel(); })
                       .catch(e=>dlog('models refresh:', e));
  }
}

function noteModelOk(model){
  workingModel = model;
  if(modelHealth[model]){ delete modelHealth[model]; saveModelHealth(); }
  try{ localStorage.setItem('worddeck_model_last', model); }catch(e){}
}

/*
   Порядок попыток: выбор человека, потом последняя удачная модель, потом
   общий список. Модели в кулдауне пропускаются; если в кулдауне все —
   одна попытка лучшей из них, лучше так, чем отказать без запроса.
   Выбор человека сильнее автоподбора: если выбранная модель на паузе,
   временно отвечает другая, и человек об этом узнаёт одним тостом.
*/
let fallbackToastFor = '';
function modelOrder(){
  const list = [];
  const add = m=>{ if(m && list.indexOf(m) < 0 && candidates.indexOf(m) >= 0) list.push(m); };
  add(userModel);
  let last = '';
  try{ last = localStorage.getItem('worddeck_model_last') || ''; }catch(e){}
  add(last);
  candidates.forEach(add);
  const healthy = list.filter(m => !inCooldown(m));
  if(userModel && list[0] === userModel && inCooldown(userModel) && healthy.length){
    const mark = userModel + ':' + modelHealth[userModel];
    if(fallbackToastFor !== mark){
      fallbackToastFor = mark;
      toast(t('modelFallback', { model:userModel }), 'bad');
    }
  }
  return healthy.length ? healthy : list.slice(0, 1);
}

/*
   Что уходит в модель из прошлой переписки.

   Граница считается по репликам пользователя: последние KEEP_USER_TURNS
   его сообщений и всё, что тренер отвечал между ними. Так «помнит
   последние десять сообщений» выполняется буквально, независимо от длины
   уроков. Системный промт в истории больше не живёт — он уходит отдельным
   полем в каждом запросе, поэтому особого статуса у первой реплики нет.
   MAX_CONTEXT_CHARS страхует от истории, распухшей сверх всякой меры.
*/
const KEEP_USER_TURNS   = 10;
const MAX_CONTEXT_CHARS = 60000;

function trimHistory(history){
  const list = (history || []).filter(h => h && h.text);
  let seen = 0, from = 0;
  for(let i = list.length - 1; i >= 0; i--){
    if(list[i].role !== 'user') continue;
    seen++;
    if(seen >= KEEP_USER_TURNS){ from = i; break; }
  }
  const win = list.slice(from);
  let total = win.reduce((s,h)=>s + String(h.text).length, 0);
  while(win.length > 2 && total > MAX_CONTEXT_CHARS) total -= String(win.shift().text).length;
  return win;
}

/*
   История приходит из localStorage и с сервера — то есть из источника,
   который писало другое устройство. Кривой список API отвергает с 400,
   ничего не объясняя, поэтому чистим сами: роли только user и model,
   пустые реплики долой, первой идёт user, роли чередуются.
*/
function buildContents(history, prompt){
  const contents = [];
  trimHistory(history).forEach(h=>{
    const role = (h.role === 'model') ? 'model' : (h.role === 'user' ? 'user' : null);
    const text = String(h.text == null ? '' : h.text);
    if(!role || !text.trim()) return;
    if(!contents.length && role !== 'user') return;
    const prev = contents[contents.length - 1];
    if(prev && prev.role === role){ prev.parts[0].text += '\n\n' + text; return; }
    contents.push({ role, parts:[{ text }] });
  });
  if(contents.length && contents[contents.length - 1].role === 'user') contents.pop();
  contents.push({ role:'user', parts:[{ text: String(prompt || '') }] });
  return contents;
}

/*
   aiRun({ system, history, prompt, json, temperature, onChunk }) → текст.

   json:true включает responseMimeType = application/json; если модель
   режима не знает, geminiSend снимет его, а parseJsonSlice() и repairJson()
   остаются страховкой на разбор. Не больше AI_MAX_TRIES попыток: раньше
   отказ одной модели мог потянуть за собой восемь запросов подряд.
*/
async function aiRun(opts){
  const o = opts || {};
  const key = getKey();
  if(!key) throw aiError('key', 0, 'no key');
  await ensureModels(key);
  const prov = aiProvider();
  const contents = buildContents(o.history, o.prompt);
  const gc = {};
  if(o.temperature != null) gc.temperature = o.temperature;
  if(o.json) gc.responseMimeType = 'application/json';

  const order = modelOrder();
  if(!order.length) throw aiError('nomodel');
  let lastErr = null;
  for(const model of order.slice(0, AI_MAX_TRIES)){
    const call = { key, model, contents, system: o.system || '', gc, onChunk: o.onChunk };
    try{
      const text = o.onChunk ? await prov.stream(call) : await prov.generate(call);
      if(!String(text || '').trim()) throw aiError('empty');
      noteModelOk(model);
      return text;
    }catch(e){
      const err = (e && e.code) ? e
        : (isNetworkError(e) ? aiError('network', 0, e.message) : aiError('http', 0, e && e.message));
      lastErr = err;
      dlog('ai:', model, err.code, err.status || '', err.detail || '');
      noteModelFail(model, err);
      // другая модель тут не поможет: ключ тот же, сеть та же, текст тот же
      if(err.code === 'key' || err.code === 'network' || err.code === 'blocked'
         || err.code === 'timeout' || err.code === 'region') break;
    }
  }
  throw lastErr || aiError('nomodel');
}

/* ---- чат: хранение между сессиями ---- */
let chatLog = [];
/* -------------------------------------------------------------------------
   Переписка с тренером: локальный кэш плюс сервер.

   Прогресс (XP, путь, история уроков) всегда лежал в Supabase, а сам
   разговор — только в localStorage. Из-за этого урок, пройденный на
   телефоне, на компьютере выглядел как пустой чат: тренер здоровался
   заново, хотя его память о прогрессе была на месте.

   localStorage остаётся: он рисует переписку мгновенно, до ответа сети,
   и держит её, когда сети нет. Сервер — источник истины; спор устройств
   решает updated_at, побеждает то, где писали позже.
   ------------------------------------------------------------------------- */
/*
   Сколько реплик хранится. Держим с запасом относительно
   KEEP_USER_TURNS: десять сообщений пользователя — это десять пар
   «вопрос-ответ» плюс служебные вставки, и на тридцати записях
   десятая реплика уже выпадала из хранилища раньше, чем из контекста.
*/
const HISTORY_KEEP = 60;

function chatKey(){ return 'worddeck_chat_' + (session ? session.user.id : 'anon') + '_' + settings.target_lang; }

let chatSaveTimer = null;
let chatDirty = false;
/*
   Знаем ли мы, что лежит на сервере для текущей пары «пользователь + язык».
   Пока не знаем — писать туда нельзя: при обрыве сети на чтении устройство
   считало переписку пустой, здоровалось заново и затирало этим приветствием
   настоящий разговор, уже пройденный на другом устройстве.
*/
let chatSynced = false;

function saveChat(){
  const payload = { h:chatHistory.slice(-HISTORY_KEEP), l:chatLog.slice(-120), t:Date.now() };
  try{ localStorage.setItem(chatKey(), JSON.stringify(payload)); }catch(e){}
  // на сервер — пачкой: за урок реплик десятки, и слать их по одной
  // значит слать десятки запросов подряд
  chatDirty = true;
  clearTimeout(chatSaveTimer);
  chatSaveTimer = setTimeout(flushChat, 1200);
}

async function flushChat(){
  clearTimeout(chatSaveTimer);
  if(!chatDirty || !session || !settings.target_lang || !dbCaps.chatSync) return;
  // серверное состояние не прочитано — молчим, иначе перезапишем вслепую.
  // Реплики остаются в localStorage и уедут после удачной синхронизации.
  if(!chatSynced) return;
  chatDirty = false;
  const res = await sbTry(sb.from('chat_state').upsert({
    user_id: session.user.id,
    target_lang: settings.target_lang,
    log: chatLog.slice(-120),
    history: chatHistory.slice(-HISTORY_KEEP),
    updated_at: new Date().toISOString()
  }, { onConflict:'user_id,target_lang' }));
  // не вышло — вернём флаг, уедет со следующей репликой
  if(res.error) chatDirty = true;
}

function renderChat(){
  const box = $('chatBox'); box.innerHTML = '';
  chatSepDay = '';
  chatLog.forEach(m=>appendMsg(m.role, m.text, true, null, m.at || null));
  box.scrollTop = box.scrollHeight;
}

/*
   Старые истории. До выноса системного промта в systemInstruction он
   жил прямо в первой реплике пользователя: «правила + \n\n---\n\n + вопрос».
   Такую реплику приводим к самому вопросу (то, что после последнего
   разделителя); если вопроса нет — реплику убираем. Иначе правила ушли
   бы в модель дважды, а после обрезки истории — устаревшей копией.
*/
const LEGACY_PROMPT_HEAD = 'You are a personal language tutor';
function cleanLegacyHistory(list){
  if(!Array.isArray(list)) return [];
  const out = [];
  list.forEach(h=>{
    if(!h) return;
    let text = String(h.text == null ? '' : h.text);
    if(h.role === 'user' && text.indexOf(LEGACY_PROMPT_HEAD) === 0){
      const i = text.lastIndexOf('\n\n---\n\n');
      text = i >= 0 ? text.slice(i + 7).trim() : '';
      if(!text) return;
    }
    out.push({ role: h.role, text });
  });
  return out;
}

// локальный кэш: рисуем сразу, не дожидаясь сети
function restoreChat(){
  try{
    const raw = localStorage.getItem(chatKey());
    if(!raw) return false;
    const d = JSON.parse(raw);
    chatHistory = cleanLegacyHistory(d.h); chatLog = d.l || [];
    renderChat();
    return chatLog.length > 0;
  }catch(e){ return false; }
}

/*
   Перечитать переписку под текущий изучаемый язык: кэш сразу, сервер
   следом. Вызывается и при входе, и при смене языка — у каждого языка
   своя переписка, и без сброса чат прошлого языка утёк бы в строку нового.
*/
async function reloadChat(){
  chatHistory = []; chatLog = [];
  $('chatBox').innerHTML = '';
  const hadLocal = restoreChat();
  const hasRemote = await syncChat();
  // приветствие пишем только когда точно знаем, что на сервере пусто:
  // иначе им можно затереть переписку, которую просто не удалось прочитать
  if(!hadLocal && !hasRemote && chatSynced) resetChat();
  renderTeacherHeader();
}

// чтение сорвалось — пробуем снова, когда пользователь открывает тренера
async function retryChatSync(){
  if(chatSynced || !session || !settings.target_lang) return;
  const had = chatLog.length > 0;
  const has = await syncChat(true);
  if(!had && !has && chatSynced) resetChat();
  if(chatSynced && chatDirty) flushChat();
}

function localChatStamp(){
  try{
    const d = JSON.parse(localStorage.getItem(chatKey()) || 'null');
    return d && d.t ? Number(d.t) : 0;
  }catch(e){ return 0; }
}

/*
   Догрузка с сервера. Возвращает true, если переписка есть — на любом
   из двух устройств. Серверная версия перетирает локальную, только если
   она свежее: иначе старый компьютер затирал бы урок, пройденный сегодня
   на телефоне.
*/
/*
   recovery=true — читаем после сорвавшейся попытки. В этом случае местное
   состояние не считается «более свежей версией»: подтверждённой основы
   у нас не было, значит это не продолжение разговора, а развилка. Побеждает
   сервер: пара реплик, набранных без сети (ответа на них всё равно
   не пришло), дешевле целого урока, пройденного на другом устройстве.
*/
async function syncChat(recovery){
  // без синхронизации сервер знать нечего — работаем как локальное приложение
  if(!session || !settings.target_lang || !dbCaps.chatSync){
    chatSynced = true;
    return chatLog.length > 0;
  }
  chatSynced = false;
  const { data, error } = await sbTry(sb.from('chat_state').select('*')
    .eq('user_id', session.user.id)
    .eq('target_lang', settings.target_lang)
    .maybeSingle(), 'errLoad');
  if(error) return chatLog.length > 0;
  chatSynced = true;

  const remoteLog = (data && Array.isArray(data.log)) ? data.log : [];
  if(!remoteLog.length) return chatLog.length > 0;

  const remoteAt = data && data.updated_at ? Date.parse(data.updated_at) : 0;
  if(!recovery && chatLog.length && remoteAt <= localChatStamp()) return true;

  chatLog = remoteLog;
  chatHistory = cleanLegacyHistory(data && data.history);
  renderChat();
  // кладём в кэш ровно то, что пришло, чтобы метка совпала с серверной
  try{
    localStorage.setItem(chatKey(), JSON.stringify({ h:chatHistory, l:chatLog, t:remoteAt || Date.now() }));
  }catch(e){}
  return true;
}

/* =========================================================================
   Разметка в ответах тренера

   Gemini отвечает markdown-ом и, когда речь заходит о разборе, ещё и
   LaTeX-ом: в пузырь чата попадали «$\rightarrow$», «**слово**» и «###».
   Просить модель писать чистым текстом мало — она сбивается на разметку
   через пару реплик, поэтому текст чистится на клиенте. Жирное и курсив
   становятся жирным и курсивом, заголовки — жирной строкой, формульные
   стрелки — обычными стрелками.
   ========================================================================= */
const TEX_SYMBOLS = {
  rightarrow:'→', to:'→', Rightarrow:'⇒', longrightarrow:'→',
  leftarrow:'←', Leftarrow:'⇐', leftrightarrow:'↔', Leftrightarrow:'⇔',
  times:'×', div:'÷', neq:'≠', ne:'≠', leq:'≤', le:'≤', geq:'≥', ge:'≥',
  approx:'≈', equiv:'≡', pm:'±', cdot:'·', bullet:'•',
  ldots:'…', dots:'…', infty:'∞', deg:'°', quad:' ', qquad:'  '
};

function deTex(s){
  return String(s)
    // снимаем обёртки формул: $…$, $$…$$, \(…\), \[…\]
    .replace(/\$\$([\s\S]*?)\$\$/g, '$1')
    .replace(/\$([^$\n]*)\$/g, '$1')
    .replace(/\\\(([\s\S]*?)\\\)/g, '$1')
    .replace(/\\\[([\s\S]*?)\\\]/g, '$1')
    .replace(/\\(?:text|mathrm|mathit|textbf)\{([^}]*)\}/g, '$1')
    // Известные команды — символом, неизвестные убираем: это разметка,
    // а не слова, и «rightarrow» посреди фразы хуже, чем ничего.
    // Пробел после команды съедается только у неизвестных: у known-символа
    // он разделяет слова, и без него выходит «→«I don't spend».
    .replace(/\\([a-zA-Z]+)( ?)/g, (m, name, sp)=>
      TEX_SYMBOLS[name] !== undefined ? TEX_SYMBOLS[name] + sp : '')
    .replace(/\\([%$&_#{}])/g, '$1');
}

// строчная разметка; на вход — уже экранированный текст
function mdInline(s){
  return s
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*\*([^*\n]+)\*\*\*/g, '<b><i>$1</i></b>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(«"])\*([^*\n]+)\*(?=$|[\s.,!?;:)»"])/g, '$1<i>$2</i>')
    .replace(/(^|[\s(«"])_([^_\n]+)_(?=$|[\s.,!?;:)»"])/g, '$1<i>$2</i>');
}

function richText(text){
  const src = deTex(String(text || ''))
    .replace(/^\s*```[a-zA-Z]*\s*$/gm, '')   // ограждения блоков кода
    .replace(/ /g, ' ');
  return src.split('\n').map(line=>{
    let s = esc(line);
    // горизонтальная черта
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) return '<i class="mdHr"></i>';
    // заголовки — просто жирная строка: в пузыре чата уровням взяться неоткуда
    const h = s.match(/^\s*#{1,6}\s+(.*)$/);
    if(h) return '<b>' + mdInline(h[1].replace(/\s*#+\s*$/, '')) + '</b>';
    // маркеры списка приводим к одной точке
    s = s.replace(/^(\s*)[-*+]\s+/, '$1• ');
    s = s.replace(/^(\s*)(?:&gt;|>)\s?/, '$1');   // цитата: esc() не трогает «>»
    return mdInline(s);
  }).join('\n');
}

let chatSepDay = '';
function dayLabel(at){
  const d = new Date(at), loc = localeOf(ifaceLang);
  let time = '';
  try{ time = new Intl.DateTimeFormat(loc, { hour:'2-digit', minute:'2-digit' }).format(d); }catch(e){}
  const day = localISO(d);
  if(day === todayISO()) return t('today') + (time ? ', ' + time : '');
  if(day === addDaysISO(-1)) return t('yesterday') + (time ? ', ' + time : '');
  try{ return new Intl.DateTimeFormat(loc, { day:'numeric', month:'long' }).format(d) + (time ? ', ' + time : ''); }
  catch(e){ return day; }
}

/* =========================================================================
   Голосовой режим Тренера

   Слушаю (3b) → отправлено, думает (3c) → отвечает голосом (3d) → снова
   слушаю. Звук с микрофона пишется сам (WAV, 16 кГц) и расшифровывается
   Gemini — тем же ключом, что и тренер. Браузерное распознавание (Web
   Speech API) не годилось: оно слушает ровно один язык, а ученик говорит
   с тренером и по-русски, и на изучаемом, часто в одной фразе; на Android
   оно ещё и само выключается через пару секунд. Отвечает тот же живой
   голос, что в чате (playVoice), с субтитрами. Весь разговор ложится
   в текстовый чат: реплики, сказанные голосом, помечены input: 'voice'.
   ========================================================================= */
const VM_RATES = [1, 0.8, 0.6];
const VM_SILENCE_MS = 1500;     // автоотправка после тишины
const VM_MAX_MS = 60e3;         // длиннее минуты — отправляем сами
const VM_WAV_RATE = 16000;      // для речи хватает, запись выходит втрое легче
const VM_LOUD = 0.10, VM_QUIET = 0.05;   // уровни 0…1 (как levelOf): голос / тишина
const VM_LH = 32;               // высота строки в блоке расшифровки
let vmVad = true, vmRate = 1;
try{
  vmVad = localStorage.getItem('worddeck_vad') !== '0';
  const r = parseFloat(localStorage.getItem('worddeck_voice_rate'));
  if(VM_RATES.indexOf(r) >= 0) vmRate = r;
}catch(e){}
const vmCanRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext));
const vm = {
  on:false, state:'', paused:false, sending:false,
  mic:null, micAn:null, recToken:0, chunks:[], spoke:false, heard:0, quiet:0, keepText:'',
  t0:0, elapsed:0, timer:null,
  ctl:null, text:'', entry:null, userNode:null, reply:'', stopped:false,
  env:0, raf:0, subsQ:[], subsCur:null, dotsT0:0,
  txt:null, txtOn:false, txtEnded:false, txtHold:0, txtRaf:0, txtHist:false, txtSkip:0, fbTok:0
};

function vmSetState(s){
  // рамка с текстом — часть экрана ответа; ушли с него — закрываем
  if(s !== 'speak') vmTxtClose();
  vm.state = s;
  const el = $('vm');
  if(el) el.dataset.state = s;

}
function vmPaintPill(){
  const p = $('vmPillTx');
  if(p) p.textContent = t('vmPill', { lang: String(settings.target_lang || '').toUpperCase() });
}
function vmFmt(ms){
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function vmElapsed(){ return vm.elapsed + (vm.paused || !vm.t0 ? 0 : Date.now() - vm.t0); }
function vmPaintTimer(){ const el = $('vmTimer'); if(el) el.textContent = vmFmt(vmElapsed()); }
function vmPaintPause(){
  $('vmStatusTx').textContent = t(vm.paused ? 'vmPaused' : 'vmListening');
  $('vmPauseTx').textContent = t(vm.paused ? 'vmResume' : 'vmPause');
}

/* ---- 3b · слушаю ---- */
function vmStartListen(){
  if(!vm.on) return;
  stopVoice();
  vmSetState('listen');
  vm.paused = false; vm.sending = false; vm.keepText = '';
  vm.chunks = []; vm.spoke = false; vm.heard = 0; vm.quiet = 0;
  vm.elapsed = 0; vm.t0 = Date.now();
  $('vm').classList.remove('paused');
  vmPaintPause(); vmPaintLive(); vmPaintTimer();
  clearInterval(vm.timer);
  vm.timer = setInterval(vmPaintTimer, 250);

}
/*
   Микрофон → анализатор (круги) и ScriptProcessor (запись и тишина).
   ScriptProcessor устарел, но работает везде, включая Safari, и не требует
   отдельного файла, как AudioWorklet. В динамик он не выводит: после него
   стоит усилитель с нулём, просто чтобы граф работал.
*/
async function vmStartRec(){
  vmStopRec();
  const my = vm.recToken;
  const ctx = unlockAudio();
  if(!ctx){ toast(t('vmNoSupport')); closeVoiceMode(); return; }
  // iOS: в режиме «только воспроизведение» микрофон молчит
  try{ if(navigator.audioSession) navigator.audioSession.type = 'play-and-record'; }catch(e){}
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  }catch(e){
    dlog('voice mode mic:', e && e.name, e && e.message);
    if(my !== vm.recToken || !vm.on) return;
    if(e && /NotAllowed|Security|NotFound|NotReadable|Abort/.test(e.name || '')) vmToPerm();
    else toast(t('vmNoSupport'));
    return;
  }
  if(my !== vm.recToken || !vm.on || vm.state !== 'listen'){ stream.getTracks().forEach(tr=>tr.stop()); return; }
  if(ctx.state === 'suspended'){ try{ await ctx.resume(); }catch(e){} }
  const src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser();
  an.fftSize = 512;
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(an);
  src.connect(proc);
  proc.connect(mute);
  mute.connect(ctx.destination);
  proc.onaudioprocess = e=>{
    if(vm.paused || vm.state !== 'listen' || vm.sending) return;
    const d = e.inputBuffer.getChannelData(0);
    vm.chunks.push(new Float32Array(d));
    let s = 0;
    for(let i = 0; i < d.length; i++) s += d[i] * d[i];
    vmVadStep(Math.min(1, Math.sqrt(s / d.length) * 5), d.length / ctx.sampleRate * 1000);
  };
  vm.mic = { stream, src, an, proc, mute, rate: ctx.sampleRate };
  vm.micAn = an;
}
function vmStopRec(){
  vm.recToken++;
  const m = vm.mic;
  vm.mic = null; vm.micAn = null;
  if(!m) return;
  m.proc.onaudioprocess = null;
  try{ m.src.disconnect(); m.proc.disconnect(); m.mute.disconnect(); }catch(e){}
  m.stream.getTracks().forEach(tr=>tr.stop());
}
/*
   Тишина — по громкости: голос дольше 150 мс — «начал говорить»; после
   этого 1,5 с тише порога — отправка (если включена в настройках).
*/
function vmVadStep(lvl, ms){
  if(lvl > VM_LOUD){
    vm.heard += ms; vm.quiet = 0;
    if(!vm.spoke && vm.heard > 150){ vm.spoke = true; vmPaintLive(); }
  }else if(lvl < VM_QUIET) vm.quiet += ms;
  if((vm.spoke && vmVad && vm.quiet >= VM_SILENCE_MS) || vmElapsed() >= VM_MAX_MS) vmSend();
}
function vmToPerm(){
  vmStopRec();
  clearInterval(vm.timer);
  vmSetState('perm');
}

/*
   Блок над кругами: до речи — подсказка, что можно на любом языке; когда
   голос услышан — «Слышу тебя»; после сбоя — сохранённая расшифровка,
   её можно отправить ещё раз, ничего не говоря.
*/
function vmPaintLive(){
  const el = $('vmLive');
  if(!el) return;
  const kept = vm.keepText && !vm.spoke;
  el.className = 'vmLiveIn' + (kept || vm.spoke ? '' : ' ph');
  el.textContent = kept ? vm.keepText : t(vm.spoke ? 'vmHearYou' : 'vmSpeakAny');
  const lines = Math.max(1, Math.round(el.scrollHeight / VM_LH));
  el.style.transition = reduceMotion() ? 'none' : 'transform .45s cubic-bezier(.2,.8,.2,1)';
  el.style.transform = 'translateY(' + (-(lines - 1) * VM_LH) + 'px)';
}
function vmTogglePause(){
  if(vm.state !== 'listen') return;
  if(vm.paused){
    vm.paused = false; vm.t0 = Date.now(); vm.quiet = 0;
  }else{
    vm.elapsed = vmElapsed(); vm.t0 = 0; vm.paused = true;
  }
  $('vm').classList.toggle('paused', vm.paused);
  vmPaintPause(); vmPaintTimer();
}
function vmCancel(){ closeVoiceMode(); }

/* ---- 3c · отправлено: расшифровка, потом запрос тренеру ---- */
// этапы: 1 — расшифровываем, 2 — готовим ответ
function vmSteps(n){
  const s2i = $('vmS2i'), s3i = $('vmS3i');
  s2i.className = n >= 2 ? 'ok' : 'spin';
  $('vmS2t').textContent = t(n >= 2 ? 'vmStepText' : 'vmStepTexting');
  s3i.className = n >= 2 ? 'spin' : 'wait';
}
async function vmSend(){
  if(!vm.on || vm.state !== 'listen' || vm.sending) return;
  vm.sending = true;
  const took = vmElapsed();
  clearInterval(vm.timer);
  const rate = vm.mic ? vm.mic.rate : 48000;
  const chunks = vm.chunks, spoke = vm.spoke, kept = vm.keepText;
  vm.chunks = [];
  vmStopRec();
  if(!spoke){
    // ничего не сказано: после сбоя — повтор сохранённого текста, иначе «не расслышал»
    if(kept){ vmGoThink(took); vmDeliver(kept); return; }
    toast(t('vmNotHeard'));
    vmStartListen();
    return;
  }
  vmGoThink(took);
  let text = '';
  try{ text = await vmTranscribe(vmWav(chunks, rate)); }
  catch(e){
    if(!vm.on || vm.state !== 'think') return;
    dlog('voice mode stt:', e);
    toast(t(e && (e.code === 'network' || isNetworkError(e)) ? 'vmNoNet' : friendlyError(e)));
    vmStartListen();
    return;
  }
  if(!vm.on || vm.state !== 'think') return;     // пока расшифровывали, вышли
  if(!text){ toast(t('vmNotHeard')); vmStartListen(); return; }
  vmDeliver(text);
}
function vmGoThink(took){
  $('vmStepRec').textContent = t('vmStepRec', { t: vmFmt(took) });
  document.querySelector('.vmMine').classList.add('hidden');
  vmSteps(1);
  vm.dotsT0 = performance.now();
  vmSetState('think');
}
function vmDeliver(text){
  vm.text = text; vm.reply = ''; vm.stopped = false;
  $('vmMineTx').textContent = text;
  document.querySelector('.vmMine').classList.remove('hidden');
  document.querySelector('.vmMine .fix').classList.remove('hidden');
  vmSteps(2);
  // реплика — в общий чат, с пометкой, что сказана голосом
  vm.userNode = pushMsg('user', text);
  vm.entry = chatLog[chatLog.length - 1] || null;
  if(vm.entry && vm.entry.role === 'user' && vm.entry.text === text){ vm.entry.input = 'voice'; saveChat(); }
  else vm.entry = null;
  const ctl = { cancelled:false };
  ctl.onAnswer = reply=>{ if(vm.ctl === ctl && vm.on) vmSpeak(reply); };
  ctl.onError = e=>{ if(vm.ctl === ctl && vm.on) vmBackToListen(e); };
  vm.ctl = ctl;
  askTrainer(text, false, true, ctl);
}

// записанные куски (Float32, частота контекста) → WAV 16 кГц моно в base64
function vmWav(chunks, rate){
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const all = new Float32Array(total);
  let o = 0;
  chunks.forEach(c=>{ all.set(c, o); o += c.length; });
  const ratio = Math.max(1, rate / VM_WAV_RATE), outRate = Math.round(rate / ratio);
  const n = Math.floor(total / ratio);
  const buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const str = (p, s)=>{ for(let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 2, true);
  // понижение частоты усреднением — заодно простой фильтр от наложения
  for(let i = 0; i < n; i++){
    const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio));
    let s = 0;
    for(let j = a; j < b; j++) s += all[j];
    const v = Math.max(-1, Math.min(1, b > a ? s / (b - a) : 0));
    dv.setInt16(44 + i * 2, v < 0 ? v * 32768 : v * 32767, true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/*
   Расшифровка — текстовой моделью Gemini, звук идёт частью запроса.
   Языков два: родной и изучаемый, и в одной фразе они смешиваются —
   каждое слово пишется на том языке, на котором сказано. Модели gemma
   звук не принимают, их пропускаем; больше двух попыток не тратим.
*/
function vmLangName(code){
  try{ return new Intl.DisplayNames(['en'], { type:'language' }).of(code) || code; }catch(e){ return code; }
}
async function vmTranscribe(b64){

  const order = modelOrder().filter(m => !/gemma/i.test(m)).slice(0, 2);
  if(!order.length) throw aiError('nomodel');
  const nat = vmLangName(settings.native_lang || 'ru'), tgt = vmLangName(settings.target_lang || 'en');
  const prompt = 'Transcribe this voice message verbatim. The speaker is a ' + nat + ' speaker learning ' + tgt
    + '. They may speak ' + nat + ', ' + tgt + ', or mix both in one sentence: write every word in the language it was'
    + ' actually spoken, in that language\'s normal script. Do not translate, do not answer, do not fix grammar or'
    + ' pronunciation mistakes. Output only the transcript, with no quotes or comments. If there is no intelligible'
    + ' speech, output nothing.';
  let last = null;
  for(const model of order){
    try{
      const text = await aiProvider().generate({
        key, model, system:'', gc:{ temperature:0 },
        contents:[{ role:'user', parts:[{ inlineData:{ mimeType:'audio/wav', data:b64 } }, { text: prompt }] }]
      });
      noteModelOk(model);
      return String(text || '').replace(/^\s*(transcript(ion)?\s*:)\s*/i, '').replace(/^["«“]+|["»”]+$/g, '').trim();
    }catch(e){
      last = (e && e.code) ? e : (isNetworkError(e) ? aiError('network', 0, e.message) : aiError('http', 0, e && e.message));
      dlog('voice mode stt:', model, last.code, last.detail || '');
      noteModelFail(model, last);
      if(last.code === 'key' || last.code === 'network' || last.code === 'region') break;
    }
  }

}

function vmSpeak(reply){

function vmSpeechEnded(){

function vmFallbackSpeak(plain, from){
  if(!vm.on) return;
  vmSetState('speak');
  const text = plain.slice(0, 1200);
  if(from == null){
    vmTxtSet(vmTxtBuild([text], plain.slice(text.length)), plain);
    vm.txt.fb = true;
  }
  const off = from || 0;
  if(!canSpeak()){
    vm.subsQ = [{ i:0, text, at:0, dur:1, clock:'perf' }];
    vmSubsAllDone();
    return;
  }
  const synth = window.speechSynthesis;
  try{ synth.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text.slice(off));
  u.lang = localeOf(settings.native_lang || 'en');
  const v = pickVoice(u.lang);
  if(v) u.voice = v;

  const dur = Math.max(1.5, text.length / 14 / vmRate);
  const q = { i:0, text, at: performance.now() / 1000 - dur * off / (text.length || 1), dur, clock:'perf' };
  if(off) q.char = off;
  vm.subsQ = [q];
  // onend прерванной фразы может прийти уже после старта новой — свой номер у каждой
  const my = ++vm.fbTok;
  u.onboundary = e=>{ if(my === vm.fbTok) q.char = off + e.charIndex; };
  u.onend = ()=>{ if(my !== vm.fbTok || !voiceFallbackOn) return; voiceFallbackOn = false; vmSpeechEnded(); };

/*
   Субтитры и полный текст идут по одной модели: ответ разбит на фразы,
   у каждой фразы и каждого слова — доля от начала и конца своего куска
   голоса. У Gemini нет таймкодов слов, поэтому место внутри куска — это
   доля пройденного времени: длинные слова звучат дольше. Голос браузера
   сообщает границы слов сам.

const VM_SENT_RE = /[^.!?…。！？\n]+(?:[.!?…。！？]+[)"»”'’]*)?/g;
// мини-задание: «Переведи…» и похожее на языках интерфейса
const VM_TASK_RE = /переведи|переведите|переклади|перекладіть|как сказать|скажи по-|задани|translate|how would you say|how do you say|your task|traduc|tradui|übersetz|tradu[zç]|翻译|翻訳|번역|ترجم|çevir/i;

function vmTxtBuild(chunks, tail){
  const sents = [];
  const add = (str, q)=>{
    const len = str.length || 1;
    let m, pend = -1, pendEnd = -1;
    VM_SENT_RE.lastIndex = 0;
    while((m = VM_SENT_RE.exec(str))){
      const raw = m[0].trim();
      if(!raw) continue;
      const c0 = m.index + m[0].indexOf(raw.charAt(0)), c1 = c0 + raw.length;
      // «1.», «2)» и прочие обрывки без слов — в начало следующей фразы
      if(/^[\d\s.)(\-–—•*#]+$/.test(raw)){ if(pend < 0) pend = c0; pendEnd = c1; continue; }
      sents.push({ q, c0: pend >= 0 ? pend : c0, c1 });
      pend = -1;
    }
    // обрывок в самом конце — к предыдущей фразе
    const lastS = sents[sents.length - 1];
    if(pend >= 0){ if(lastS && lastS.q === q) lastS.c1 = pendEnd; else sents.push({ q, c0: pend, c1: pendEnd }); }
    sents.filter(s => s.q === q).forEach(s=>{
      s.text = str.slice(s.c0, s.c1);
      s.a = s.c0 / len; s.b = s.c1 / len;
      s.words = [];
      const re = /\S+/g;
      let w;
      while((w = re.exec(s.text))) s.words.push({ t: w[0], a: (s.c0 + w.index) / len, b: (s.c0 + w.index + w[0].length) / len });
    });
  };
  chunks.forEach((c, i) => add(c, i));
  if(tail && tail.trim()) add(tail, -1);
  // задание и всё, что внутри незакрытых кавычек после него
  let open = 0, any = false;
  sents.forEach(s=>{
    if(!(open > 0 || VM_TASK_RE.test(s.text))){ open = 0; return; }
    s.task = any = true;
    open = Math.max(0, open + (s.text.match(/[«“]/g) || []).length - (s.text.match(/[»”]/g) || []).length);
  });
  // явного задания нет — выделяем последний вопрос: на него и отвечать
  if(!any){
    const voiced = sents.filter(s => s.q >= 0);
    const last = voiced[voiced.length - 1];
    if(last && /[?？]["»”'’)]*$/.test(last.text)) last.task = true;
  }
  return { sents, k:-1, w:-1, sub:null, fb:false };
}
function vmTxtSet(T, plain){
  vm.txt = T; T.plain = plain;
  const list = $('vmTxtList');
  list.innerHTML = '';
  T.sents.forEach((s, j)=>{
    // озвученная фраза — кнопка «прослушать снова»; хвост сверх лимита голоса — просто текст
    const el = document.createElement(s.q >= 0 ? 'button' : 'div');
    el.className = 'vmS' + (s.task ? ' task' : '');
